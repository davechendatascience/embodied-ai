# Overrides deep-merged onto third_party/ReKep/configs/config.yaml.
# Upstream's file stays pristine; anything we change lives here.

constraint_generator:
  # backend: anthropic | openai | openai_compat | qwen_local
  #                                    (src/rekep_libero/vlm_backends.py)
  #
  # Chosen after a head-to-head on robosuite Lift, same image and prompt:
  #   qwen3-vl   7.3s  -> 1 stage (grasp, NO lift) so robosuite's success check
  #                       (cube_height > table + 0.04) could never pass; on a
  #                       rerun it emitted `grasp_keypoints = [0  # comment]`,
  #                       which crashes ReKep's int() parser.
  #   opus-5     7.3s  -> 2 stages with a 20cm lift in stage 2. Correct.
  # Same latency. Constraints are generated once per task, so an API call here
  # is a build-time cost, not a per-step one.
  # Needs ANTHROPIC_API_KEY (or an `ant auth login` profile).
  backend: anthropic
  model: claude-opus-5
  effort: high
  base_url: http://localhost:11434/v1   # only read by openai_compat
  # qwen3-vl reasons before answering, and ollama 0.30.10 ignores both
  # `think: false` and `/no_think` for it (measured: 986 vs 994 chars of
  # thinking either way). Prefilling a closed thinking block as the start of
  # the assistant turn bypasses it -- 0 reasoning chars, answer produced
  # directly, 232.8s -> 25.8s on ReKep's own prompt.
  prefill: "<think>\n\n</think>\n\n"
  # ReKep's answer alone runs ~1-2k tokens; upstream's 2048 was sized for a
  # non-reasoning GPT-4o and leaves no headroom.
  max_tokens: 8192
  temperature: 0.0
  # An 8B model holds ReKep's long output format less reliably than GPT-4o. If
  # any of these are absent the parser dies with "num_stages not found in
  # output"; retry with an explicit reminder instead.
  required_markers:
    - "num_stages ="
    - "grasp_keypoints ="
    - "release_keypoints ="
  max_retries: 3

# LIBERO tabletop workspace, replacing upstream's OmniGibson Rs_int bounds.
# Measured from the running sim (scripts/measure_workspace.py, libero_spatial
# tasks 0-2): every object sits on the table at z=0.97, ee home at z=1.173,
# objects spanning x [-0.213, 0.143], y [-0.076, 0.324].
# y is widened to a symmetric +/-0.45 because object placement mirrors across
# tasks and suites; x/z follow the measurement plus reach margin.
workspace:
  bounds_min: [-0.40, -0.45, 0.77]
  bounds_max: [0.35, 0.45, 1.37]

grasp:
  # analytic        PCA on the object cloud: pinch across the narrowest
  #                 horizontal axis. No dependencies, near-optimal on boxes,
  #                 blind to where on an object to grip -- it centres a bowl
  #                 grasp on the empty middle and cannot see a mug handle.
  # contact_graspnet  the model the robot already runs (wardmate_ws
  #                 llm_robot_control, whose ROS package is confusingly named
  #                 `graspgen`; it is NOT NVIDIA GraspGen, which pins
  #                 torch==2.1.0 and has no cp312 aarch64 wheel). Shares that
  #                 project's weights at ~/contact_graspnet_pytorch.
  #
  # Measured on robosuite Lift, fingertips vs the cube's true centre:
  #   analytic          lateral  8.2 mm | width 56.7 mm
  #   contact_graspnet  lateral 15.6 mm | width 40.7 mm | 25 candidates, 0.6 s
  # PCA wins on lateral accuracy for a box, which is the geometry it is exactly
  # right for; CGN's width is the more honest one (the cube is 41.8 mm, so
  # PCA's 56.7 mm is cloud-noise spread, not the object). Left on `analytic`
  # because Lift is a box; switch per-run with `--grasp contact_graspnet`.
  proposer: analytic

main:
  # Upstream's 0.10 m is sized for the OmniGibson Fetch's long gripper. The
  # Panda's fingers span only ~0.069 m, and the sequence is: hover
  # +grasp_depth/2 above the keypoint, then descend grasp_depth. At 0.10 that
  # lands 5 cm BELOW a bowl centred at z=0.970 -- i.e. into the table.
  # 0.05 hovers 2.5 cm above and closes 2.5 cm below the centre.
  grasp_depth: 0.05

# Solver budgets. Upstream defaults (sampling_maxfun 5000 / maxiter 200) are
# tuned for a real robot where a better path is worth seconds of thinking.
# Measured on libero_spatial task 0, one path solve:
#     5000/200 -> 7.17s  cost 63.33
#     2000/100 -> 2.91s  cost 63.91
#     1000/50  -> 1.47s  cost 65.84
#      500/30  -> 0.75s  cost 64.48   <- 9.6x faster for +1.8% cost
#      200/20  -> 0.31s  cost 75.75   <- cost cliff, do not go below 500
# 54% of a solve was inside IK across 15,003 sequential calls, so the budget
# is what drives the cost, not the per-call speed.
path_solver:
  sampling_maxfun: 500
  minimizer_options:
    maxiter: 30

subgoal_solver:
  sampling_maxfun: 500
  minimizer_options:
    maxiter: 30

libero:
  task_suite: libero_spatial
  task_id: 0
  robot: Panda          # swap to UR5e for the cross-embodiment run
  resolution: 256
  camera: agentview

# robosuite Lift workspace (its table sits lower than LIBERO's). Used only by
# --backend robosuite, the graspable-object control case: a 0.043 m cube in a
# 0.068 m gripper, versus LIBERO tableware at 0.107-0.178 m.
robosuite_workspace:
  bounds_min: [-0.35, -0.35, 0.78]
  bounds_max: [0.35, 0.35, 1.30]
