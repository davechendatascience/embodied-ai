# Declarations for the consistency-belief MCP: the design reasoning behind the teacher,
# as a proof DAG rooted in what this project has measured or requires.
#
# Like belief.yaml this file is the approval gate: the server reads it from git HEAD, so
# nothing here counts until a human commits it.
#
# The two ledgers are paired. belief.yaml (component-belief) records whether the teacher
# WORKS: tests run through its run_test and land as measured trials. This file records
# whether the reasons we give for the design FOLLOW from their premises. A branch is proven
# only by adversarial probes (verify_step) that fail to find a counterexample, run by a
# reviewer other than the one who wrote it, and it is only worth anything while its
# contract's evidence holds.
#
# WHERE THE COMPONENTS ARE. Every branch carries `subject:`, and that names a component
# declared in belief.yaml -- the same id under which that component's code paths, contracts
# and measurements live. The branches below are grouped by it, one banner per component, and
# `derivation_rule` names the `evidence:` contract that measures the claim. consistency-belief
# checks both ends at load: a subject belief.yaml no longer declares is REMOVED_SUBJECT (the
# component was deleted or renamed, so the design governs nothing), a subject in prose is
# UNATTACHED_SUBJECT, and a CMP-/CTR- id cited in derivation_rule that belief.yaml does not
# declare is UNKNOWN_EVIDENCE. `status(view="coverage")` lists every component from both files
# at once: governed (code and a declared branch), undeclared design (code nobody justified),
# planned (a design declared before anything is built). Axioms, definitions and lemmas carry
# no subject: they are the shared ground the components' designs are built on.

# The components these designs govern, in the order they appear below. belief.yaml owns each one
# -- its purpose, code paths and contracts -- so this list is an import, and every branch's
# subject must be one of them. `status(view="coverage")` shows both files side by side.

components:
  - {id: CMP-scene-randomizer, note: "resets, layouts and what a policy reads -- one execution core, two environments"}
  - {id: CMP-twist-servo, note: "the twist servo and the joint ramp every policy's action goes through"}
  - {id: CMP-skill-library, note: "the hand-written skill teacher that still drives the student's demonstrations"}
  - {id: CMP-vla-student, note: "the Panda VLA on Qwen3-VL-2B -- recorded-motion labels, the twist decode, one interface"}

axioms:
  - id: AXM-libero-scores-final-state
    domain: environment
    statement: >-
      Success is LIBERO's own predicate evaluated on the simulator state: In(obj, region)
      is containment of the object's origin, plus contact when the region is an object (for
      a site region -- the basket's contain region, a drawer's -- check_contact is always
      true, so containment alone); On(obj, site) is the origin within the site's footprint
      and height band, plus contact with the site's parent object when it has one;
      Open/Close/TurnOn/TurnOff compare one joint to a threshold.
    rationale: >-
      A reimplemented predicate drifted from the scorer: a box test called In true with
      the can 8 mm above the basket rim while LIBERO scored the episode a failure.

  - id: AXM-dagger-needs-markov-labels
    domain: requirement
    statement: >-
      The teacher must be able to label any state the student reaches, so its action is a
      function of the current state (and of decisions re-derivable from it), never of the
      history of the episode or of previous episodes.
    rationale: DAgger relabels student-visited states; a history-dependent label is undefined there.

  - id: AXM-one-execution-path
    domain: requirement
    statement: >-
      Demonstrations, DAgger rollouts and evaluation execute actions through the same
      servos and the same action decode.
    rationale: >-
      Relabelling command-mode data and testing through the servo was a train/test mismatch
      that invalidated a round of results.

  - id: AXM-servo-tracks-reachable-poses
    domain: physics
    statement: >-
      The twist servo tracks a commanded pose only where the arm has a converged IK
      solution with room to move (smallest singular value and joint margin bounded away
      from zero) and is not inside a fixture; elsewhere it clamps on joint limits and
      re-anchors its reference, and the tool does not follow the command.
    rationale: Measured repeatedly as re-anchor and clamp counts rising while the tool stalls.

  - id: AXM-panda-gripper-geometry
    domain: physics
    statement: >-
      The Panda's gripping surfaces are its pads, reaching from 4.4 mm past to 11.6 mm
      behind the tool point; its finger meshes reach 9.3 mm past it and its palm begins
      31 mm behind it. Each finger is a position servo (1000 N/m toward closed, capped at
      20 N), so the squeeze on an object scales with how far each finger is held from closed.
    rationale: >-
      Measured from the exact collision geometry (sim/scan.py; the earlier 5 mm / 40 mm
      came from a box helper that mis-sized every mesh) and read from the MJCF actuators.

  - id: AXM-libero-resamples-fixtures
    domain: environment
    statement: >-
      Every env.reset() re-samples fixture poses from numpy's global RNG and writes them to
      model.body_pos and model.body_quat of fixture root bodies attached to the world, and to
      no other model field; set_init_state restores neither.
    rationale: >-
      Two unseeded resets moved the wooden cabinet 12 mm apart. Across 30 tasks (libero_goal,
      spatial and object 0-9), episodes and instances differ only in fixture root bodies'
      body_pos and body_quat -- all 10 libero_spatial tasks re-sample body_quat too, and
      libero_object re-samples nothing (TRL-0240).

  - id: AXM-libero-init-states-record-a-panda
    domain: environment
    statement: >-
      LIBERO's initial states are flattened MuJoCo states recorded with LIBERO's Panda and its
      PandaGripper: the time, then qpos -- the Panda's seven arm joints and its two finger joints
      first, then every object joint in the model's joint order -- then qvel in the same order. With
      another arm registered as this project registers it (UR5e, IIWA, Kinova3 or Jaco), in every one
      of the 130 tasks: the model's object joints are the Panda model's -- the same joints, of the
      same types and widths, in the same qpos order -- so the recorded object block maps onto them
      joint by joint; the rest of the scene is the Panda model's too -- every body, geom and site that
      is not the robot's, with its name, parent, mass, shape, size, mesh, contact filter, friction and
      pose, except the poses of bodies attached to the world, which the reset re-samples -- so
      registering an arm changes only the robot; the robot's base body stands at exactly the world
      pose the Panda's base stands at, so a pose given in the Panda's base frame is the same world
      pose in that arm's base frame; and the environment's resets are not deterministic in robosuite's
      sense, on any arm.
    rationale: >-
      Measured 2026-09-26 on the four arms in all 130 tasks: the object joints (name, type, qpos
      width, in qpos order) are identical to the Panda model's; a digest of every non-robot body
      (name, parent, mass, pose unless attached to the world), geom (type, size, pose, contype,
      conaffinity, friction, mesh name and vertex count) and site (name, type, size, pose) equals the
      Panda's -- mesh indices alone differ, shifted by the robot's meshes before them; robot0_base's
      world position and quaternion are identical to the Panda's (difference exactly 0), at four
      distinct Panda base poses across the scenes; deterministic_reset is False in every task on every
      arm.

  - id: AXM-robot-reset-draws-per-joint
    domain: environment
    statement: >-
      In a reset that is not deterministic, the draws from numpy's global generator before LIBERO
      samples its fixture and object placements are robosuite 1.4.0's robot reset's alone: one
      standard normal per entry of the robot's init_qpos, which has one entry per arm joint (7 on the
      Panda, IIWA, Kinova3 and Jaco; 6 on the UR5e). LIBERO's placement samplers then read that
      generator and the task's scene -- its objects, fixtures and regions as the model declares them
      -- and neither the robot nor the fixture poses an earlier reset wrote: the poses they write are
      a function of the generator's state at their entry and the task. numpy's legacy generator draws
      normals as one sequence: n normals drawn over several calls leave it where n drawn in one call
      do.
    rationale: >-
      Traced 2026-09-26 on libero_10 0 by wrapping every numpy.random function during a reset: the
      Panda and IIWA draw randn(7) from robosuite's single_arm.py, the UR5e randn(6), then the region
      and placement samplers draw identically. With one normal drawn before the UR5e's reset the
      generator's state at the sampler's entry hashes the same on all three arms, and every fixture
      and object root body stands at the same pose at placement (11 of 11 bodies, difference exactly
      0). After resets under three other seeds moved the fixtures up to 18.6 mm, a reset seeded as
      before wrote the same fixture poses exactly, on the Panda and the UR5e, in 16 tasks over the
      four suites.

  - id: AXM-servo-pins-when-blocked
    domain: physics
    statement: >-
      Call the arm pinned at a step when the servo's joint reference leads the measured joints by at
      least 0.095 rad on some joint (its lead cap is 0.1 rad) while every arm joint moves slower than
      0.05 rad/s. Over the Panda teacher's 40 matrix episodes (libero_spatial, object, goal and 10,
      init 0, all successful) the arm is pinned on 5 of 7,160 steps, in one run of 5. Over the
      corrected cross-embodiment matrix (UR5e, IIWA, Kinova3, Jaco, the same 40 tasks each) no
      successful episode is pinned at all; the failures are pinned on 3,771 steps, in runs of up to
      733, and at 3,680 of them some robot contact is unintended in DEF-intended-contact's sense. A
      pinned arm stays pinned while its command keeps pressing the same way.
    rationale: >-
      Measured 2026-09-26 at 2c371d4 with screwhead/sim/intent.py:
      runs/matrix_{UR5e,IIWA,Kinova3,Jaco}. What pins the arm, per failure: the UR5e's forearm on the
      cabinet base (goal 5) and on the wine rack (libero_10 3), and against its own gripper (goal 0);
      the Kinova3's hand on the cabinet's other drawer (libero_10 3), its fingers on the moka pot
      (libero_10 2), its hand in the microwave (libero_10 9); the Jaco's fingertips on the moka pot
      (libero_10 2) and its finger against its second link (libero_10 9). The IIWA's failures are
      frozen at a joint limit or loop, not pinned.

  - id: AXM-joint-controller-law
    domain: environment
    statement: >-
      robosuite 1.4.0's JOINT_POSITION controller, as SimArm runs it, commands at every physics
      substep the arm torques clip(M(q) (kp (q_goal - q) - kd q') + b(q, q'), actuator limits): q_goal
      the joint goal the execution layer sets (ramped across the control period), q and q' the
      measured joints and their rates, M the joint-space inertia, b MuJoCo's bias forces (gravity,
      Coriolis and centrifugal), kp = 4000 on every arm joint and kd = 2 sqrt(kp). The only term that
      drives the arm towards anything is kp (q_goal - q): with the goal at the measured joints the
      command is the bias less the damping, which holds the arm where it stands.
    rationale: >-
      robosuite/controllers/joint_pos.py run_controller (desired torque = position error x kp +
      velocity error x kd, times the mass matrix, plus torque_compensation = qfrc_bias), single_arm.py
      (clipped to the actuator range); SimArm's set_joint_gains sets kp and kd each period.

  - id: AXM-libero-demos-record-a-panda
    domain: environment
    statement: >-
      LIBERO's human demonstrations, 50 per task for all 130 tasks, each record the flattened
      simulator states the demonstration passed through, in the layout of the task's test initial
      states (the Panda's seven arm joints and two finger joints, then the object joints in the
      model's order; AXM-libero-init-states-record-a-panda), and the model the demonstration was
      recorded with, whose fixture poses its states were recorded against. Written into the task's
      model with those fixture poses, a demonstration's recorded states are the states it was recorded
      in.
    rationale: >-
      Measured 2026-09-26 over all 130 demonstration files (6,500 demonstrations): every first state
      has the test initial states' length and every demonstration carries its recorded model
      (model_file). tools/demo_survey.py: libero_goal 9's recorded final states satisfy LIBERO's
      predicate in 50 of 50 demonstrations when the recorded fixture poses are written into the model,
      and in 13 of 50 without them.

  - id: AXM-libero-demos-record-their-actions
    domain: environment
    statement: >-
      Each of LIBERO's human demonstrations records, per step, the action it executed through
      robosuite's controller. The action's last entry is the Panda gripper's command, which robosuite
      reads by sign: a positive command closes the fingers and a negative one opens them. In the
      demonstrations that command takes only the values -1 and +1.
    rationale: >-
      Measured 2026-09-26 on 100 demonstrations (the first 10 of every 13th of the 130 task files):
      all 15167 gripper entries are -1 or +1. Over the five steps after a +1 the finger aperture
      shrank on 37% of steps and widened on 14% (mean -3.0 mm; a held object stops the fingers);
      after a -1 it widened on 70% and shrank on 8% (mean +1.1 mm). robosuite 1.4.0's PandaGripper
      moves its finger target toward the command's sign (AXM-robosuite-gripper-target-persists).

  - id: AXM-robosuite-step-observes-the-period-end
    domain: environment
    statement: >-
      robosuite 1.4.0's env.step returns, for LIBERO's observables (the arm and finger joints, the
      objects, the cameras; sampled at the control rate with no delay), the state the control period it
      ran ended in -- unless an observation was forced (_get_observations(force_update=True)) since the
      previous step: a forced read marks the observables sampled for their current sampling period, and
      env.step then returns values sampled before the period it ran had ended. A forced read itself
      reports the state as it stands.
    rationale: >-
      Measured 2026-09-26 on libero_spatial 0 (30 steps of random actions): with nothing forced between
      steps, env.step's arm joints equal the end-of-period state exactly (0 rad); with a forced read
      between steps they trail it by 0.0007-0.037 rad, and in demonstration replays through
      SimArm.execute, which forces a read at the start of every step, by up to 0.145 rad. LIBERO's own
      stored observations, returned by env.step with nothing forced (create_dataset.py), equal the next
      recorded state exactly (AXM-libero-demo-observations-follow-their-actions). Replaces
      AXM-robosuite-step-observation-starts-the-period, which read the sampling rule as sampling at a
      period's first substep and was measured wrong.

  - id: AXM-libero-demo-observations-follow-their-actions
    domain: environment
    statement: >-
      In LIBERO's demonstration files the observation stored at step j -- both camera images, the joint,
      finger and end-effector states -- is the one env.step returned when the recorded action j was
      replayed from the recorded state j, with nothing forced between steps, and its arm joints equal the
      recorded state j+1: each stored observation shows the state its step's action led to. The first
      recorded state has no stored observation.
    rationale: >-
      LIBERO's scripts/create_dataset.py replays each demonstration's actions with env.step and stores the
      observation each step returns alongside that step's action and recorded state. Measured 2026-09-26
      on the first 10 demonstrations of the first task file of libero_spatial, libero_goal and libero_10
      (4941 steps): the stored arm joints equal the recorded state j+1 exactly (0 rad) and differ from
      state j by 0.019-0.029 rad (median).

  - id: AXM-libero-soft-reset-state
    domain: environment
    statement: >-
      With robosuite's hard_reset off, as SimArm opens LIBERO, env.reset() returns every MjData
      field to the model's defaults (sim.reset(), that is mj_resetData) and rebuilds the robot's
      controller; set_init_state then writes the flattened simulator state and runs a forward
      pass. Between episodes the model's fields change only as AXM-libero-resamples-fixtures
      says. Of the simulator's, robosuite's and LIBERO's state, what survives a reset and can
      change the next episode's trajectory is exactly the controller's cache
      (AXM-robosuite-controller-cache), the gripper's finger target
      (AXM-robosuite-gripper-target-persists) and numpy's global generator
      (AXM-libero-resamples-fixtures).
    rationale: >-
      Read from robosuite 1.4.0's environments/base.py (reset calls sim.reset() when hard_reset
      is off, then _reset_internal) and LIBERO's env_wrapper.py (set_init_state: set_state, then
      forward). That nothing else carries over is measured, not read: once those three were
      anchored or seeded, teacher episodes in TaskEnv were bit-identical across up to 10 process
      histories (CTR-execution-reproducible), and each of the three, left alone, changed an
      episode (the three axioms' own measurements).

  - id: AXM-handle-shares-body
    domain: environment
    statement: >-
      A fixture's handle is one geom of the MuJoCo body it moves (the drawer's bar and its
      face are one body; so are the stove knob's box and the rest of its button), so contact
      with that body does not say the fingers are on the handle.
    rationale: Read from the scene; replayed, fingertips pressed on the drawer face counted as contact with the drawer.

  - id: AXM-grip-fixes-object-in-hand
    domain: physics
    statement: >-
      While an object is held without slipping, its pose relative to the tool does not
      change, and both poses are in the simulator state at every step (a privileged input:
      the teacher reads object poses from the simulator, which the student will not).
    rationale: The teacher's object poses come from Scene.body_pose / object_box, i.e. MuJoCo state.

  - id: AXM-support-scannable
    domain: environment
    statement: >-
      For a region open from above, the surface an object will rest on at a target position
      is the first collision geometry that downward rays over the object's footprint there
      meet; the teacher reads that geometry from the simulator (privileged, like object
      poses). Enclosed regions -- under a shelf board, inside a microwave -- are not found
      this way: a downward ray meets the ceiling first.
    rationale: The drop-point search and clearing.py already locate open surfaces with mj_ray.

  - id: AXM-release-is-free-fall
    domain: physics
    statement: >-
      Once the jaws open, an object not yet resting on a support falls; from a gap h it lands
      at sqrt(2 g h) (20 mm: 0.63 m/s) and can bounce, tip or slide out of its target.
    rationale: >-
      Measured at 4edb9d0 (tools/teacher_motion.py): deliberate releases 14-29 mm (up to 88)
      above the surface, the bowl already falling at 0.1-0.24 m/s.

  - id: AXM-static-stability
    domain: physics
    statement: >-
      A rigid object released at rest on fixed supports, every contact's normal within the angle from
      vertical whose tangent is that contact's friction coefficient (so no contact slides), stays at
      rest if the vertical line through its centre of mass passes inside the convex hull, in plan, of
      its contact points and that hull has an interior (three contacts not on one line). If its
      contacts lie on one line (a cylinder on its side) and the contacts have no rolling friction, it
      stays at rest only if that vertical passes through the line and the support is level across it;
      on any slope it rolls. Where a normal lies outside its friction angle -- a bottle cradled between a
      rack's bars -- this is not the criterion; the general one is that gravity's wrench lies in the cone
      of the contacts' friction wrenches.
    rationale: >-
      Classical rigid-body statics (the support-polygon criterion, and neutral equilibrium of a
      cylinder on a level plane). MuJoCo's contacts are soft, so the hull is that of the contacts the
      solver reports, within their penetration; AXM-libero-contact-parameters gives the friction and
      the absence of rolling friction here.

  - id: AXM-geom-distance-exact
    domain: environment
    statement: >-
      MuJoCo 3.8.1's mj_geomDistance is not the distance between two box geoms: for two boxes whose
      nearest points were 95 mm apart it returned 0 with a distmax of 0.3. No distance between boxes is
      read from it.
    rationale: >-
      Measured 2026-09-24 while building the box world. Restated from an axiom that it returns the
      smallest signed distance between the shapes MuJoCo collides whenever that is below distmax; every
      object LIBERO's goals place collides as boxes (AXM-libero-objects-are-boxes), exactly where that
      failed.

  - id: AXM-contacts-damp-residual-motion
    domain: environment
    statement: >-
      An object that satisfies AXM-static-stability's condition on fixed supports (either case) and
      moves no faster than the scene's rest speed comes to rest without leaving its contact hull, or on a
      level line of contacts without leaving that line: MuJoCo's contacts
      are damped (solref's time constant, 0.02 s by default), and the residual motion of a statically
      stable object decays under them.
    rationale: >-
      MuJoCo's soft-contact model; the same rest speed ends the settling of every LIBERO initial state
      this project loads (SimArm._settled_init_state), whose objects then stay put.

  - id: AXM-libero-contact-parameters
    domain: environment
    statement: >-
      In the models of all 130 LIBERO tasks this project runs: every collision geom not of the robot has
      sliding friction 0.6, 0.95 or 1.0, and the robot's 1.0; no explicit contact pair is declared, so a
      contact's friction is the larger of its two geoms' (MuJoCo's default) and at least 0.6, and a
      contact whose normal lies within atan(0.6) = 31 deg of vertical does not slide under the
      object's weight alone; every geom's contact margin is at most 1 mm and its gap 0, so contacts
      exert force from up to 2 mm apart; condim is 3 everywhere, so contacts have no torsional or
      rolling friction; solref time constants are 0.001 or 0.02 s with damping ratio 1.
    rationale: >-
      Read from each task's compiled model on 2026-09-24 (12,239 non-robot collision geoms;
      MjModel.geom_friction, geom_margin, geom_gap, geom_condim, geom_solref, npair).

  - id: AXM-libero-objects-are-boxes
    domain: environment
    statement: >-
      In all 130 LIBERO tasks this project runs, every collision geom of every object an On or In goal
      places is a box primitive: bowls, mugs, cans, bottles, books, pans, pots and plates collide as
      unions of boxes. Such an object touches a support along faces, edges or corners of boxes, never
      along the smooth line of a cylinder or capsule.
    rationale: >-
      Read from each task's compiled model on 2026-09-24 (MjModel.geom_type of the collision geoms of
      every placed object's root body and its children: 22 categories, all boxes).

  - id: AXM-servo-lead-bounds-travel
    domain: physics
    statement: >-
      The servo integrates the commanded twist on to a reference pose that the tool follows with a lead
      (the distance from the tool to that reference). Over one control period the tool travels at most
      the commanded twist's travel plus the lead it began the period with, except by at most 4.8 mm;
      the lead was at most 34.3 mm, and at most 11.7 mm in a place's lower phase.
    rationale: >-
      Measured 2026-09-24 over 3637 control periods, two teacher episodes each of libero_spatial 0 and
      3, libero_object 2, libero_goal 3 and 8, libero_10 0 and 3, libero_90 18, 73 and 48: travel beyond
      commanded plus starting lead in 1 period (4.8 mm); lead median 8.1 mm, p99 18.9 mm. Against the
      commanded twist alone the travel reached 5.5 times it (p99 2.2), 3.5 in lower phases.

  - id: AXM-acceleration-loads-the-grip
    domain: physics
    statement: >-
      A held object's inertial load is its mass times the tool's acceleration; the grip holds
      only while pad friction, from at most 20 N of normal force per finger, exceeds gravity
      plus that load along the gripped surfaces.
    rationale: >-
      Measured at 4edb9d0: rim grips lost the bowl 0.2-0.36 m up during lifts and carries,
      with tool acceleration p95 3.5-5 m/s^2 and peaks up to 35.

  - id: AXM-velocity-steps-are-jerks
    domain: physics
    statement: >-
      A step change of dv in the servo's commanded twist is executed as an acceleration of about
      dv x 20 (one 20 Hz control period), concentrated at phase switches. It bounds accelerations, not
      travel: the tool follows the servo's reference pose, not the commanded twist, within a period
      (AXM-servo-lead-bounds-travel).
    rationale: >-
      Measured at 4edb9d0 -- acceleration p95 3.5-5 m/s^2, jerk p95 100-170 m/s^3, at phase switches.
      Restated 2026-09-24: an earlier wording, "tracks each commanded twist within one control step",
      is false read as a bound on motion -- the tool moved up to 5.5 times the commanded twist in a
      period (p99 2.2), closing a reference lead of up to 34 mm.

  - id: AXM-stepped-joint-goal-lunges
    domain: physics
    statement: >-
      LIBERO's JOINT_POSITION controller steps its joint goal once per 50 ms period, and the
      stiff critically damped PD behind it (kp 4000) moves the arm in a lunge and coast inside
      every period, whatever the commanded velocity.
    rationale: >-
      Measured at the 2 ms physics substep -- within one steady carry step the tool speed went
      0.08 -> 0.20 -> 0.09 m/s; substep acceleration p95 12.1 m/s^2 where 20 Hz differencing read 3.9.

  - id: AXM-robosuite-interpolator-hyperbolic
    domain: environment
    statement: >-
      robosuite 1.4.0's LinearInterpolator returns start + (goal - start) / (N - k) without
      advancing start, so half of each move lands in the last two of its N = 25 substeps.
    rationale: >-
      Read from linear_interpolator.py and measured -- the joint torque sagged mid-period and
      spiked to -178 N m at its end; enabling it made substep acceleration worse (max 94.5 m/s^2).

  - id: AXM-rim-pinch-drops-under-smooth-motion
    domain: physics
    statement: >-
      Rim pinches of the akita bowl lose it during lifts and carries with the commanded twist's
      change bounded at 2 m/s^2: the bowl pivots about the pinch with the pads' contact points fixed
      on it, and the pinch lets go at a phase switch -- in libero_goal 1 and 8, 5 of 8 episodes
      dropped the bowl 53-59 steps after the lift began. With the bound at 0.5 m/s^2 and nothing
      else changed, 0 of 12 did.
    rationale: >-
      TST-teacher-motion before and after execution smoothing -- 24 then 27 drops in 20 episodes,
      with substep acceleration p95 going from ~12 to a median 2.2 m/s^2 -- showed that smoothing
      to 2 m/s^2 does not stop the drops. The probes of 2026-09-23 at 107fa9c showed the rate of
      change of the commanded twist still decides them: the bowl tilted 1.1 -> 9.5 degrees over 57
      steps with each pad's contacts fixed in the bowl's frame, and on the same seeds with only the
      servo's bound changed the drops went from 5 of 8 episodes to 0 of 12. An earlier statement
      concluded from the first measurement alone that the drops are not caused by execution jerk.

  - id: AXM-object-geometry-known
    domain: environment
    statement: >-
      Every object's and fixture's collision geometry, in its current pose, is in the
      simulator state (a privileged input, like object poses).
    rationale: Scene.object_box and the grasp planner already read MuJoCo geoms.

  - id: AXM-bddl-states-goals-not-methods
    domain: environment
    statement: >-
      A LIBERO bddl states the goal conjuncts (In, On, Open, Close, TurnOn, TurnOff), the
      objects and fixtures with their categories, and the regions -- and nothing about how
      any of it is to be achieved.
    rationale: Read from all 130 bddl files (task_spec.py docstring counts the predicates).

  - id: AXM-category-affordances-declared
    domain: requirement
    statement: >-
      What the bddl leaves out about a category -- how it is moved (pick, push, or not at
      all), where it is held, how it rests on each kind of support, what a fixture's joints
      are -- is declared once per bddl category in screwhead/teacher/affordances.yaml, each
      value tagged measured, declared or open; an open value is not relied on.
    rationale: >-
      The user's decision (2026-09-21) -- per-category facts, not per-task scripts, so the
      teacher stays generic across suites; tests/test_affordances.py keeps the table complete.

  - id: AXM-libero-joint-bands
    domain: environment
    statement: >-
      LIBERO's Open and Close predicates for one joint leave a band where neither holds:
      drawers count open below -0.14 and closed above 0.0; the microwave door open below
      -1.3 rad and closed above -0.005.
    rationale: Read from libero/envs/objects/articulated_objects.py (WhiteCabinet, Microwave).

  - id: AXM-one-gripper
    domain: physics
    statement: >-
      The robot has one gripper: while it holds an object it cannot grip anything else,
      drive a fixture's joint or push, and it frees its hand only by setting the object down.
    rationale: The Panda in every LIBERO task (robots=["Panda"], gripper_types="PandaGripper").

  - id: AXM-objects-are-light
    domain: physics
    statement: >-
      Every movable object in libero_object, spatial and goal weighs 5.2-31.7 g (the basket
      136 g): gravity at most 0.31 N, against squeeze forces of 1-20 N at a pad friction of 2.0.
    rationale: Read from the model's body masses (docs/grasp_mechanics.md).

  - id: AXM-squeeze-is-a-spring
    domain: physics
    statement: >-
      A finger's target cannot pass fully closed, so the squeeze on an object of width w is
      about 1000 x w/2 N per finger, capped at 20 N: about 1.3 N on a 2.6 mm bowl rim, 20 N on
      a 40 mm box -- and it falls as a slipping object lets the jaws close.
    rationale: >-
      Actuator gain 1000 N/m, forcerange +-20 N, ctrlrange 0..40 mm; measured 4.0 -> 2.1 N as
      a rim pinch crept from 8.1 to 4.2 mm (libero_spatial 6, episode 0).

  - id: AXM-no-torsional-friction
    domain: physics
    statement: >-
      Pad and object contacts are condim 3: tangential friction (2.0, the larger of the pair)
      and no torsional or rolling friction, so only the spread of the contact points resists
      an object pivoting about the jaw axis.
    rationale: >-
      Read from the geoms; measured, a bowl pivoted 0.3 -> 16 degrees about a rim pinch over
      45 steps and fell (libero_spatial 6, episode 0).

  - id: AXM-slip-spikes-are-transient
    domain: physics
    statement: >-
      A held object's velocity relative to the jaws spikes for a step or two during the
      squeeze (the fingers nudge it) and at the start of a lift (it lags), while a carried
      object's stays below about 0.01 m/s and 0.2 rad/s.
    rationale: >-
      Measured on libero_spatial 6; a holding test on instantaneous relative velocity
      (0.05 m/s, 1 rad/s) read those spikes as losses.

  - id: AXM-reproducible-measurement
    domain: epistemic
    statement: >-
      A measurement is evidence only if the same seed reproduces the same episode, and an
      observer does not change the behaviour it records.
    rationale: Without it, paired comparisons of two teacher versions measure noise.

  - id: AXM-instruments-do-not-decide
    domain: epistemic
    statement: >-
      An instrument never decides an outcome. The outcome of an episode is what the scorer says
      about the state the episode reached; an instrument's own failure is reported as a failure of
      the instrument, and is never recorded as a failure of the thing it was watching. A run that
      does not complete the episodes it declared reports the shortfall rather than presenting the
      episodes that happened to arrive as though they were the sample it promised. Evidence is
      bound to the run that produced it: a result written by an earlier run is not evidence about
      a later one, whatever name it is filed under.
    rationale: >-
      Otherwise a crashing logger reads as an unreliable teacher, a worker that dies silently
      shrinks n while the rate is reported as though it had not, and a stale file is restamped
      with the current revision -- three ways to publish a number about nothing. AXM-reproducible-
      measurement asks that observing not change the behaviour; this asks that observing not
      supply the verdict.

  - id: AXM-mujoco-forward-is-a-function-of-state
    domain: environment
    statement: >-
      Writing a configuration into MuJoCo's state and running its forward pass yields the body,
      geom and contact geometry that configuration has: the derived fields are functions of the
      state written, not of the states that preceded it. The same pass makes each contact's normal
      force readable per contact. So a configuration the world was never in can be screened by
      writing it, forwarding, reading, and restoring what was there before.
    rationale: >-
      Two claims need it and neither can cite AXM-mujoco-integration-state for it: that axiom says
      restoring a state reproduces the steps that follow, which licenses the restore and says
      nothing about the write. Screening a grasp at a joint position the drawer has not reached,
      and asking which contact balances a finger's squeeze, both read fields derived from a
      configuration rather than integrated from one.

  - id: AXM-robosuite-controller-cache
    domain: environment
    statement: >-
      robosuite 1.4.0's controllers compute from a cache of the arm's joint position, velocity
      and mass matrix that update() refreshes (after an mj_forward) only while the controller's
      new_update flag is set; run_controller sets the flag at its end. env.reset() rebuilds the
      controller, whose constructor fills the cache at the robot's init_qpos and clears the
      flag, before set_init_state moves the arm -- so the first control period after a reset
      computes its joint goal and its PD torque from that stale cache.
    rationale: >-
      Read from controllers/base_controller.py and measured by an independent reviewer on
      TaskEnv libero_goal 8, reset(0): the cached joint position was 0.0165 rad from the state,
      and a refresh on the first period changed its torque by up to 102 N m.

  - id: AXM-robosuite-gripper-target-persists
    domain: environment
    statement: >-
      robosuite 1.4.0's PandaGripper keeps its finger target (current_action, advanced by
      0.01 per substep toward the commanded sign) from the moment its model is built; a soft
      env.reset() sets the finger joint positions but not that target, so the fingers of a new
      episode are driven from wherever the previous episode's command left it.
    rationale: >-
      Read from models/grippers/gripper_model.py (set once) and robots/single_arm.py (reset
      sets finger qpos only); measured by an independent reviewer: from the same reset state
      and the same 26 mm target, the aperture after 6 steps was 42.5 mm when the previous
      episode ended open and 28.9 mm when it ended closed.

  - id: AXM-mujoco-integration-state
    domain: environment
    statement: >-
      MuJoCo's mjSTATE_INTEGRATION (mj_getState / mj_setState) holds everything of mjData that
      mj_step1 and mj_step2 read from one step to the next -- time, qpos, qvel, act,
      qacc_warmstart, ctrl, qfrc_applied, xfrc_applied, eq_active, mocap poses, userdata,
      plugin state -- so, for the same model and the same inputs, restoring it reproduces the
      steps that follow.
    rationale: >-
      MuJoCo's documentation of the state-component bits (mjtState); measured across processes
      and instances with the model's body poses equal (TRL-0217, TRL-0238).

  - id: AXM-parameters-derived
    domain: requirement
    statement: >-
      A threshold or weight in a design is taken from a declared source -- LIBERO's scorer
      (read from its objects, or probed through its predicates), the MuJoCo model (geometry,
      masses, inertias, damping, gains, limits), the bddl (goal and initial conditions), a
      definition in this file, or a measured distribution named with its measurement -- or it
      is a free parameter the design shows cannot change its optimum or its verdicts. A number
      chosen by hand to make a case pass is not admissible.
    rationale: >-
      The user's decision (2026-09-22): designs should limit hand-tuned parameters. That day's
      design pass refuted servo v2-v5 and the RL objective v1-v4 almost entirely on hand-picked
      bounds and weights (rate by period 3, within 2 periods, <= 40 N m, random 0.02 m/s kicks,
      seven reward weights), and found the skill teacher's squeeze thresholds tuned to a 0-24
      substep observation lag.

  - id: AXM-libero-soft-reset-misplaces-hosted-objects
    domain: environment
    statement: >-
      With robosuite's hard_reset off, LIBERO's env.reset() samples an object whose initial region lies on
      a fixture other than the table (a stove's cook region, a cabinet drawer's region) at a height raised
      by that fixture's own height above its correct placement, so the object falls off its host when the
      scene runs; with hard_reset on (the scene rebuilt from its task file) the same objects are sampled
      at their hosts' heights. Objects whose region lies on the table are sampled at their correct heights
      either way.
    rationale: >-
      Measured 2026-09-26: libero_spatial 7 (bowl on the stove) and 4 (bowl in the top drawer), four seeds
      each: with hard_reset off the bowl was sampled at z 1.915 and 2.056 m, with it on at 1.010 and 1.151
      m -- a difference of 0.905 m, the height the fixtures stand at -- and after settling the soft-reset
      bowls lay on the floor (z 0.317 m; 0.00 m, 1.7 m away); libero_spatial 0's bowl, on the table, was
      sampled at 0.970 m and settled at 0.898 m. Found by the teacher push's first round, whose
      blocked-reaching failures on those two tasks had every grasp without inverse kinematics because the
      bowl was on the floor. LIBERO's stored initial states were drawn with scenes built anew and are not
      affected.
definitions:
  - id: DEF-single-operator-lab
    term: The single-operator lab
    meaning: >-
      The threat model this project's protocol and reporting claims are judged under. Every run is
      launched by a runner script kept under version control -- this repository's, or, for a model
      evaluated in another project's environment, a runner kept in that project -- from a working tree
      checked out at a recorded, committed revision with no tracked file modified; the software installed
      in an environment changes only through that environment's setup script, recorded with the run; and
      no process alters another run's code, data, installed software or simulator, neither while that run
      is in progress nor between the runs of one comparison. Mistakes are within it -- a checkpoint loaded
      by the wrong name, a setting left different between two runs, a seed retrained after its results
      were seen, a nondeterministic kernel or renderer -- and are what protocol claims must detect or
      exclude; deliberate tampering with code, data, installed software or the simulator is not. This is a
      stipulation about the conditions a claim is made under, not a property of any run: a claim citing it
      says nothing about runs made otherwise.
    rationale: >-
      Eight verification passes on BRN-vla-reported-beside-a-blind-twin and six on
      BRN-random-starts-test-set (2026-09-26) raised gaps of two kinds: mistakes this lab can make (a seed
      retrained after its results, a checkpoint loaded by name, multisampled renders that diverge, a
      harness setting left on) and tampering it does not face (a same-version rebuild of the physics
      library placed between two evaluations, an untracked module slipped into a working tree). With no
      declared threat model a verifier must defend against both, and a claim that must record every
      channel of tampering never closes. The user asked that protocol claims be judged against the lab as
      it is -- one operator, runners kept in version control, frozen worktrees -- with full adversarial
      verification kept for design claims, where a flaw changes what a model learns or does.

  - id: DEF-intended-contact
    term: Intended contact
    meaning: >-
      At a step, a contact between a geom of the robot's and a geom of a body B that is not the
      robot's is intended when, read from that step's state and the model alone, one of these holds:
      (held) both finger groups touch B or the object B belongs to across the jaw line -- each with a
      contact whose normal is nearer the jaw line than the approach -- and that object moves on a free
      joint (fingertips either side of a table hold nothing, and closed fingertips pressed into a
      bowl's floor do not hold it); (jaws) a finger touches B at a point inside the jaws' closing
      volume -- between the two pads' inner faces along the jaw line, within the fingers' width across
      it, and from the palm's face to the finger tips along the approach, each widened by 1 mm, more
      than a contact point lies off the surfaces in contact -- with the contact's normal nearer the
      jaw line than the approach; (pushed) a finger touches B and B is an object the task's plan
      pushes (its category is moved by pushing in the affordance table and a goal of the task places
      it); (joint) any part of the gripper touches B, and B is, of the bodies that move on a slide or
      hinge joint of their own, the one whose collision geometry lies nearest the tool point;
      (support) a finger touches B while both finger groups touch another body that touches B;
      (inside) the tool point lies inside a region site of B's object. Every other contact between the
      robot and anything else is unintended, and so is every contact between two of the robot's bodies
      more than one joint apart in the kinematic tree, unless both are the gripper's. The rules read
      no policy's intent, so a teacher and a student in the same state are judged alike. This names
      what the per-intent rules allow; it does not say an intended contact is harmless or an
      unintended one harmful.
    rationale: >-
      The user's decision of 2026-09-26: exemptions are per-intent state rules, not one finger zone,
      so a fingertip striking a wall stays guarded. Calibrated on the Panda teacher's 40 matrix
      episodes (all successful): of 12,729 contact-steps, 103 are unintended -- a cream-cheese box
      shoved along with the plate in libero_goal 5 (42), the hand brushing the plate beside the
      cabinet in libero_goal 0 (22), the moka pot resting on the fingertips as it is lowered in
      libero_10 2 (16), and transients of 1 to 4 steps at the onset of a squeeze or the release (23,
      in 10 episodes). Each rule was forced by a case: rims pinched as deep as the palm touch the
      fingers above the pads (the closing volume runs to the palm); the plate in goal 5 is pushed
      (pushed); a body wedged between the Jaco's fingers pressed back along the approach for 733 steps
      (the gripping normal); two closed fingers touch (the gripper exception); the Panda closes a
      drawer by pushing it with its hand, while the Kinova3's hand pinned itself on the drawer above
      the one it drove (the jointed body at the tool point); closed fingertips pushed into a bowl's
      floor counted as holding it, where the screen test expected a rejection (held needs gripping
      contacts); a plate counted as pushed in libero_spatial 0, which never pushes it (pushed is the
      task's).

  - id: DEF-reachable-pose
    term: Reachable pose
    meaning: >-
      A tool pose with a converged IK solution whose smallest singular value exceeds 0.05
      and whose every joint is at least 0.15 rad from its limit, with the arm not
      penetrating a fixture. This is the teacher's screen, a conservative stand-in for
      "trackable by the servo"; the servo's actual boundary is not claimed to be here.

  - id: DEF-holding
    term: Holding
    meaning: >-
      Both finger groups touch the target and the jaw aperture is stopped by it: neither
      near zero (closed on nothing) nor near fully open.

  - id: DEF-gentle-placement
    term: Gentle placement
    meaning: >-
      At release the object's lowest point is within 5 mm of the surface beneath it and its
      vertical speed is below 0.05 m/s.

  - id: DEF-resting
    term: Resting on the intended support
    meaning: >-
      An object, held or released, rests on its intended support at a step when: every contact it has
      with a body other than the robot is with the intended support -- the body the goal region belongs
      to, or for an On goal whose target is an object, that object; every such contact's normal is
      within 31 deg of vertical (atan 0.6, the least contact friction here,
      AXM-libero-contact-parameters); those contact points include three not on one line, and the
      vertical through the object's centre of mass passes strictly inside their convex hull in plan;
      and no point of it moves faster than the rest speed, 5 mm/s (|v| + |w| r, r its bounding radius;
      sim_arm's REST_SPEED). A predicate on one step's simulator state. An object on a single corner or
      a single edge does not rest.

  - id: DEF-smooth-motion
    term: Smooth motion
    meaning: >-
      Two clauses, one on what is commanded and one on what is executed, because they are
      different quantities. (a) COMMANDED, and enforced by the execution layer: over the episode
      the commanded twist changes by at most the servo's declared rate limits (sim/servo.py:
      2 m/s^2 in the linear part, 5 rad/s^2 in the angular, per control period), each period's
      joint goal is ramped linearly across the period, and the joint reference never leads the
      measured joints by more than max_lag -- so no step change in the commanded velocity reaches
      the arm, and no executed step in which no robot geom touches anything is a counted
      re-anchor, counted as BRN-servo-lead-scaled-uniformly counts it (a scaled step whose IK
      residual exceeds max_pose_err). Contact steps are excluded for the reason clause (b)
      excludes contact substeps, and on the same kind of evidence: a counted re-anchor is a
      tracking error, and an arm that presses a knob or carries an object accumulates one because
      the world resists the reference, not because the command was rough. Measured by replaying
      16 search episodes of libero_spatial (1826 executed steps, 924 re-anchors): 0.083 re-anchors
      per free-motion step against 0.597 per contact step, 7.2x, with 97.1% of all re-anchors
      falling on contact steps while contact is 82.3% of the steps. The distinction decides the
      keep-filter rather than decorating it -- under the clause as first written none of those 16
      episodes is keepable, and restricted to free motion 6 of 16 are. (b) EXECUTED, and measured over the substeps in which no robot geom touches
      anything: the tool's acceleration at the 2 ms physics substep has a 95th percentile over
      those substeps of at most 6 m/s^2. The acceleration at a substep is a second difference over
      three samples, and it counts as free motion only if all three are free: labelling it by the
      last sample alone admits the difference taken across the end of a contact, which is where the
      largest acceleration of the episode sits. That is not a detail -- replaying 16 spatial
      episodes, the last-sample mask fails this clause on 5 of them at 7.1 to 20.5 m/s^2 while the
      three-sample mask passes all 16, at a p95 between 2.4 and 5.2. Contact substeps are excluded
      because an arm pressing a
      knob or setting an object down accelerates since the world stops it, which is the task and
      not the motion -- on a settled search episode the free-motion figure is 4.5 m/s^2 against
      16.5 in contact, and contact is a third of that episode. The bound is the envelope of
      ramped free motion, not a limit of the grasp: over 20 skill-teacher episodes at this
      revision the free-motion episode p95 has median 2.9 and 90th percentile 6.1, against
      12.1 m/s^2 for the same measurement with the joint goal stepped rather than ramped
      (AXM-stepped-joint-goal-lunges); the distribution lives with CTR-teacher-smooth and
      CTR-servo-keeps-its-reference, which score this clause. It is not claimed that a held object
      slips above it -- LMA-grip-fails-by-contact-not-load says a grip fails through its contacts,
      not through the object's weight or the arm's accelerations.
    rationale: >-
      The previous statement set one number, 2 m/s^2, and applied it to the measured response.
      2 m/s^2 is the servo's limit on how fast the COMMANDED twist may change
      (BRN-execution-bounds-acceleration), which the execution layer enforces by construction and
      which does not bound the arm's response: that response carries the stiff joint controller's
      tracking and whatever the tool is touching. Measured over 80 recorded skill-teacher
      episodes, 5% have an episode acc_p95 at or below 2 m/s^2 (median 3.94, 90th percentile
      7.05, maximum 10.69), which is why CTR-teacher-smooth reads refuted and why the
      optimization teacher's keep-filter, which inherits this definition, kept nothing. The
      number in (b) is now sourced as a measured envelope of ramped execution and named as such;
      it excludes the worst decile of ramped episodes and rejects stepped execution outright.
      (a) states what the execution layer guarantees, and is the clause a design may cite as
      enforced rather than measured.

  - id: DEF-refusal-is-an-outcome
    term: Refusal is an outcome
    meaning: >-
      A refusal is a recorded annotation beside the scorer's verdict, not a replacement for it. The
      episode's outcome remains what the scorer says of the state the episode reached; a refusal
      additionally records that the planner stopped, the predicate that had no witness, and the level at
      which it was asked. This is a stipulation about bookkeeping, which is all a definition can be: the
      claims that an outcome is the scorer's and that no instrument supplies one belong to the axioms,
      and a branch relying on this term cites them itself. Refusals are counted and reported separately
      from failures over the same declared denominator, and no reported rate merges the two. A refusal
      says only that no witness was produced at that state -- by a query that found none, by a query
      that gave up inside its budget, or by a skill set containing no achiever. Which of the three it
      was is not decided by the refusal and is recorded with it. Not claimed: that a refused
      precondition is unachievable, since a conservative screen refuses states a forced attempt would
      solve, measured at 50 of 50 on one task; that a refusal rate measures coverage; that refusing is
      better than attempting; or anything about the scene a later episode begins in, which a reset
      restores and re-samples whatever the previous episode did.
    rationale: >-
      An earlier statement made a refusal a third kind of outcome, which contradicts the axioms that fix
      an outcome as the scorer's verdict and nothing else, and carried three claims it could not
      support: that flailing spends the horizon, that it disturbs the scene, and that a later attempt
      would otherwise find that scene as it was -- the last being false, since a reset re-samples
      fixture poses regardless. Annotation rather than outcome keeps the separation that makes coverage
      and reliability separately improvable without displacing the scorer.

  - id: DEF-witness-or-refusal
    term: Witness or refusal
    meaning: >-
      A geometric query the planner asks -- which grasp, which touchdown pose, which handle approach,
      which push frame -- run with refusal enabled answers in one of exactly two ways. It returns a
      candidate together with the predicate that candidate satisfies, or it returns nothing. It never
      returns its best-scoring failing candidate, and it never widens the predicate to make one pass. A
      precondition with no witness is a precondition that does not hold: the skill does not run, the
      planner records which predicate had no witness, and the episode ends unsolved rather than proceeding
      on a candidate known to fail. This is a property of the answer, not of the search that produced it
      -- a query may rank its candidates, relax its ordering or give up early, so long as what it hands
      back either satisfies the predicate it names or is absent. The point is that every caller may then
      assume the named predicate holds of whatever it receives, and a forced best-effort substitute
      silently withdraws exactly that. What the caller may assume is the screen, never more:
      DEF-reachable-pose disclaims being the servo's boundary, and LMA-whole-path-reachable is a negative
      lemma that supplies no predicate a finite query could witness, so trackability along a motion is not
      what any such answer carries. A query answers for the stations it names and for nothing between
      them. With refusal disabled -- the default in this project's evaluations -- a query may instead hand
      back a fallback candidate, marked unverified where the teacher logs it; a caller may assume nothing
      of a fallback, and a query that does so is not a witness-or-refusal query in that run. The
      carry-height query never refuses and is not one.
  - id: DEF-skill-contract
    term: Skill contract
    meaning: >-
      A skill's preconditions, effects and postcondition, each a predicate on the current state --
      held(o), hand empty, graspable(o), clear_of(o, j), admits(C, o), accessible(j), a free spot for o,
      and LIBERO's own In, On, Open, Close, TurnOn, TurnOff -- with the parameters the affordance table
      supplies (how a category is moved, held and set down). clear_of(o, j) is that o would remain
      graspable were container j at its open target; an object resting on j's moving part -- supported
      by that part's geometry, directly or through other objects resting on it -- travels with it and
      is not in question. It is computed from the state, with the configuration it describes
      written, screened and restored, but it describes a configuration the plan will reach rather than
      the present one, which is why it is a precondition of opening j and not of picking o. A skill that
      ends by releasing what it grasped -- drive, place, park -- carries a postcondition beside its
      effect: when it ends, the jaws do not hold that thing, none of it lies between the fingers, and no
      robot geometry touches it. pick carries none, since it ends holding what it grasped, which is its
      effect. Disengagement belongs to the contract rather than to the body of any one skill, because
      the planner may follow any skill with any other, and a skill that leaves the arm entangled makes
      the next skill's preconditions unreadable from the state. A skill may not start while that
      postcondition fails for anything an earlier skill in the episode released and no skill has
      grasped since; within a skill the arm may grasp anything, including what an earlier skill
      released. A skill starts at the first control step of a run of consecutive steps at which the
      planner selects it with the same arguments.
    rationale: >-
      uncrowded(o) was a precondition of pick(o), and the test behind it asked whether a container, once
      opened, would stand over the object -- a question about a configuration the plan would reach, not
      about grasping the object now. As a precondition of pick it made moving a crowded object clear
      circular, since that move begins by picking the object, and it read a bowl sitting inside an open
      drawer as crowded. Where it concerned the present, it duplicated graspable, whose screen already
      rejects every grasp an open container's moving part blocks. The earlier statement also gave every
      skill the disengagement postcondition, including pick, whose effect is to hold what it grasped;
      the postcondition belongs to the skills that let go. The gate once ranged over everything an earlier
      skill released, which forbade placing an object that had been parked and picked again -- the
      flow moving an object clear exists for -- and 'start' was undefined for a plan re-derived every
      step.

  - id: DEF-plan
    term: Plan
    meaning: >-
      The skill a regression over the skill contracts selects, at each control step, from
      the task's goal conjuncts and the current state: the first unmet conjunct in
      goal-relation order, then the first unmet precondition of the skill that achieves it,
      recursively, down to a skill whose preconditions hold.

lemmas:
  - id: LMA-whole-path-reachable
    statement: >-
      A motion segment fails if the servo cannot track some pose along it, whatever its
      endpoints are, so checking the endpoints of a segment is not sufficient.
    premises: [AXM-servo-tracks-reachable-poses]
    derivation_rule: >-
      The servo tracks each intermediate pose in turn; one unreachable intermediate pose
      triggers clamping and re-anchoring whatever the endpoints are.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-holding-is-geometric
    statement: >-
      Whether the jaws hold a handle must be decided from each finger group's press being borne by the
      handle's own geometry, and from an aperture the handle stopped -- not from contact with the body
      the handle belongs to. Both halves are needed and neither suffices: contact at body granularity
      cannot locate a finger on the handle at all, and contact with the handle cannot separate a grip
      from a graze, because the pads span a depth over which another feature of the same body may be
      what actually stops the jaws. This lemma requires that form of test; the thresholds belong to the
      claim that scores it.
    premises: [AXM-panda-gripper-geometry, AXM-handle-shares-body, DEF-holding]
    derivation_rule: >-
      AXM-handle-shares-body puts the handle and the face beside it on one body, so a body-level test
      cannot distinguish a grip on the bar from a palm laid on the drawer front -- it is not a stricter
      reading of the same test but a different question. AXM-panda-gripper-geometry gives the pads their
      16 mm of depth, which is what makes the second half necessary as well: within that span the jaws
      can rest on one feature while touching another, so a test asking only what is touched admits a
      graze. DEF-holding asks for an aperture the object stopped, and reading that as the handle bearing
      the press is what carries the requirement from contact to force without naming a number here.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-caches-reset-per-episode
    statement: >-
      Every decision the teacher caches -- grasp, handle frame, drop point, carry height -- is cleared
      at each episode boundary, so no label depends on an episode that ran before it.
    premises: [AXM-dagger-needs-markov-labels]
    derivation_rule: >-
      A cache that survives an episode makes the label depend on a previous episode, which
      AXM-dagger-needs-markov-labels forbids outright, so clearing at the boundary is necessary. It is
      not sufficient for a Markov label and is not claimed to be: within an episode a cached decision
      carries the state it was made at, so a teacher reading one is a function of that history and not
      of the current state alone. This lemma claims the boundary only; whether a within-episode cache
      can be reconciled with the axiom is a separate question it leaves open.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-seed-fixtures-per-init-state
    statement: >-
      On one arm registered as AXM-libero-init-states-record-a-panda has it, whose resets are
      therefore not deterministic, seeding numpy's global generator from (seed, init index)
      immediately before a reset, with nothing else drawing from it before that reset, makes the
      fixture poses that reset writes a function of (task, seed, init index, the arm's per-joint draw
      count), identical when a state is settled and when it is replayed on that arm, whatever resets
      came before; and on an arm drawing n < 7 normals whose generator is advanced by 7 - n normals
      after the seeding, they are the poses the 7-joint arms' resets write in that task. (That whole
      episodes reproduce is measured, not derived: CTR-teacher-deterministic.)
    premises: [AXM-libero-resamples-fixtures, AXM-robot-reset-draws-per-joint, AXM-libero-init-states-record-a-panda,
               AXM-reproducible-measurement]
    derivation_rule: >-
      Seeding fixes the generator's state at the reset's start, nothing drawing in between. The arm's
      resets are not deterministic (AXM-libero-init-states-record-a-panda), so the reset draws its n
      normals before the placement samplers (AXM-robot-reset-draws-per-joint) and their entry state is
      a function of (seed, init index, n); the samplers write poses that are a function of that entry
      state and the task, not of what earlier resets wrote, and AXM-libero-resamples-fixtures says
      those poses are where the fixtures stand. With 7 - n normals drawn first, the entry state is the
      one 7 draws leave, by the one-sequence clause. Refuted unscoped across arms (TRL-1105) and
      without the non-deterministic reset (TRL-1108).
    sufficiency: {n_min: 3, min_consensus: 0.8}
  - id: LMA-observers-read-only
    statement: >-
      A diagnostic must not cause a decision to be made: every read it performs returns a decision
      already taken or returns nothing, and no read has choosing as a side effect. This is a requirement
      on any assessment rather than a report about one; whether a given assessment meets it is a
      question of implementation fidelity, answered by a test and not here.
    premises: [AXM-reproducible-measurement, AXM-dagger-needs-markov-labels]
    derivation_rule: >-
      A diagnostic that chooses and caches a decision changes what the teacher then acts on, so the
      property must hold by construction and not by call order: every read a diagnostic makes returns
      the decision already cached or returns nothing, and no read has choosing as a side effect. An
      arrangement in which a diagnostic would choose whenever the cache is empty satisfies no ordering
      discipline that survives a change of caller.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-contact-release-is-robust
    statement: >-
      Commanding the jaws open at a step at which the object rests on its intended support (DEF-resting)
      releases it -- "at release" read as that step, the one the open command is given -- moving no
      faster than the rest speed (5 mm/s, below DEF-gentle-placement's 0.05 m/s) and touching that
      support: no part of it is falling (AXM-release-is-free-fall does not apply), and when its lowest
      point is one of those contact points the release is gentle in DEF-gentle-placement's sense. Not
      claimed: that the fingers, which still touch it when the command is given, do not move it as
      they open.
    premises: [DEF-resting, DEF-gentle-placement, AXM-release-is-free-fall]
    derivation_rule: >-
      DEF-resting bounds the speed and puts the object on the support; a supported object is not in
      free fall. Restated from a version whose aside -- a release at a height known to 3 mm is gentle
      too -- was refuted: 2 mm off, the tool still descending at 0.08 m/s, it is not.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-clearance-bounds-motion
    statement: >-
      Let c be the least, over pairs of a rigid body's collision geom and a collision geom of a body of
      a set S, of the distance mj_geomDistance reports for the pair with a distmax larger than every
      distance used -- it reports at most the true distance, the distmax itself for pairs at or beyond
      it -- less the solver's tolerance and less that pair's two contact margins
      (AXM-libero-contact-parameters). If c > 0 and no body of S moves, then under any motion of that body
      as a rigid whole in which no point of it travels as far as c, no contact forms between it and a
      body of S. Not claimed: anything while a body of S moves.
    premises: [AXM-geom-distance-exact, AXM-libero-contact-parameters, AXM-object-geometry-known]
    derivation_rule: >-
      With S fixed, each pair's distance falls by no more than the largest displacement of the body's
      points (the triangle inequality), and a contact between a pair forms only within its margins.
      Restated from a version that did not fix S (a stationary mug, the forearm pushing a bowl of S into
      it) and one that netted a single 2 mm off every pair.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-release-when-resting-stays
    statement: >-
      Take the first step after the jaws are commanded open at which no part of the robot touches the
      object. If at that step the object rests on its intended support (DEF-resting) with its origin
      inside the goal region, then for as long as that support does not move and nothing but it touches
      the object, the object comes to rest without leaving its contact hull. Not claimed: anything after
      a later plan step moves the support (a drawer closed with the object in it) or brings another
      object or the robot into contact with it; that a goal conjunct holding at that step with the object
      at the edge of its region still holds after the residual motion; that the release was gentle.
    premises: [AXM-static-stability, AXM-contacts-damp-residual-motion, DEF-resting, AXM-libero-objects-are-boxes]
    derivation_rule: >-
      At that step the only contacts are with the intended support, frictional enough not to slide, with
      the vertical through the centre of mass inside their hull and no point faster than the rest speed
      (DEF-resting): AXM-static-stability's condition, so nothing tips it, and AXM-contacts-damp-
      residual-motion brings it to rest inside the hull. Earlier statements were refuted: one concluded
      the goal held until the teacher finished (libero_10 closes the drawer on the bowl), one left
      friction out of resting (a bowl on a 15 deg face with friction 0.25 slides), one let a line of
      contacts within 1 mm rest (a box on an edge 0.3 mm off its centre of mass tips); objects here are
      unions of boxes (AXM-libero-objects-are-boxes), so resting now needs a hull with an interior.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-pinch-clears-the-descent
    statement: >-
      If, with the object in its actual in-hand pose after the grasp, the fingers and hand stay clear
      of the support, the container's walls and other objects all along the descent until the object
      touches its support, then the pinch does not stop the object reaching the support. The in-hand
      pose is read after the grasp, not predicted before it. Not claimed: the converse -- a finger
      grazing a wall need not stop the object.
    premises: [LMA-clearance-bounds-motion, LMA-whole-path-reachable, DEF-reachable-pose]
    derivation_rule: >-
      Endpoint clearance is not path clearance (LMA-whole-path-reachable); the in-hand pose is
      known only once held.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-regression-selects-an-applicable-skill
    statement: >-
      Regressing from the first unmet goal conjunct through first unmet preconditions -- taking, where a
      predicate has more than one achiever, the first in the contract table's declared order -- and not
      revisiting a predicate within one descent, ends within the number of declared predicates at one of
      three places: a skill whose preconditions all hold, a predicate no declared skill achieves (a
      named gap, reported), or a predicate already visited in this descent, which is a regression
      circular at this state and is reported as such rather than followed. The skill it ends at is a
      function of the state and the goal. No acyclicity of the achiever relation is assumed: the bound
      comes from not revisiting, and a cycle in the relation shows up, at a state where it matters, as
      the third outcome rather than as a regress that does not end.
    premises: [DEF-skill-contract, DEF-plan, AXM-dagger-needs-markov-labels]
    derivation_rule: >-
      At each step of the descent the current predicate either has an achiever whose preconditions all
      hold (the first outcome), has no achiever (the second), or has one whose first unmet precondition
      is the next predicate; that predicate is either new, and the descent continues, or already
      visited, and it stops (the third). The three are exhaustive, and since each continuing step visits
      a predicate not visited before and DEF-skill-contract declares finitely many, the descent stops
      within their number. The earlier statement drew that same bound from an acyclic achiever relation,
      which this table does not have -- pick needs hand empty, which park achieves, and park needs held,
      which pick achieves -- so its antecedent was false and it entailed nothing. The cycle does no harm
      at a state where a skill on it can run: if the hand holds something and the goal needs it empty,
      park's precondition already holds and the descent ends there at the first outcome. Where it does
      harm -- two objects each crowding the other, so moving either clear needs the other moved -- the
      third outcome names it. The descent reads which predicates hold now, the goal's conjuncts in their
      order, and the declared orders of preconditions and achievers; DEF-plan fixes those orders, and
      with them the skill it ends at is a function of the state and the goal. The goal is fixed for the
      episode, so this meets AXM-dagger-needs-markov-labels: no label depends on the episode's history.
      The achiever rule answers the gap recorded against DEF-plan, which assumed one achiever per
      predicate. The case that exposed it, uncrowded, has since been replaced by clear_of, which has
      one; the rule does not depend on which predicate has several, and is kept because nothing in the
      declarations limits a predicate to one.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-hand-is-a-precondition
    statement: >-
      With one gripper, "hand empty" is a precondition of every skill that grips something
      new, drives a joint or pushes, and parking the held object (setting it down on a free
      spot of a surface it can rest on) achieves it; so a state where the current goal needs
      the hand while it holds something else regresses to parking that object, never to a
      step that cannot run.
    premises: [AXM-one-gripper, DEF-skill-contract, AXM-support-scannable]
    derivation_rule: >-
      AXM-one-gripper makes the hand a shared resource; declaring it as a precondition with
      park as its achiever puts every conflict over it on the regression chain.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-geometry-answers-predicates
    statement: >-
      graspable, clear_of, admits, accessible and free-spot are computed from the geometry at each step.
      Each reads the current state, and clear_of(o, j) also reads the configuration it is about -- j at
      its open target -- by writing it, screening and restoring, so it is a function of the state and
      the plan's fixed target rather than of the episode's history. A failed one is achieved only where
      a declared skill's effect makes it true: graspable(o), when every grasp is blocked by an open
      container's moving part and some grasp would pass with that container closed, is achieved by
      closing it; clear_of(o, j) is achieved by moving o to a free spot where it holds. graspable
      failing for any other reason -- fixed geometry that is no container's moving part, or an arm that
      cannot reach -- and admits and accessible have no achiever in scope, and the regression ends at
      them as a named gap. Achievers are chosen by the predicate, never by a list of tasks. Tests that
      depend on the held grasp are evaluated once the object is held, on the actual in-hand pose.
    premises: [AXM-object-geometry-known, AXM-support-scannable, DEF-skill-contract,
               AXM-mujoco-forward-is-a-function-of-state, AXM-mujoco-integration-state]
    derivation_rule: >-
      AXM-object-geometry-known puts every body's collision geometry in the state, and
      AXM-support-scannable lets a free spot be found by scanning. DEF-skill-contract gives the
      predicates, and restated it replaces uncrowded with clear_of.
      AXM-mujoco-forward-is-a-function-of-state licenses reading a configuration the world is not in --
      j at its open target, or a container closed -- by writing it, forwarding and screening, and
      AXM-mujoco-integration-state licenses the restore. An earlier statement claimed every failed
      predicate was achieved by some skill, which was false for graspable and admits, and that the
      predicates read the current state only, which was false of a crowding test evaluated at a
      container's open position; both are now stated as they are. It also offered moving a crowded
      object clear as an achiever, which could not work: the move begins by picking the object, and pick
      required the predicate being achieved. clear_of is a precondition of opening j rather than of
      picking o, so moving o to achieve it needs graspable(o), which holds while j is still closed. An
      object resting on j's moving part is exempt, because a screen that wrote j's joint without moving
      that object would report a collision the opening never causes -- the case in which a bowl inside a
      drawer read as crowded and closing the drawer on it was offered as the remedy. graspable blocked
      by an open container is achieved by closing it because the moving part is fixed geometry to the
      grasp screen, so no grasp passes while it stands there; the claim is limited to where the closed
      configuration, written and screened, lets some grasp pass. evidence: CTR-teacher-reliable (tasks
      with a container to open before an object is placed in it).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-protected-progress
    statement: >-
      Goal conjuncts are tried in an order that respects the relations the goal set states
      (every fill of a container before its Close; a moved support before what is placed on
      it), and a skill whose declared effect would falsify an already-achieved earlier
      conjunct is not selected while the regression offers another; so the executor does not
      alternate between two skills that undo each other's goals.
    premises: [AXM-bddl-states-goals-not-methods, AXM-libero-scores-final-state, DEF-skill-contract, DEF-plan]
    derivation_rule: >-
      Effects are declared, so "would falsify an achieved conjunct" is checkable before
      selection; fill-before-close and support-first remove the two goal-stated conflicts.
      Conflicts over geometry (capacity of one region for two objects, access occlusion)
      are predicates to be added when a suite needs them, not covered by this ordering.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-grip-fails-by-contact-not-load
    statement: >-
      In these suites a grip fails through its contacts -- a thin pinch squeezed weakly, a
      pivot nothing resists, a pinch closing on edges or against the support -- not by the
      object's weight or inertia exceeding the pads' friction; but a pivot nothing resists is
      driven by the tool's accelerations, so how the tool accelerates while such a grip is held
      is part of whether it survives, alongside grasp choice and grasp checking.
    premises: [AXM-objects-are-light, AXM-squeeze-is-a-spring, AXM-no-torsional-friction,
               AXM-acceleration-loads-the-grip, AXM-rim-pinch-drops-under-smooth-motion]
    derivation_rule: >-
      Loads are at most 0.31 N of gravity (and ~0.01 N of inertia under the 2 m/s^2 bound)
      against friction capacity in newtons, so no grip here fails by its load exceeding friction;
      what fails are the contact modes AXM-squeeze-is-a-spring and AXM-no-torsional-friction
      describe. A pivot is not a friction limit: AXM-no-torsional-friction leaves only the spread
      of the contact points to resist it, so any torque about it -- gravity's, and the inertial
      load AXM-acceleration-loads-the-grip gives -- turns the object, however small against
      friction. AXM-rim-pinch-drops-under-smooth-motion measures that on the bowl: changing only
      how fast the commanded twist may change took the drops from 5 of 8 episodes to 0 of 12. An
      earlier statement read the load bound as ruling the arm's accelerations out altogether.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-loss-needs-robust-evidence
    statement: >-
      A loss may be declared only on evidence that is not transient -- the fingers no longer
      touching the object, or the object far from where the jaws hold it -- never on an
      instantaneous velocity: declaring a loss makes the pick law open the jaws, so a false
      loss turns a grip into a drop, while a false hold only delays a regrasp.
    premises: [AXM-slip-spikes-are-transient, AXM-one-gripper, DEF-holding]
    derivation_rule: >-
      The error costs are asymmetric; measured, holding judged on instantaneous relative
      velocity took the teacher from 526 to 511 of 600 (spatial -7, goal -8: false losses
      mid-squeeze and mid-carry, the jaws opened, the bowl fell from 28 cm).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-smooth-in-execution
    statement: >-
      When the execution layer ramps each period's joint goal linearly across the period, bounds how
      fast the commanded twist changes, and sizes its per-period joint clips for the lag a ramped arm
      has, the in-period step and the step between periods are removed from what is commanded and
      the reference is not dragged back and re-anchored by the clip for the lag alone -- near a
      singularity a bounded twist can still ask a joint for more than the clip allows, and the
      reference is then re-anchored; this makes the tool's motion smoother but does not by itself make it smooth in DEF-smooth-motion's sense, whose executed
      clauses are measured per episode. Because every policy's action goes through that one layer
      unchanged, the teacher's label stays a function of the state together with the layer's carried
      state (the previous commanded twist, the ramp, the grip counter), and the student is executed
      the same way.
    premises: [AXM-stepped-joint-goal-lunges, AXM-robosuite-interpolator-hyperbolic, AXM-one-execution-path,
               DEF-smooth-motion]
    derivation_rule: >-
      A linear ramp removes the in-period step (AXM-stepped-joint-goal-lunges) where robosuite's
      interpolator does not (AXM-robosuite-interpolator-hyperbolic); a bound on the commanded
      twist's change removes the steps between periods; clips sized for a period of extra lag
      keep the reference from being dragged back and re-anchored. An earlier statement concluded
      smooth motion from these three, which DEF-smooth-motion's own figures refute: the skill
      teacher's free-motion acceleration p95 reaches 6.1 m/s^2 at its 90th percentile against a 6
      m/s^2 bar, and 10 of 16 search episodes carry a free-motion re-anchor.
    sufficiency: {n_min: 3, min_consensus: 0.8}

branches:
  - id: BRN-reset-anchors-all-execution
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      In TaskEnv, with Execution.anchor on (the default), SimArm anchors the execution layer at every
      placement of the arm: after set_init_state when an init state is first settled (after the
      recorded-tool write, on an arm other than the Panda), after set_init_state at every reset and every
      stored start, and after the random start's inverse-kinematics write. Anchoring sets robosuite's
      finger target fully open (the setpoint every settle pass ends on), refreshes the joint controller's
      cache and restarts the joint ramp at the placed joints; each hold -- the settling of an init state,
      the random start's settle -- follows an anchor with no state written between. Before each reset
      numpy's global generator is seeded by (seed, init index), as LMA-seed-fixtures-per-init-state has
      it; a stored start seeds index 0 and then writes its recorded fixture poses. At the end of every
      reset and stored start the twist servo's joint reference, pose reference, previous twist and grip
      latch are set to the arm's measured joints, their pose, zero and not holding; the gripper servo
      keeps no state between calls. When reset is given no init index, episode e's index is the e-th draw
      of a generator seeded by the seed alone (each such reset, and each skipped episode, draws exactly
      one); given one, it draws nothing. Every reset and every stored start advances the environment's
      episode counter by one; an episode's index is that counter after its reset, and the teacher's
      counter-keyed state belongs to the one environment it acts in. The random start's draws come from a
      generator seeded by (seed, episode index, attempt). The skill teacher's state is of three kinds:
      caches of model constants (geom boxes, the gripper scan) and answers keyed by the episode and the
      whole simulator state; per-episode decisions, cleared at the start of the first control step after
      the environment's episode counter changes, before that step reads any, and the start gate's record
      of its run, keyed by that counter; and its current step and phase, recomputed from the state at
      every control step. An episode's trajectory under the skill teacher in TaskEnv is then a function of
      (seed, episode index, init state), the same whichever episodes ran before it in the process, so far
      as the state listed here is all the execution layer carries across episodes -- which is measured
      (CTR-teacher-deterministic), not derived. Outside the claim: PrivilegedEnv, whose placements and
      layout-sampler restores call set_init_state without anchoring, so its holds after those writes start
      from execution state earlier placements left, and every episode run in it; the gripper scan,
      measured once per process (differences at most 1e-15 m); EGL rendering, which can differ by one
      intensity level between renders of one state.
    premises: [AXM-reproducible-measurement, AXM-one-execution-path, AXM-robosuite-controller-cache, AXM-robosuite-gripper-target-persists, AXM-libero-resamples-fixtures, LMA-seed-fixtures-per-init-state, AXM-libero-soft-reset-state]
    derivation_rule: >-
      Restated 2026-09-26 (theory cleanup) to the implementation: anchoring and holds hold in TaskEnv,
      where the skill teacher and every evaluation run, but PrivilegedEnv's placements and layout-sampler
      restores write state and hold without anchoring, so PrivilegedEnv moves outside the claim. The index
      clause now says an explicit index draws nothing, and the teacher's per-episode decisions are cleared
      before the first step of an episode reads any (bce70d4: before it, the start gate and let_go could
      read the previous episode's released and last-held objects; 30 episodes identical with and without
      the change). Earlier derivation and trials: git history and the ledger. Restated 2026-09-27 after
      the cleanup's verification round: TRL-1367's gaps -- the counter advanced by stored starts too, and
      the completeness of the execution layer's cross-episode state -- closed by stating the first and
      naming the second as measured.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  # ---- CMP-twist-servo: the twist servo and the joint ramp every policy's action goes through
  - id: BRN-servo-lead-scaled-uniformly
    subject: CMP-twist-servo
    claim_type: contract
    statement: >-
      TwistServo's step solves for the IK result theta by damped iterations, at least one, each of which
      clamps the configuration to the chain's joint limits, so theta lies within those limits. When theta
      would lead the measured joints meas by more than the lead limit max_lag (0.1 rad as SimArm sets
      it) on some joint, the joint reference is set to meas + s (theta - meas) with s = max_lag /
      max|theta - meas|, and the pose reference to FK of that reference; such a step is counted as a
      scale event, and also as a re-anchor when the IK residual (the pose error of theta against the
      pose reference) exceeds max_pose_err. Otherwise, theta being within max_lag of meas on every
      joint, the joint reference is theta, and when the IK residual exceeds max_pose_err the pose
      reference is re-anchored to FK of theta, which leaves the joint reference unchanged. Then, at
      command time, the joint reference leads the measured joints by at most max_lag per joint; on a
      scaled step that lead keeps the direction of theta - meas, the pose reference is exactly FK of the
      joint reference, and the joint reference lies within the joint limits on every joint where meas
      does. On the skill teacher -- libero_spatial 0 and 6 (init 48 included) and libero_goal 0, 7 and
      8, two episodes each -- success is no lower than with per-joint clipping.
    premises:
    - AXM-servo-tracks-reachable-poses
    - AXM-one-execution-path
    derivation_rule: >-
      Both branches of the step are in the claim, so the lead bound is algebra: unscaled, max|theta -
      meas| <= max_lag is the branch's condition; scaled, s max|theta - meas| = max_lag. Per joint the
      scaled reference lies between meas and theta, so within any joint interval holding both. Reduced
      to the clauses measured sound in all three reviews of this branch: lead at command time <=
      max_lag (up to float rounding); direction of theta - meas kept (cos >= 0.9999999999999997 on 1486
      scaled steps); pose reference = FK(ref) to 0.0 mm; non-binding branch bit-identical to the current
      servo (0 mismatches over 9599 steps); re-anchors counted exactly on the 10 scaled steps with
      residual > max_pose_err, no trajectory changed by the counting; success 10/10 vs 9/10 with and
      without the reset fix (24/30 vs 23/30 on 15 more tasks). Consequences measured under stated
      conditions, kept out of the claim because each held only in the condition measured: pressing on
      flat_stove_1_burner the stored lead is 30.3-32.2 mm (per-joint clipping 80.5 / 135.0 / 258.3 mm in
      3D); with the command reversed it unwinds at 2.4-2.7 mm per period against 2.5 commanded; if the
      block gives way the arm closes it within 3 periods at <= 0.46 m/s and 15.1 m/s^2, where clipping
      moves 78-121 mm or jumps 154 mm at up to 0.60 m/s and 24.6 m/s^2. evidence:
      CTR-servo-keeps-its-reference.
    sufficiency:
      n_min: 3
      min_consensus: 0.8

  # ---- CMP-skill-library: the hand-written skill teacher that still drives the student's demonstrations
  - id: BRN-carry-reachable-along-carry
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The place skill carries a held object at a height for the object's origin chosen once per (object,
      region, grasp point) in an episode, at the first place step after that grasp was chosen, and reused
      until the episode ends or another grasp point is chosen. The heights examined run in 0.03 m steps
      from a top derived from the geoms near the line from the object to the drop point and the object's
      hang below its origin -- at most 0.30 m above the drop point -- down to a floor 0.05 m above the
