  - id: BRN-place-lays-along-tilted-region
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Terms are BRN-carry-turns-object-to-fit's; poses and boxes are read from each step's state
      (AXM-grip-fixes-object-in-hand, AXM-mujoco-forward-is-a-function-of-state). A region is tilted when
      every axis of its box has a vertical component of magnitude below a declared bound, itself below
      one. For a tilted region, its normal n is its box axis with the least half-extent (the first among
      equals), signed so that its vertical component is not negative -- where that component is zero, as
      the box axis points; the held object's long axis is its box axis with the largest half-extent (the
      first among equals), signed so that its component along n is not negative -- where that component is
      zero, as the box axis points. At every carry and lower step of a place into a tilted region at which
      no roofed-entry direction is taken (BRN-place-enters-roofed-target-level), the commanded orientation
      is instead the tool's frame at that step rotated by the least rotation carrying the object's long
      axis, as held at that step, on to n -- the tool's frame itself where the two coincide. This replaces
      the place's own commanded orientation at those steps, as BRN-carry-turns-object-to-fit allows a
      later branch to; at places into regions that are not tilted, and at steps at which a roofed-entry
      direction is taken, nothing changes. Claimed: (1) at every such step the commanded orientation --
      before any branch after this one that states it replaces it -- is the tool's frame turned about the
      axis normal to both the object's long axis and n, by the angle between them, which is at most a
