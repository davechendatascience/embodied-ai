      measured or declared, the grasp planner offers, as a tier tried before every other, top-down grasps
      on the object's handle geoms: those collision geoms whose bounding-box centre lies at least a
      declared fraction of the farthest such centre's plan distance from the object's origin, and on the
      farthest centre's side of the origin -- the plan direction from the origin to the geom's centre has
      a positive dot product with the plan direction to the farthest centre -- and not covered: no other
      collision geom of the object has a world-axis-aligned bounding box whose plan extent contains the
      geom's centre and whose bottom lies above the top of the geom's own box. For each handle geom it
      considers the horizontal axes of the geom's bounding box (in the geom's current pose) whose extent
      plus a declared grip margin is at most a declared maximum jaw opening; a geom with no such axis
      offers no candidate. Otherwise the jaw axis is the considered axis most nearly perpendicular to the
      plan direction from the object's origin to the geom's centre, and when the box's most nearly radial
      horizontal axis is longer than three times the chosen axis's extent, the grasp points are spread
      along that radial axis. For any other category this branch offers no handle tier: a later branch may
      offer the handle candidates, formed as here, to a category declared otherwise and states where; the
      other tiers are as the grasp planner's other branches state. Claimed: this branch offers no handle
      candidate for an object whose category is not so declared; every handle candidate's jaw axis is,
      among the considered axes of its geom, the one most nearly perpendicular to that geom's radial
      direction; and every handle candidate lies on a geom whose centre is on the farthest centre's side
      of the origin and that no other geom of the object covers, as defined above. Not claimed: that the
      handle tier yields a reachable grasp, that the grasp holds, or that the outlying geoms on that side
