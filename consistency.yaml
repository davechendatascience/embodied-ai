      AXM-handle-shares-body makes the handle move with the joint, so the recorded orientation carried
      by the joint's motion since q0 is the recorded grasp held fixed in the handle's frame;
      AXM-object-geometry-known supplies q, the joint's axis and the handle geom's centre at every step,
