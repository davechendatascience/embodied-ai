  - id: BRN-drive-tracks-the-handle
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The first control step in an episode at which the skill drives a joint by its handle, it chooses
      one handle grasp -- an orientation, a jaw width and an approach direction, screened for reach
      along the joint's motion from the state at that step -- and records it with the joint's position
      q0 at that step; the choice is kept for the rest of the episode, and re-running the screen from a
      later state may choose differently. At every step the grasp orientation R_h and the approach are
      the recorded ones carried by the joint's motion from q0 to its current position q (turned by
      q - q0 about the hinge axis for a hinge, unchanged for a slide), and the grasp position p_h is the
      handle geom's current centre. While the handle is held, the drive target is the pose (R_h, p_h)
      carried by the joint's motion through dq, the joint's remaining travel to just past its goal
      threshold, clipped to 0.06 rad (hinge) or 0.03 m (slide). Claimed: given the recorded choice, the
      skill's command at every step of the drive is a function of the current state; and the drive
      target leads the handle's current grasp pose by at most 0.06 rad (hinge) or 0.03 m (slide), the
      rotation less than the squeeze alignment tolerance of 0.10 rad. Not claimed: that the recorded
      choice is re-derivable from a later state.
    premises: [AXM-dagger-needs-markov-labels, AXM-handle-shares-body, AXM-object-geometry-known,
               AXM-panda-gripper-geometry, LMA-holding-is-geometric]
    derivation_rule: >-
      AXM-handle-shares-body makes the handle move with the joint, so the recorded orientation carried
      by the joint's motion since q0 is the recorded grasp held fixed in the handle's frame;
      AXM-object-geometry-known supplies q, the joint's axis and the handle geom's centre at every step,
      and dq is read from q and LIBERO's threshold, so the target is a function of the current state and
      the recorded choice, and the clip bounds its lead. Whether the recorded choice meets
      AXM-dagger-needs-markov-labels is the open question: it is made once because re-solving it every
      step flipped the winner between candidates and the jaws cycled 15-35 mm without closing. A frame
      fixed in the world instead made the label depend on the joint angle at selection (0.15 rad of
      misalignment read at a knob angle of 0.02). evidence: CTR-teacher-reliable (goal 7, 12 -> 20/20
      paired; goal 0 20 -> 20).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-leave-handle-along-approach
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A skill may not start while a handle any skill has acted on this episode is held or enclosed by
      the jaws. For each such handle this is a predicate on the current state, read whenever a skill
      would start: the jaws do not hold it in DEF-holding's sense, no part of its geometry lies within
      the jaw envelope -- between the fingers, out to the finger meshes' reach past the tool point --
      and no robot geometry touches its geometry. It constrains where each handle is relative to the
      jaws, not where the arm may go: holding another object, or reaching over an opened drawer into it,
      satisfies it. The skill that acted on a handle ends by making the predicate hold for it: the jaws
      release, then the tool moves along the handle's approach axis as the drive left it, away from the
      handle, with no component across that axis and no other motion, until the handle -- its own
      extent along that axis included -- lies wholly beyond the finger meshes' reach past the tool
      point, and stops there. That pose, carried by the drive's motion, is screened with the drive's
      stations: a handle grasp whose retreat ends outside DEF-reachable-pose is not used. If it later
      fails for a handle --
      the arm drifting back until a handle is enclosed again -- that skill's retreat is re-entered
      before any other skill starts. The jaws release first because the predicate cannot hold while they
      hold the handle.
    premises: [AXM-panda-gripper-geometry, AXM-handle-shares-body, DEF-skill-contract, DEF-holding,
               BRN-drive-tracks-the-handle, DEF-reachable-pose, LMA-whole-path-reachable,
               AXM-object-geometry-known]
    derivation_rule: >-
      DEF-skill-contract makes disengagement the planner's obligation and gives its form: a skill that
      releases what it grasped ends with the jaws not holding it, none of it between the fingers and no
      robot geometry touching it, and no skill may start while that fails for anything an earlier skill
      in the episode released. For a drive what it grasped is the handle, which is why the touch clause
      is about the handle rather than the joint's whole body, and the quantifier over every handle acted
      on this episode is that definition's, not an addition here. An earlier statement put 'the hand
      holds nothing' and a standing distance from every handle into the predicate, which under this
      quantifier forbids carrying an object after opening a drawer and forbids reaching into the drawer
      just opened -- the task this branch exists to serve. What entangles the arm is a handle between
      the fingers, so the predicate is written about that and nothing else. AXM-panda-gripper-geometry
      supplies the jaw envelope: the finger meshes reach 9.3 mm past the tool point, so a handle whose
      nearest point along the approach lies beyond that reach is between no part of the fingers, and
      AXM-object-geometry-known gives the handle's extent. The stop is that predicate read on the
      current pose, not a distance travelled: an earlier statement required at least the pads'
      back-edge offset plus the reach, which bounds the retreat from below only, and the retreat it
      admitted ran 100-150 mm out -- measured at 107fa9c, the smallest singular value of the arm's
      Jacobian fell 0.108 -> 0.063 along it and the next skill's first motion crossed 0.003, the servo
      re-anchored and the arm swept an object set down beside the cabinet. LMA-whole-path-reachable is
      why the retreat's end is screened rather than assumed from the drive's end, and
      DEF-reachable-pose is what the screen demands.
      BRN-drive-tracks-the-handle supplies that axis as the drive left it, the grasp frame carried by
      the joint's motion, which for a hinge differs from the axis at the start. The touch clause is on
      the handle's own geometry rather than its body, because AXM-handle-shares-body says only that
      contact with the body does not locate a finger on the handle, not that every contact with the body
      pushes the joint. DEF-holding makes release a precondition of the predicate, which is all the
      ordering needs; an earlier statement argued it from how a held handle moves under a retreat, which
      no premise here supports. evidence: CTR-teacher-reliable (goal 3's drawer task is the one this
      governs; a 35 mm retreat on the same seeds took it 0/10 -> 2/10 with the smallest singular value
      after the drive at least 0.037), CTR-teacher-gentle.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-scan-then-place
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Every step of a place after its carry falls in exactly one of three cases, read from that step's
      state and the place's drop point, in this order. (R) The object rests on its intended support
      (DEF-resting) with its origin inside the goal region; or the jaw aperture is increasing; or the
      jaws are wider than the object along the jaw axis; or the aperture is at its fully open stop: the
      jaws are commanded fully open, and the tool straight up at the retreat speed if the jaws are wider
      than the object or at the fully open stop, else held still. (F) Otherwise, the object touches no
      body other than the robot: the jaws are commanded to hold it and the tool moves toward the drop
      point's descent, its linear speed no greater than the lower speed and no greater than
      sqrt(2 a max(c_s, 0)), c_s the clearance (LMA-clearance-bounds-motion) between the object and its intended
      support and a the servo's linear change bound while holding (BRN-execution-bounds-acceleration).
      (T) Otherwise: the jaws are commanded to hold it; while its tilt drop (the height its lowest box
      corner stands below its bottom face's centre) exceeds the lower phase's tolerance the tool goes
      down at a speed no greater than sqrt(2 a d), d that tilt drop, and otherwise straight up at the
      lower speed. Claimed: (1) every step falls in exactly one case; (2) the jaws are commanded open
      only in case R, and case R never commands them toward closed, so neither a flicker of holding, an
      opening that disturbs the object, nor an object wider than the open jaws brings them closed again
      while any of R's conditions holds; (3) every command is read from that step's state and the
      place's drop point. Not claimed, and named: that the object touches nothing but its support while
      lowered -- the servo's lead (AXM-servo-lead-bounds-travel, up to 34 mm) makes a clearance bound
      for that a future branch with a bounded-lead servo near supports; that lowering rights every
      tilted object; that case T's lift leads to a later rest; supports whose normals lie outside the
      friction angle (the wine rack's cradle); that the resting pose is within LIBERO's humans' tilt;
      that the retreat touches nothing; slip in the grip; that the drop point, chosen once per episode,
      is re-derivable from a later state; the provenance of the rest speed and the change bound.
    premises: [DEF-resting, LMA-contact-release-is-robust, LMA-release-when-resting-stays,
               LMA-clearance-bounds-motion, AXM-static-stability, AXM-libero-contact-parameters,
               AXM-servo-lead-bounds-travel, BRN-execution-bounds-acceleration, BRN-carry-turns-object-to-fit,
               AXM-libero-objects-are-boxes]
    derivation_rule: >-
      The release logic of the three placement rules measured on 2026-09-24, restated three times
      under the verifier. The cases are tested in order, so they are exclusive, and T is the remainder,
      so they are exhaustive -- an object resting with its origin outside the region falls in T and is
      lifted. R holds on an opening aperture, on jaws wider than the object, and at the fully open stop,
      so the chatter that lifted libero_90 77's book 5 cm -- holding flickering back as the jaws opened --
      and a rim-pinched bowl wider than the open jaws both stay in R. F admits contact with the palm or
      fingers only. DEF-resting, from AXM-static-stability, the measured friction and the objects' box
      shapes, says when a touch is a place to let go: a pot on one corner is not resting (its contacts
      have no hull with an interior) and T lowers on while it is tilted, which
      rights it (the moka pot, 14 of 20 only when pressed on); a bottle standing on the basket's floor
      rests. LMA-release-when-resting-stays and LMA-contact-release-is-robust make a release in R, once
      nothing but the support touches it, leave it at rest and unfallen. A stopping guarantee against
      other bodies was withdrawn: the tool follows the servo's reference, up to 34 mm ahead of it, not
      the commanded twist (AXM-servo-lead-bounds-travel). When built it replaces the second ground of
      BRN-place-onto-physical-support and its handle-held exception. Not yet implemented. evidence:
      CTR-teacher-settled, CTR-teacher-gentle (release_gap_mm <= 5).
    sufficiency: {n_min: 3, min_consensus: 0.8}

