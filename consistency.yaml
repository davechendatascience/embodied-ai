  - id: BRN-rl-teacher-markov-objective
    subject: CMP-rl-teacher
    claim_type: contract
    statement: >-
      A teacher policy trained at gamma = 1 (critic included) to maximise the episodic return
      of r_t = Phi(s_t) - Phi(s_t+1) + B [settled(s_t+1)] - lam |W (v(s_t+1) - v(s_t))|^2 -
      mu [contact(s_t+1)], where Phi is the sum over goal conjuncts of the task loss of
      BRN-task-loss-descends-to-scorer plus w_r times the reach, computed once per step;
      settled(s) is LIBERO's success with the jaws off the moved object (or handle) and that
      object at rest; v(s) is the tool's measured twist, W weighting angular rate by a 0.1 m
      lever; contact(s) is the robot or the object it holds touching anything the goal does
      not need; the episode ends when settled or at the horizon. It observes the Markov
      execution state -- arm joints and velocities, tool pose, jaw aperture and rate, the
      servo's rate-limited twist and its pose and joint reference errors, robosuite's finger
      target, time to go -- and the scene's privileged geometry: per conjunct the moved
      object's or handle's pose and box, the acceptance region and the loss's gap vector, and
      the pose and box of every other object and fixture. It acts through the student's twist
      and the student's gripper decode (a target among the decode's snap levels). Then (i)
      settled success at least smoothness and contact cost is its optimum whenever B exceeds
      that cost for some settled execution, since the return telescopes to Phi(s_0) + B -
      costs on success and stays below Phi(s_0) otherwise; (ii) given
      BRN-reset-anchors-execution, BRN-servo-lead-scaled-and-unwound and
      BRN-policies-read-current-state, the observation
      determines the next state's distribution, so a label at any state the student reaches
      means what the critic assumed; (iii) a demonstration is the mean policy executed through
      the one execution path, kept only if that mean policy itself reached settled success.
    premises: [AXM-libero-scores-final-state, AXM-bddl-states-goals-not-methods,
               AXM-object-geometry-known, AXM-dagger-needs-markov-labels, AXM-one-execution-path,
               AXM-velocity-steps-are-jerks, AXM-release-is-free-fall]
    derivation_rule: >-
      (to be implemented) Each change answers a finding of the review of
      BRN-rl-teacher-objective: settled success rather than LIBERO's first accepted step (a can
      counted inside the basket 4 mm below its rim, still in the jaws, or mid-fall); smoothness
      of the measured motion, a function of (s_t, s_t+1), rather than of the requested action;
      a contact cost for disturbing what the goal does not name; the snap levels so the
      student can reproduce the teacher's gripper; the execution fixes so the observation is
      Markov. Depends on BRN-task-loss-descends-to-scorer, BRN-reset-anchors-execution,
      BRN-servo-lead-scaled-and-unwound and BRN-policies-read-current-state (staged with it). Not claimed: that an optimiser finds
      the optimum -- a single-task pilot in component-belief measures that.
      Independent review falsified it: settled(s) read only the body origin's linear speed, so
      a wine bottle tilted 23-24 deg on the cabinet edge passed (origin 4.1-4.6 mm/s, centre of
      mass 19-20 mm/s, 0.37 rad/s) and then tipped over, success False; fixture joint rates,
      object velocities and the two fingers were unobserved (knob at 0.52 rad, +-0.1 rad/s: on
      vs off after 20 periods); drops earned the full B (a 10 cm drop onto the rack came to
      rest with success) because no term sees the released object; a contact indicator sampled
      once per 50 ms misses disturbances by pushed or released objects; TaskEnv ends episodes
      at LIBERO's first accepted step; time to go makes the policy non-stationary while the
      student never sees it; the mean of a categorical gripper head is undefined. Superseded
      by BRN-rl-teacher-settled-objective.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-rl-teacher-settled-objective
    subject: CMP-rl-teacher
    claim_type: contract
    statement: >-
      A teacher policy trained at gamma = 1 (critic included; truncation at the horizon
      bootstrapped by the critic; LIBERO's done ignored; any entropy bonus kept out of the
      return) to maximise the return of r_t = Phi(s_t) - Phi(s_t+1) + B [settled(s_t+1)] -
      lam |W (v(s_t+1) - v(s_t))|^2 - rho sum_o [o free] (speed_o(s_t+1) - v_tol)_+^2 - kappa
      [gripper level changed], where Phi = sum over goal conjuncts of (task loss of
      BRN-task-loss-exact-separation + w_r reach) + mu Psi, computed once per step; Psi sums
      each body the goal does not name (free objects by position and a lever-weighted rotation,
      fixture joints in joint units) over its displacement from the episode's start beyond a
      tolerance; speed_o is a movable body's centre-of-mass speed plus a lever times its angular
      speed, o free when no robot geom touches it, and v_tol = sqrt(0.05^2 + 2 g 0.005) m/s, the
      landing speed of a release that DEF-gentle-placement allows; v(s) is the tool's measured
      twist; settled(s) holds when LIBERO's success holds, the jaws touch neither the moved
      object nor the handle, and a privileged rollout from s holding the arm still for 0.75 s
      keeps success true throughout and ends with every body's centre-of-mass speed, angular
      speed and joint rate below rest thresholds. The episode ends when settled. The policy
      observes the execution state (arm joints and velocities, both finger joints, tool pose,
      the servo's rate-limited twist and reference errors, robosuite's finger target), the pose,
      box, linear and angular velocity of every free object and each fixture joint's position
      and rate, per conjunct the acceptance region and the loss's gap vector, and each
      non-goal body's start pose; no time to go. It acts through the student's twist and a
      categorical choice among the student's gripper snap levels. Then (i) settled success at
      least cost is the optimum whenever B exceeds that cost (disturbance mu Psi at the end,
      smoothness, free motion, gripper changes) for some settled execution, since Phi(s_0) =
      the loss at the start, Phi >= 0, the task terms vanish on success, and every
      non-settling trajectory returns below Phi(s_0); (ii) given BRN-reset-anchors-execution,
      BRN-servo-lead-unwound-when-not-followed and BRN-policies-read-current-state, the observation
      determines the next state's distribution up to the solver's warmstart (measured 2.6e-5 m
      over 40 steps); (iii) a demonstration is the policy's mode (twist mean, most probable
      gripper level) executed through the one execution path, kept only if it reaches settled.
    premises: [AXM-libero-scores-final-state, AXM-bddl-states-goals-not-methods,
               AXM-object-geometry-known, AXM-dagger-needs-markov-labels, AXM-one-execution-path,
               AXM-velocity-steps-are-jerks, AXM-release-is-free-fall, DEF-gentle-placement]
    derivation_rule: >-
      (to be implemented) Answers the review of BRN-rl-teacher-markov-objective point by point:
      the rollout makes settled a function of the full state that catches tipping and rocking
      (the 23-24 deg bottle must read not settled); the free-motion cost prices drops, bounces
      and anything knocked into motion without a sampling gap longer than the fall (a 10 cm
      drop lasts 140 ms, about 3 samples), and costs nothing for a release DEF-gentle-placement
      allows; Psi prices lasting disturbance as a potential, so it telescopes; velocities and
      fixture rates are observed; bootstrapping at truncation keeps the policy stationary like
      the student; the gripper is a categorical over the snap levels with a switching cost, its
      mode defined. Not claimed: that an optimiser finds the optimum -- a single-task pilot in
      component-belief measures that.
      Independent review falsified it: at gamma = 1 with truncation bootstrapped, time is free,
      so a slower copy of any execution scores better (smoothness fell 7.8-8.0x per halving of
      speed on one path through the real servo) and no least-cost optimum exists; settled
      checked only the finger bodies, so a bottle propped by the palm past its 22.72 deg
      tipping point passed and fell once the arm left, and a +-1e-3 deg band about the balance
      point passes any finite still-hold; the free-motion term sampled every 50 ms left drops
      of 1-2 cm unpriced at 9-18 of 25 clock phases; the gripper-change term and the servo's
      blocked test read unobserved previous values, and finger velocities (read by the gripper
      servo) were unobserved; the settled rollout disturbed the live episode (5.4e-3 on qpos)
      unless the controller, servo, ramp and finger target were restored too; goal-named
      supports (the basket, the plate) could be shoved for free; dead-end states make values
      unbounded below. Superseded by BRN-rl-teacher-timed-objective.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-rl-teacher-timed-objective
