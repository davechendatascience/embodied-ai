      step the crossing pitch was chosen because its frame's poses there were not fixed-blocked, the same
      poses under the same state. Claim (4): with no decision the replacement never applies. Evidence,
      measured: LIBERO's humans cross the shelf's face with the book pitched down 23 deg (median of 20
      demonstrations, 5-45) in libero_90 86, 31 deg (10-52) in 88 and 44 deg (32-57) in 89, and release it
      at 9 deg (the lay pitch, 0.15 rad). At the lay pitch the hand, 21 cm across its jaws held up and
      down, came down at E on the book standing in front of the shelf (the arm touching at E and at every
      height up to 9 cm above it, in 8 of 8 initial states of 86 sampled; in 88 only below 6 cm), was
      pushed 23 mm off the entry line, lifted and came down again, to the horizon: 86 42 of 50 in v42.
      With the crossing pitches (0.5, 0.4, 0.3 rad), 86's 8 failing initial states succeeded in 8 (in
      168-186 steps), and 88's first ten in 10. Pitched 0.5 rad with no screen, 88's level poses were
      fixed-blocked, its steep decision fired and the book went on to the shelf's top board: 1 of 20.
      evidence: CTR-teacher-reliable. Restated per the verifier: claim (4) is of u's level frame only -- a
      crossing frame on an earlier direction can change which directions are evaluated at a step, and so
      the step at which a later direction's steep decision is made (refuted as first stated).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-other-arm-starts-at-the-panda-tool-pose
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      Every placement from LIBERO's initial state k is preceded by a reset before which numpy's global
      generator is seeded from (seed, k) as LMA-seed-fixtures-per-init-state has it. On an arm whose robot
      reset draws n normals (AXM-robot-reset-draws-per-joint), the generator is then advanced by 7 - n
      normals before that reset when n < 7, not at all when n = 7, and when n > 7 the placement raises
      before that reset. Hence, for a given (task, seed, k), the fixture poses at placement are the ones
      the Panda's reset draws in that task. After the reset and the writing of the initial state, before
      the execution layer is anchored, the state is as follows. On the Panda it is the initial state
      itself, unchanged. On any other arm: the object joints hold the initial state's object block, joint
      by joint; the finger joints are written explicitly -- the recorded Panda's finger joints when the
      arm carries the gripper LIBERO recorded with, else that gripper model's own start opening; and the
      arm's joints hold one configuration that is a function of the initial state, the models, the fixture
      poses and k -- nothing the reset leaves in the arm's joints enters it. Its target T* is the tool
      pose, in the robot's base frame, that the initial state's seven Panda arm joints give through the
      Panda's kinematic chain with the grip-site offset of the gripper LIBERO recorded with. Its
      candidates are the results of the damped IK solve of DEF-reachable-pose for T* on this arm's chain,
      one per seed of an ordered list: the arm model's own start joints first, then draws within the joint
      limits from a generator seeded by k, separate from numpy's global one. The configuration placed is
      the first candidate in that order that is a reachable pose in DEF-reachable-pose's sense and with
      which -- written into the state with those finger joints and forwarded -- MuJoCo's collision
      detection reports no contact of negative distance between a geom of the robot's bodies and a geom of
      a body that is not the robot's. If no seed yields such a candidate the placement raises; the arm is
      never started elsewhere. Consequently, on a non-Panda arm: at placement MuJoCo reports no
      penetrating contact between the robot and anything else; the tool is at the world pose at which the
      Panda's tool was recorded, up to the IK tolerance; and the same task, seed, k and models give the
      same fixture poses and the same start configuration. Not claimed: anything about the Panda's own
      placement beyond its being the recorded state; penetration between geom pairs MuJoCo does not
      collide; that the objects then settle exactly as they do on the Panda, since the arm's links occupy
      other space and the simulated system has other joints; that T* is reachable on every arm at every k;
      or anything about the robot's contacts after placement.
    premises: [AXM-libero-init-states-record-a-panda, AXM-robot-reset-draws-per-joint, AXM-libero-resamples-fixtures, LMA-seed-fixtures-per-init-state, AXM-libero-soft-reset-state, AXM-mujoco-forward-is-a-function-of-state, DEF-reachable-pose, AXM-reproducible-measurement]
    derivation_rule: >-
      The fixture poses follow from the seeding (LMA-seed-fixtures-per-init-state), the draw count
      (AXM-robot-reset-draws-per-joint: 7 - n advanced plus n drawn by the reset is the Panda's 7, as one
      sequence) and the scene being the Panda model's on every registered arm
      (AXM-libero-init-states-record-a-panda), whose samplers read the generator and the scene, not the
      robot. The placement's screen forwards exactly the configuration placed -- arm, fingers, object
      block -- so by AXM-mujoco-forward-is-a-function-of-state its contact verdict is the placement's. The
      tool pose follows from the base pose being the Panda's and the IK converging (DEF-reachable-pose's
      tolerance). The start configuration is a function of its inputs because the seeds are: the model's
      own start joints, then a generator seeded by k; every candidate overwrites all arm joints. Refuted
      twice before this statement (TRL-1090: fixture poses left to an unseeded generator; TRL-1093: k
      named where the reset's draws make the first seed depend on (seed, k)); the gaps of TRL-1094 and
      TRL-1097 (object-block mapping, the samplers' inputs) were closed by restating the init-state axiom
      on measurements of 4 arms x 130 tasks, and the gap of TRL-1100 (the reset's arm joints as the first
      seed) by seeding from the model's own start joints, and the gap of TRL-1118 by naming the task in the reproducibility clauses. The consequences
      kept out of the claim are measured: over the 40 matrix tasks at init 0, the largest distance of any
      object from the Panda's post-reset position and the tool's distance from the recorded pose.
      evidence: CTR-other-arm-scene-as-panda.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-screen-probes-the-grasp-not-the-column
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The reach screen probes, for each grasp candidate, the poses of one list: the grasp, the pre-grasp,
      the approach between them at the declared step, the via point when one is given, and the poses its
      caller adds (the drive's stations, the release). It adds no pose at a fixed height above the
      pre-grasp: a pose above the pre-grasp is probed only if it is one of the listed poses. Each probed
      pose is solved by the declared IK from the arm's joints as read at the step, independently of the
      other probes and of their order, and is judged from that solution alone. A candidate is feasible
      exactly when every pose in its list is reachable in DEF-reachable-pose's sense and no probe puts the
      arm inside a fixture; asked for a feasible candidate, the screen answers with one or with none
      (DEF-witness-or-refusal) -- what a caller does with none, including forcing a candidate as the grasp
      choice does today, is outside this claim. A chosen grasp -- its tool frame and grasp point, and so
      its pre-grasp -- is fixed in the world, kept until the object's centre has moved more than a
      declared distance from where it was when the grasp was chosen, and then chosen again. The pick's
      crossing plane (BRN-pick-descends-beside-overhang) is a travel height, not a witness of any
      predicate: no caller assumes the arm can hold it. It is set with the grasp, each time the grasp is
      chosen, and kept with it: of a declared ladder of heights running down from the higher of what the
      obstacles ask for and the pre-grasp's height plus the back-off, to the pre-grasp's height plus the
      back-off, the highest at which the tool, at the grasp's orientation over the pre-grasp, has a
      solution from the arm's joints at that step that is reachable in DEF-reachable-pose's sense with the
      arm not inside a fixture; if no rung passes, the lowest rung, the pre-grasp's height plus the
      back-off, whether or not it passed. So while a grasp is kept its crossing plane is at least the
      back-off above its pre-grasp. Consequently the feasible candidates include every candidate that a
      screen whose lists also held poses 5 and 10 cm above the pre-grasp found feasible, since each
      remaining probe's verdict is unchanged. Not claimed: that the straight descent from the crossing
      plane to the pre-grasp is reachable at every point of it -- where the lowest rung is taken without
      passing, the descent passes poses no screen tested, and where a pose is unreachable the tool does
      not follow the command there (AXM-servo-tracks-reachable-poses); that the choice among candidates is
      unchanged; or anything about skills whose motions the screen does not probe.
    premises: [DEF-reachable-pose, DEF-witness-or-refusal, BRN-pick-descends-beside-overhang, AXM-servo-tracks-reachable-poses]
    derivation_rule: >-
      Feasibility is a conjunction over the candidate's list, and each probe's verdict depends only on its
      own pose and the arm's joints at the step (the declared IK is deterministic in its start joints,
      target and joint ranges), so removing the fixed-height poses from every list can only admit
      candidates. The crossing plane is set once per grasp choice from the ladder, whose every rung, the
      fallback included, is at least the pre-grasp's height plus the back-off, and the grasp is fixed in
      the world while kept, so the plane cannot fall below that. Proven 3/3 as TRL-1147..1149 after
      restatements answering TRL-1138..1146. Measured 2026-09-26: without the fixed-height probes the
      Panda's 6,500-episode sweep scores 6,444, as v48 did (10 episodes differ: libero_spatial 4 +4 -1,
      libero_90 32 +1 -3 and 64 -1, each a fragile grasp choice flipping), and the four-arm matrix goes
      from 146 to 149 of 160, losing none. evidence: CTR-teacher-reliable.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-other-arm-starts-in-its-home-family
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      This refines BRN-other-arm-starts-at-the-panda-tool-pose in one clause, which configuration of the
      target T* is placed; everything else it states (the seeded fixture draws, the object block, the
      fingers, T*, the contact screen, raising when no candidate passes) stands as it states it. The
      family of a configuration q is a triple of bits computed from sines and cosines, so it is the same
      whatever whole turns a joint carries: on the six-joint UR5e, whether the cosine of the first joint
      is positive, whether the sine of the third is positive, whether the sine of the fifth is positive;
      on a seven-joint arm, whether the sines of the second, fourth and sixth joints are positive. An arm
      with a given gripper may carry a declared home family H. If it does and H differs from the family of
      the model's own start joints q_s, one further candidate is formed before the refined branch's seed
      list: the damped IK solution of T* from a single seed, q_s mirrored on the joints that define the
      family wherever q_s's bit disagrees with H -- on a seven-joint arm that joint negated; on the UR5e
      the third or fifth joint negated, and the first joint set to q_s's value plus half a turn if that
      lies within its limits, else minus half a turn if that does; if neither does, or a negated joint
      leaves its limits, there is no such candidate. That candidate is placed, exactly as solved, if it
      lies in H, is reachable in DEF-reachable-pose's sense, and, written into the state with the fingers
      as the branch places them and forwarded, no robot geom penetrates a non-robot geom; otherwise the
      refined branch places its configuration from its own seed list, and the placement records that H was
      not reached. An arm with no declared home family, or whose home family is q_s's, starts exactly as
      the refined branch has it. The home family is a constant of the (arm, gripper) pair, taken from a
      measurement on tasks outside those on which the pair's transfer is reported (libero_spatial,
      libero_object, libero_goal, libero_10): over the 90 libero_90 tasks at initial state 0, each family
      H is scored by the number of episodes that succeed when started by this rule with H declared, every
      other input of the episodes fixed and named with the measurement (the episode seed, the code
      revision, the gripper); the home family is the family with the highest count, ties going to q_s's
      family if it is among them and otherwise to the smallest triple in lexicographic order
      (AXM-parameters-derived). Consequently the placed configuration is a function of the initial state,
      the models, the fixture poses, k and the declared family; no number of random draws enters the
      home-family candidate; and on an arm whose home family is its start family nothing changes. Not
      claimed: that the mirrored seed reaches H at every k or on every arm; that the home family is best
      on any other suite, initial state or gripper; that one family serves every task; or anything about
      the configurations the arm passes through after placement.
    premises: [BRN-other-arm-starts-at-the-panda-tool-pose, DEF-reachable-pose, AXM-mujoco-forward-is-a-function-of-state, AXM-parameters-derived, AXM-reproducible-measurement]
    derivation_rule: >-
      The refined branch's clauses stand; this one adds a single candidate formed before its seed list.
      Its placement is deterministic (one IK solve from a seed fixed by q_s and H, no random draws) and
      passes the same reachability and contact screens, so the refined branch's consequences carry over,
      and where H is not reached the refined branch places as before. Family bits are sines and cosines,
      so no whole turn changes them. Proven 3/3 as TRL-1156..1158 after restatements answering
      TRL-1150..1155. The calibration, measured 2026-09-26 at 2de75e7 (libero_90, initial state 0, episode
      seed 555 * 100 + task, the Panda gripper): the UR5e's family (0, 0, 1) -- the shoulder panned to the
      far side of the base -- succeeds on 90 of 90 tasks against 85 for its start family (1, 1, 0), the
      other six scoring 54 to 85; the Kinova3's, the IIWA's and the Jaco's start families score 85, 88 and
      85 and no other family of theirs scores higher (the mirrored seed reaches them on 0-5, 51-71 and 0
      tasks), so only the UR5e declares a home family. evidence: CTR-other-arm-scene-as-panda.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-vla-learns-the-recorded-motion
    subject: CMP-vla-student
    claim_type: contract
    statement: >-
      A training pair of the Panda VLA taken from LIBERO's human demonstrations is taken from them as they
      are stored; nothing is re-simulated or re-rendered. The pair at stored step j is the observation
      stored at j -- both camera images and the proprioception -- which shows the state the recorded
      action j led to, whose arm joints, and so its tool pose, are those of the recorded state j+1
      (AXM-libero-demo-observations-follow-their-actions), and a label in two parts. The arm part is
      computed from the recorded states alone: the constant body twist whose motion over one control
      period carries the tool pose of the recorded state j+1 to the tool pose of the recorded state j+2
      (the SE(3) logarithm of their relative pose divided by the period, a fixed constant, the tool poses
      being the forward kinematics of the recorded arm joints through the Panda's chain and its fixed tool
      frame, AXM-libero-demos-record-a-panda), divided componentwise by the action range's bounds, fixed
      constants: set before any pair is read and by no statistic of any training set. The gripper part is
      the gripper command the demonstration recorded at step j+1 (AXM-libero-demos-record-their-actions).
      A stored observation with no recorded state two steps after it has no pair. Consequently each
      label's arm part is the displacement the demonstrator's arm made over the control period that began
      with the arm where its observation shows it, exact at the period's end -- the pose it names is the
      forward kinematics of the next recorded state -- while it fixes neither the path the tool took
      within the period nor, on the seven-joint arm, the joints it ended at; its gripper part is the
      command the demonstrator issued for that same period; and nothing in such a pair depends on our
      simulator or execution path. Not claimed: that the evaluation's execution reproduces a label's
      displacement (the decode is its own design); that the labels lie within the action range; that a
      policy trained on these pairs succeeds or uses its images.
    premises: [AXM-libero-demos-record-a-panda, AXM-libero-demos-record-their-actions, AXM-libero-demo-observations-follow-their-actions]
    derivation_rule: >-
      The user's call (2026-09-26): keep the labels pristine -- LIBERO's own data, no relabelling by
      re-execution, no re-rendered dataset (94 GB of demonstrations already on disk; the rendered replays
      would have added about 60 GB) -- and learn twists, which our own decode turns into joint motion.
      LIBERO's stored actions are operational-space set-point offsets, not displacements: the arm moved
      0.23x the commanded offset per step (median; p10 0.16, p90 0.28, 5 libero_spatial demonstrations),
      and replayed open loop as displacements through our decode they failed 28 of 30 (tool 24-30 cm off
      the path). The recorded motion is what the arm did: from recorded joint states j+1 and j+2 the
      finite twist and back through converged inverse kinematics the pose agrees to 9.5e-11 mm (max over
      469 steps), while the joints differ by up to 0.0136 rad in the seventh joint's null space. The
      stored observation at j shows state j+1 exactly (4941 steps), which is why the label starts from
      state j+1. Evidence: CTR-vla-libero-success. Scoped 2026-09-26 to pairs taken from LIBERO's
      demonstrations (TRL-1281: 'every training pair is LIBERO's' contradicted training on the skill
      teacher's episodes as well, BRN-vla-teacher-pairs-as-demo-pairs); what it says of those pairs is
      unchanged. Restated after TRL-1286 and TRL-1289: the action-range bounds, the control period and the
      tool frame are stated as fixed constants set by no training set (their values are the code's, not
      premises here), so pairs from other sources cannot move a LIBERO label; the arm part (from states)
      and the gripper part (from the recorded action) are stated apart. TRL-1295: the stored observation
      is claimed to equal recorded state j+1 in the arm joints only, what the axiom gives and all the arm
      label needs. TRL-1307: the consequence speaks of the arm part as a displacement and the gripper part
      as a command.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-vla-decodes-twists-exactly
    subject: CMP-vla-student
    claim_type: contract
    statement: >-
      The Panda VLA's actions are executed, identically wherever it is evaluated or its labels are
      replayed (AXM-one-execution-path), by a twist servo on the joint-position controller: each step's
      twist, after the servo's acceleration bound (the free-motion bound kept while the jaws hold
      something), is integrated as a constant body twist over the control period onto the servo's pose
      reference, and the servo's damped inverse kinematics is iterated until the pose of its joint
      reference is within 1e-6 mm and 1e-6 rad of that pose reference or a cap of 30 iterations is
      reached; the null-space motion the twist leaves free is pulled toward the joint posture the episode
      started in; the gripper channel is the simulator's own open/close command, executed as it is; and
      the observation returned for each step is a forced read taken after the step's physics. The servo
      resets its pose reference to its joint reference's pose (BRN-servo-lead-scaled-uniformly's
      re-anchor) only when their difference exceeds 0.02 in the norm of its logarithm, above the
      iteration's tolerance. Every step at which the acceleration bound changed the twist, the lead limit
      scaled the joint reference (BRN-servo-lead-scaled-uniformly), the iteration cap was reached, or the
      pose reference was re-anchored is counted. Consequently, at every step with none of those four
      events the pose reference moves by exactly the policy's twist over the period and the joint
      reference the controller is sent reaches that pose to within 1e-6 mm and 1e-6 rad, so the decode
      adds no kinematic error and whatever separates the tool from where the twists put it is the
      controller's tracking (bounded by AXM-servo-lead-bounds-travel); and the observation the policy acts
      on shows the state the previous step's action led to (AXM-robosuite-step-observes-the-period-end: a
      forced read reports the state as it stands), the point of a step at which its stored training
      observations were read (AXM-libero-demo-observations-follow-their-actions). Not claimed: that the
      tool reaches the reference within a period; that the path within a period is the twist's screw
      motion; that the joints or the elbow match the demonstrators'; that the policy succeeds.
    premises: [AXM-one-execution-path, AXM-robosuite-step-observes-the-period-end, AXM-libero-demo-observations-follow-their-actions, AXM-servo-lead-bounds-travel, BRN-servo-lead-scaled-uniformly]
    derivation_rule: >-
      Restated after TRL-1189..1191: the re-anchor threshold is stated (0.02, far above the 1e-6
      tolerance) and a re-anchor is counted as a fourth event. Measured 2026-09-26, the demonstrations'
      recorded motion replayed open loop as twists through this decode: with one damped iteration per
      step, as the skill teacher runs, the joint reference missed the pose reference by 0.06-0.18 mm
      (median, up to 0.54 mm); with 30 iterations and the start-posture pull by 6e-9 mm (median, at most
      9.3e-7 mm). Over 800 demonstrations of the four suites' 40 tasks (20 each) the dense recorded motion
      replayed 733 times (91.6%), the tool up to 8.5 mm off the recorded path (median over demonstrations)
      -- the joint controller ends each period about 0.6 of a step behind its target. The start-posture
      pull, like the null-space term of the operational-space controller the demonstrations were recorded
      through, kept the joints within 0.18-0.29 rad of the recorded ones against 0.28-0.44 rad with the
      skill teacher's pull to mid-range. A read forced at the start of every step left the next step's
      observation up to 0.145 rad behind the end-of-period state, and feedback on it overshot
      (libero_spatial 0 replays 20 -> 7 of 20). Evidence: CTR-demo-replay-succeeds.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-vla-sees-and-acts-as-trained
    subject: CMP-vla-student
    claim_type: contract
    statement: >-
      The Panda VLA's model receives, in training on pairs taken from LIBERO's demonstrations and in
      evaluation, inputs made by one preprocessing applied to an observation read at the same point of a
      step: both camera images at the resolution LIBERO stores them, turned upright the same way; the
      task's instruction, the language string LIBERO's benchmark defines for that task, in training and in
      evaluation alike; and a proprioceptive vector -- the tool pose in the robot's base frame (the
      forward kinematics of the observed arm joints through the Panda's chain, with the tool frame the
      labels use) and the finger opening -- computed by the same function. In evaluation every observation
      the model acts on is a forced read of the state as it stands: the first of an episode taken of the
      placed state, every later one after a step's physics (BRN-vla-decodes-twists-exactly,
      AXM-robosuite-step-observes-the-period-end). Its outputs are a chunk of H actions, each a normalized
      twist and a gripper score; position i of the chunk for the pair at stored step j is trained on the
      label of stored step j+i of the same demonstration, and positions past the demonstration's last pair
      are left out of the loss. Each twist target is its label minus a mean and divided by a standard
      deviation, per component, both fitted on the training labels alone and stored with the weights, with
      no clipping; each gripper score is trained by binary cross-entropy toward the recorded command, +1
      or -1 (AXM-libero-demos-record-their-actions), mapped to 1 and 0, so its decision boundary is a
      score of 0 with +1 on the positive side. At evaluation each twist output is multiplied by the same
      standard deviation and has the same mean added, which undoes the training map exactly, is clipped to
      the action range if it falls outside it, is multiplied by the same action-range bounds the labels
      were divided by, and is executed over the same control period as a body twist of that same tool
      frame (BRN-vla-decodes-twists-exactly); the gripper command executed is +1 for a positive score and
      -1 otherwise; the first k actions of a chunk are executed before the model is queried again, H and k
      stored with its weights; and the model's parameters are read nowhere but from those weights.
      Consequently, for pairs taken from LIBERO's demonstrations, the model's inputs are the same function
      of the observation and the task in training and in evaluation, each observation showing the state as
      it stands where the stored ones show the state their step led to
      (AXM-libero-demo-observations-follow-their-actions); and at every step whose twist output lies in
      the action range and at which none of BRN-vla-decodes-twists-exactly's four counted events occurs,
      the executed displacement is the one such a pair's label of that output's value encodes
      (BRN-vla-learns-the-recorded-motion), and every executed gripper command is one such a label can
      take: no difference between training on those pairs and evaluation lies in the input or output
      interface at those steps. Not claimed: anything about training pairs from other sources (a source is
      covered only by a claim that its pairs meet the training-side conditions stated here); that the
      evaluation reaches states like the training ones; that a state's rendered images are pixel-identical
      to the stored ones (they are rendered anew, not read from the files); that no step clips or has a
      counted event (a chunk's first twist can differ from the last executed one by more than the
      acceleration bound allows); that the policy succeeds or uses its images.
    premises: [AXM-one-execution-path, AXM-robosuite-step-observes-the-period-end, AXM-libero-demo-observations-follow-their-actions, AXM-libero-demos-record-their-actions, BRN-vla-learns-the-recorded-motion, BRN-vla-decodes-twists-exactly]
    derivation_rule: >-
      Restated after TRL-1201..1203: the first observation of an episode is a forced read of the placed
      state; the instruction is the benchmark's language string in both; the gripper output is a score
      trained by binary cross-entropy with its boundary at 0, executed +1 above it and -1 otherwise.
      Earlier restatements (TRL-1192..1194, TRL-1198..1200): the consequence is sameness of the interface,
      not of pixels; the output clause holds at steps without a clip or one of the decode's counted
      events; the normalization is an unclipped z-score the evaluation undoes. A model trained under one
      interface and evaluated under another is evidence for neither (AXM-one-execution-path). Measured
      2026-09-26: LIBERO's stored images are 128 x 128 per camera in robosuite's convention, as the
      evaluation renders them, and Qwen3-VL's processor enlarges any image under 256 x 256 the same way in
      both; on a demonstration the proprioceptive vector of stored observation j equals that of recorded
      state j+1 exactly, and the label applied at state j+1 lands on state j+2 within 1.8e-7 mm; the
      labels lie well inside the action range (largest component 0.27 of it on libero_spatial 0). Scoped
      2026-09-26 to training on pairs taken from LIBERO's demonstrations (TRL-1283: its training-side
      clauses rest on LIBERO-only premises once BRN-vla-learns-the-recorded-motion was scoped); another
      source is covered by a claim that its pairs meet the same conditions.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-vla-teacher-pairs-as-demo-pairs
    subject: CMP-vla-student
    claim_type: contract
    statement: >-
      Training pairs for the Panda VLA may also come from the skill teacher's episodes, recorded so that
      each meets the interface conditions BRN-vla-learns-the-recorded-motion and
      BRN-vla-sees-and-acts-as-trained state of a pair taken from LIBERO's demonstrations: where its
      observation is read, how its inputs are made, how its labels are computed and from what, and the
      values its gripper label takes. A teacher episode of a LIBERO task runs on the Panda of that task's
      LIBERO scene, the arm LIBERO's demonstrations record (AXM-libero-demos-record-a-panda), whose
      recorded states hold its arm joints where LIBERO's flattened states hold them and whose tool frame
      is the one the labels use; it runs through the VLA's execution -- the same servos and decode as the
      VLA's evaluation (AXM-one-execution-path) -- one step of the environment, one control period, per
      recorded step, with the observation after every step a forced read of the state as it stands
      (AXM-robosuite-step-observes-the-period-end), the read the evaluation acts on. By design the VLA's
      execution acts on the simulator only within a step's call -- its servos and decode compute and write
      their commands there -- and the teacher and the recorder only read it; the recorder captures the
      simulator's state immediately before each step's call and reads the observation immediately after
      the call returns, so nothing writes the simulator between the read after step j and the capture
      before step j+1. The teacher's gripper channel is executed as the two-valued command the VLA's
      gripper takes: +1 only when the teacher asks for a squeeze, -1 otherwise; in the VLA's execution
      that value is given unchanged as the gripper entry of the action robosuite's controller executes,
      the entry through which LIBERO's demonstrations' recorded commands were executed
      (AXM-libero-demos-record-their-actions), and the value given is the value recorded. The recorder
      writes, per episode and under its task, the file layout LIBERO's demonstrations have: at each step
      j, the captured state as recorded state j, the action executed in the step (its last entry that
      gripper command) as recorded action j, and the observation read after the step as stored observation
      j -- both camera images as the simulator renders them for the evaluation, at the resolution and in
      the row order LIBERO's stored images have, and the arm joints and the finger positions, the only
      proprioceptive fields the VLA's input is computed from (BRN-vla-sees-and-acts-as-trained). Stored
      observation j therefore shows recorded state j+1 -- in full, where LIBERO's shows it in the arm
      joints (AXM-libero-demo-observations-follow-their-actions). Only episodes that meet LIBERO's
      predicate within the suite's step limit are kept. Pairs are read from such a file by the same
      function as from LIBERO's, with the instruction LIBERO's benchmark defines for the file's task:
      stored observation j, preprocessed by the same function, with the arm label computed from recorded
      states j+1 and j+2 by the same function, through the Panda's chain and the same fixed constants, the
      gripper label the command recorded at step j+1, and the chunk's later positions from the same
      episode's later steps. Consequently a teacher pair meets each of those interface conditions -- its
      inputs the same function of an observation read where the evaluation reads, its arm label the
      displacement the Panda's arm made over the control period that began with the arm where its
      observation shows it, its gripper label +1 or -1 given to the same gripper entry the VLA's own
      commands are given to -- so the interface conclusion of BRN-vla-sees-and-acts-as-trained holds for a
      model trained on pairs of both sources: no difference between training and evaluation lies in the
      input or output interface at the steps it names. Not claimed: that a teacher pair is, as a LIBERO
      pair is, independent of this project's simulator and execution path -- its images are this
      simulator's renders and its arm label is the motion this execution produced; that the teacher moves
      like LIBERO's human demonstrators, or that the union helps; that the images of the two sources look
      alike; that a teacher's squeeze and a human's close happen at the same moments; that the fingers
      answer a command as they did in the robosuite release the demonstrations were collected with; that
      the labels lie within the action range; anything about episodes on other arms.
    premises: [BRN-vla-learns-the-recorded-motion, BRN-vla-sees-and-acts-as-trained, AXM-libero-demo-observations-follow-their-actions, AXM-libero-demos-record-their-actions, AXM-libero-demos-record-a-panda, AXM-robosuite-step-observes-the-period-end, AXM-one-execution-path]
    derivation_rule: >-
      E2 (docs/vla_comparisons.md): VLA-JEPA, trained on LIBERO's demonstrations alone, fell from 99.0% on
      LIBERO's starts to 70.0% on the randomized set's (tasks 0-3), 72% of its failures precision misses;
      the skill teacher at 1.5x the test set's range under the VLA's execution solved 450/475 draws on
      nine tasks and 50/164 on task 4 (the drawer: the two-valued gripper cannot hold the teacher's
      pre-shape, under study). The user chose to train on teacher episodes from widened starts. Proposed
      and verified 2026-09-26: TRL-1279..1281 (DOUBTED: proprioceptive fields, one step per period, the
      gripper's entry, and BRN-vla-learns-the-recorded-motion's 'every pair is LIBERO's', since scoped);
      TRL-1297..1299 (REFUTED on scope: 'every condition' took in a LIBERO pair's independence from our
      simulator; now the interface conditions only, and the execution acting on the simulator only within
      a step's call); TRL-1303..1305 (DOUBTED: which arm); TRL-1309..1311 (PROVEN, staged).
      squeeze_command is 5aa47b2. Evidence to be measured: the demonstration-replay gate on teacher files
      (CTR-demo-replay-succeeds, a teacher condition).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-clear-before-opening
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      At a control step where the plan's current step is pick(o), the step after it is place_in(o, r), r
      belongs to an articulated container j, that place's goal does not already hold with o let go, and
      the open test (BRN-open-precondition-reads-the-running-drive) reads j as not open, the teacher
      decides whether o must be moved clear before j is opened. The decision is computed at the first such
      step of the episode, from the state at that step, and kept for the rest of the episode. o is judged
      crowded when two tests both hold: (a) with j's joint carried to its drive target (LIBERO's open
      threshold carried 0.03 further toward opening), the plan box around the collision geoms of j's
      moving body lies within 0.03 m of o's plan box, reaches below o's top plus 0.15 m and above o's
      bottom; and (b) the first grasp tier, in the grasp planner's order, with a candidate passing the
      reach screen -- inverse kinematics converged at every probed pose (grasp, pre-grasp, approach, and
      the delivery point over r as it stands) and no pose with the arm inside a fixed body -- is absent or
      different once j's joint is written to LIBERO's open threshold carried 0.012 further toward opening
      and the state forwarded; the joint positions and velocities are written back and the state forwarded
      again, whatever the answer. For a crowded o, a spot is searched on 12 radii (0.08-0.30 m) by 32
      angles around o's plan centre: a footprint of o's plan half-extents plus 0.03 m, at least 0.08 m in
      plan from j's open footprint, on which all 25 rays of a 5 x 5 downward grid, cast from 0.15 m above
      o's bottom with o ignored, land within 5 mm of o's bottom height; each such spot is scored by the
      smaller of the inverse-kinematics joint margin and 8 times the smallest singular value, the worse of
      two tool poses at the present tool orientation 0.03 and 0.15 m above it (minus infinity if either
      does not converge), and the best is taken if it scores at least 0.2. With a spot, the step selected
      is relocate(o, spot) -- the place skill, into no container, taking o first when it is not held --
      until o is unheld at the spot, and then articulate(j, open), which, a skill newly selected, does not
      start while o, just released, is touched by the robot or has the tool point within the start gate's
      margin of its box: the hand retreats instead (DEF-skill-contract's start gate). Crowded with no
      spot, or not crowded, no relocation is selected and the step is articulate(j, open) with o where it
      rests. As the precondition of pick(o), articulate(j, open) is selected only while o is not held. Not
      claimed: that a crowded o could not be picked once j is open; that o is graspable at the spot once j
      is open, or that the spot or the path to it is screened with j open (the spot is screened with j as
      it stands, at two poses, which is not DEF-reachable-pose); that the pick and place after opening
      succeed; that this is DEF-skill-contract's clear_of(o, j) -- it is a stand-in narrower in three
      ways: an o outside the band of (a) is judged clear without a grasp screen, graspable is read as
      keeping the same first tier, and a crowded o with no spot does not stop j being opened, so clear_of
      is not enforced as a precondition in DEF-witness-or-refusal's sense; that any object other than the
      one the place puts into j is tested; that nothing overhangs the spot higher than 0.15 m above o's
      bottom, which the rays pass under; that the decision, kept for the episode, still holds after the
      scene changes; that the screen leaves every simulator data field as it found it (it restores joint
      positions and velocities and forwards).
    premises: [AXM-one-gripper, AXM-object-geometry-known, AXM-mujoco-forward-is-a-function-of-state, AXM-support-scannable, DEF-skill-contract, BRN-open-precondition-reads-the-running-drive]
    derivation_rule: >-
      The claim describes the decision rule; what is derived is why its parts are admissible and what its
      order guarantees. AXM-one-gripper: while o is held, j's joint cannot be driven, and the hand frees
      only by setting o down, so a relocation must end with o set down before j opens -- the rule selects
      articulate(j, open) only with o unheld, and after a relocation only with o at the spot.
      AXM-object-geometry-known puts the collision geometry of j's moving body and of o in the state,
      which the boxes of (a) and the grasp screen read. AXM-mujoco-forward-is-a-function-of-state licenses
      screening j at a configuration it has not reached by writing its joint, forwarding and reading, and
      makes the geometry after the write-back that of the restored configuration. AXM-support-scannable
      makes a grid of downward rays that all land at o's resting height the reading of a surface open from
      above at that height. BRN-open-precondition-reads-the-running-drive is the open test that triggers
      the decision. DEF-skill-contract names what the rule stands in for; the three ways it is narrower
      are stated in the claim, not derived. Declared 2026-09-26 in the theory cleanup: live code
      (SkillTeacher's relocate step, Clearing.crowds and Clearing.spot, Skills.clearing_spot) had only a
      staged statement, gapped on 2026-09-21 (TRL-1040) for citing none of the first four premises and for
      promising the pick after opening, which this one does not claim. Evidence: CTR-teacher-reliable,
      slice libero_goal task 3, the task the rule was built for. Restated 2026-09-27 after the cleanup's
      verification round: TRL-1396 (REFUTED: opening could start with the released o between the fingers)
      answered by stating the start gate the teacher applies to every newly selected skill; TRL-1397's
      gaps (the threshold's direction, overhangs above the rays, the kept decision) stated.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-trial-provenance
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      tools/skill_eval.py writes one trial for every episode its run declared -- one per task and episode
      index 0..episodes-1, whether the episode was attempted, refused, crashed, or never returned because
      its worker died -- and each trial's repro block carries: seed, the seed the worker's TaskEnv was
      constructed with (seed*100+task, or (seed*100+task)*1000+j for worker j under --split S > 1);
      env_episode, TaskEnv's episode counter after that episode's reset (under --interleave it counts the
      episodes the worker skipped, under --split only the worker's own), read from the environment for an
      episode that ran and computed from the job by the same count for one that was lost; episode, the
      episode's index among the task's declared episodes; init_index, the initial state the reset used
      (null for a lost episode); horizon; start, the five start-noise magnitudes every worker was given;
      refuse, whether refusal was enabled; robot and gripper when they are not the Panda and its gripper;
      task and task_suite; and teacher_revision, a digest of every .py file the tool reaches by imports
      from skill_eval, the skill teacher, TaskEnv and the episode log, computed once before any worker
      starts. skill_eval constructs every TaskEnv with Execution.anchor on and never changes it. For a
      teacher episode in TaskEnv, then, the seed, episode index and initial state of which
      BRN-reset-anchors-all-execution makes the trajectory a function are in the trial as the worker used
      them, beside the settings they do not fix: the start-noise magnitudes, the refusal mode, the arm,
      the gripper and the horizon. Not claimed: that an equal teacher_revision names an equal execution --
      the digest covers no file outside that .py closure (not the affordance table or other data files,
      the robot models, LIBERO, the installed packages, the BLAS kernel or the CPU); that trials differing
      in seed, start, refuse, robot or gripper are kept apart by the ledger, whose teacher contracts key
      on task_suite, task and teacher_revision; that --video, --video-px, --diagnostics or --cpus leave
      the trajectory unchanged, since none is recorded; the classes BRN-reset-anchors-all-execution places
      outside its claim; anything about trials written by other tools, or by skill_eval before this
      change, whose --split trials carry seed*100+task and no env_episode.
    premises: [AXM-reproducible-measurement, AXM-instruments-do-not-decide, BRN-reset-anchors-all-execution]
    derivation_rule: >-
      BRN-reset-anchors-all-execution makes a teacher episode's trajectory in TaskEnv a function of the
      seed, the episode index and the initial state, within exclusions the claim restates rather than
      inherits -- the omission on which the staged statement was refuted (TRL-0200). The record takes each
      of the three from the worker's own TaskEnv, not from the command line: recomputed from --seed and
      the task's episode index, the earlier record under --split had the wrong seed for every worker and
      the wrong index for every worker after the first, which counted its episodes from 1 (fixed in
      34d1df5). AXM-reproducible-measurement makes naming the seed a condition of a measurement being
      evidence; AXM-instruments-do-not-decide binds evidence to the run that produced it, which a revision
      digested before any worker starts does for the teacher's own .py code and for nothing outside it, as
      the claim says. Withdrawn from the staged statement: the execution digest over installed packages,
      arm model and LIBERO commit, the pooling guarantee, and every writer but skill_eval. Measured
      2026-09-26: libero_object 2, --split 2, seed 777, start-xy 0.05 -- 4 of 4 episodes re-run from their
      repro fields alone with the same steps, initial state and timeline. Evidence:
      CTR-teacher-deterministic. Restated 2026-09-27 after the cleanup's verification round: TRL-1376's
      gap (the anchor-on scope, unrecorded) stated; the episode index is BRN-reset-anchors-all-execution's
      counter after the reset, now stated there.
    sufficiency: {n_min: 3, min_consensus: 0.8}

