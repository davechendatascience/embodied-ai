      this branch is: at the grasp, squeeze; on the approach axis -- within a declared lateral funnel of
      it and no further back along it than the back-off distance plus a declared non-negative margin, so
      the pre-grasp is on it -- advance along it; otherwise up, over and down on to the pre-grasp -- rise
      to the crossing plane where the tool is below it and more than a declared distance off the pre-grasp
