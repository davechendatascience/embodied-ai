  - id: BRN-pick-turns-before-descending
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Terms are BRN-pick-descends-beside-overhang's. The pick's own law, as that branch states it, has a
      down phase: it comes straight down on to the pre-grasp -- or, for a grasp with a side point, on to
      the side point -- once the tool is within the funnel of it in plan, the tool frame turning toward
      R_g as it comes down; its slide, squeeze and advance are not the down phase. Now, at a step at which
      the law's command is its down phase, while the angle of the rotation from the tool frame to R_g
      exceeds a declared angle and the tool point is more than a declared band above that point's height,
      the command is instead the tool toward the point over that point at the tool point's present height,
      at frame R_g; otherwise the command is the law's. Claimed: (1) at every step at which the pick's
      command is the law's down phase, the tool frame is within the declared angle of R_g or the tool
      point is within the band above that point's height; (2) at a step at which it turns instead, the
      commanded translation has no vertical component; (3) at a step at which the tool frame is within the
      declared angle of R_g, the pick acts as it did without this rule; (4) at a step at which the law's
      command is its down phase, whether the pick turns or descends is a function of that step's state,
      R_g, the pre-grasp or side point, and declared constants. Not claimed: that the turn ends within any
      number of steps; that the hand clears the scene while it turns; that the declared angle is small
      enough for any scene; that the arm's configuration after the turn is the one the reach screen
      evaluated; anything of the slide.
    premises: [BRN-pick-descends-beside-overhang, AXM-mujoco-forward-is-a-function-of-state]
    derivation_rule: >-
