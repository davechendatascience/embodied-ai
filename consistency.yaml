      exactly those offered before. Claimed: no handle candidate is offered for an object whose category
      is not so declared, and every handle candidate's jaw axis is, among the considered axes of its
      geom, the one most nearly perpendicular to that geom's radial direction. Not claimed: that the
      handle tier yields a reachable grasp, that the grasp holds, or that the outlying geoms are the
      handle in every asset; behaviour when a geom's centre coincides with the object's origin in plan.
    premises: [AXM-category-affordances-declared, AXM-object-geometry-known, AXM-panda-gripper-geometry,
               AXM-parameters-derived]
    derivation_rule: >-
      AXM-category-affordances-declared is where held_by comes from and why only evidence-backed values
      gate anything; AXM-object-geometry-known supplies each geom's box and pose. The two claimed clauses
      read none of the tier's numbers: the gate reads only the table, the perpendicular rule only the
      considered axes and the radial direction. Which candidates the tier offers does depend on them,
      and under AXM-parameters-derived their provenance is: the maximum jaw opening (75 mm) and the grip
      margin (12 mm) were set by hand with the first skill teacher, below the Panda's 80 mm stroke and
      not traced to the model; the handle fraction (0.6), the spread factor (3) and the points along a
      spread axis (1/4, 1/2 and 3/4 of it) were set by hand for this tier. Measured against the fraction
      (geom centres from the object's origin in plan, libero_90 18 and libero_10 2): the frying pan's
      handle geoms lie at 112.7-192.6 mm of 192.6 (0.59-1.00), its dish's at most 97.1 (0.50); the moka
      pot's handle geoms at 41.6-75.5 mm of 75.5 (0.55-1.00), its body's at most 35.9 (0.48). 0.6 lies
      outside (0.50, 0.55], the interval that separates both, and leaves out the nearest handle geom of
      each. Measured with the tier: LIBERO's humans hold the frying pan by its handle in 100% of 152
      grasps (141-156 mm out, jaws 27-29 mm) and the moka pot by its handle (51-58 mm off its axis, jaws
      22-23 mm); libero_90 18, 21 and 41 (pan) 4/5/4 -> 20/20/20 of 20 and libero_10 2 (moka pot) 9 ->
      15 of 20. Choosing the thinnest axis instead sent the moka pot's jaw line through its body (105
      mm; task 2 0 of 20). evidence: CTR-teacher-reliable.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-carry-turns-object-to-fit
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      At every carry and lower step of a place skill, the skill reads the held object's own bounding
      box (in the object's frame, current pose) and the target region's box (the region site's current
      pose and size, or, for a region that is an object, that object's box). Its horizontal axes are the
      box axes whose vertical component is below a declared bound. If the region box does not have
      exactly two horizontal axes, or the object's box has none, the commanded tool orientation is the
      current one. Otherwise the skill computes the object's plan extents along the region's two
      horizontal axes; if they fit with no tolerance (each within the region's extent), the commanded
      orientation is the current one. If not, with theta a smallest turn about the vertical laying the
      object's longest horizontal axis (the first in box order among equals) along the region's longer
      horizontal axis (the first among equals), ties between turns of equal size broken toward the
      positive turn, the commanded orientation is the current one turned by theta if the object's extents
      so turned fit within the region's extent plus a declared tolerance, and the current one if not.
      Claimed: the skill never commands a turn about the vertical at a step at which the object's
      footprint, as computed, already fits the region with no tolerance, and every turn it commands is
      that tie-broken smallest aligning turn. Not claimed: that the object ends inside the region, that
      the turn is executed exactly, that it is collision-free, that the grasp screen checked the turned
      pose, or that the rule never alternates between turns at successive steps.
    premises: [AXM-object-geometry-known, AXM-libero-scores-final-state, AXM-grip-fixes-object-in-hand,
               DEF-skill-contract]
    derivation_rule: >-
      AXM-object-geometry-known gives the object's box; AXM-libero-scores-final-state, which has LIBERO
      evaluate In and On on region sites and support objects in the simulator state, gives the region's
      live pose and size; AXM-grip-fixes-object-in-hand makes the object turn with the tool. Measured:
      carried as grasped, libero_90's book (110 x 29 mm) came down across a caddy compartment 56 mm
      wide (124 long), caught its wall and was lost; LIBERO's humans end with the book along the
      compartment. With the turn, libero_90 73 0 -> 9, 78 0 -> 4, 81 0 -> 8 of 20 (runs/skill_l90_v3).
      Restated from a version that left the object unturned when it fitted within the tolerance:
      libero_90 77's book came down turned 15 deg, 56.5 mm across a 55.5 mm compartment -- inside the
      5 mm tolerance -- and its corner landed on the wall (TST-teacher-settled RUN-0247, 77 settled 1 of
      20). With this rule and BRN-drop-point-footprint-as-carried, libero_90 73 8 -> 19, 78 2 -> 18 of 20
      (runs/skill_l90_v6 against v4), the 30 benchmark tasks unchanged episode for episode in success,
      and libero_10 2 one episode lost (19 of seed 55502). A first version read the region's axes 0
      and 1 as horizontal; the caddy's regions have their local y vertical, and nothing turned.
      evidence: CTR-teacher-reliable, CTR-teacher-settled.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-drop-point-footprint-as-carried
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The drop point of a place (the origin position it carries the object to, chosen once per episode, from
      the object's pose at that step) is the earlier search's: candidate origins on a grid about the
      region's centre, nearest first, the object's footprint centred on its origin as it lies, open from
      above at its centre and at its boundary widened by a declared margin -- open meaning that no
      vertical downward ray from a declared height above the region's top meets anything (the object and
      the robot aside) higher than a declared clearance above that top. It is replaced only when all of
      these hold: the region is level (one of its box axes vertical); the carry will turn the object
      (BRN-carry-turns-object-to-fit) or its box centre lies further than the fit tolerance from its
      origin in plan; and the earlier search found no point, or the object's footprint at the earlier
      point as it will be carried -- turned, centred on its box, sampled at its centre and its boundary
      -- is not open from above. Then candidates are searched with that carried footprint, sampled at
      its centre, its boundary and its margin-widened boundary: origins about the region's centre, then
      origins that put the footprint's centre about the region's centre; with the margin, then without;
      the nearest to the centre that passes is taken, and if none passes, the earlier search's result
      stands. "The carry will turn the object" is the turn BRN-carry-turns-object-to-fit's rule gives for the
      object's pose at the step the point is chosen; the carry's own turn is computed from the in-hand
      pose and is not claimed to equal it (a grasp can pitch a book so that it fits unturned). Claimed:
      the drop point differs from the earlier search's only under the conditions above, read when it is
      chosen;
      and a point the carried search returns passed its test at every sampled point of the carried
      footprint. Not claimed: that the carry turns the object as predicted; that an obstacle between
      sampled points is seen; that the object fits the
      region; that the carry reaches the drop point in the turned orientation; the provenance of the
      margin, the clearance, the fit tolerance and the grid.
    premises: [AXM-object-geometry-known, AXM-support-scannable, AXM-libero-scores-final-state,
               AXM-grip-fixes-object-in-hand, BRN-carry-turns-object-to-fit]
    derivation_rule: >-
      AXM-object-geometry-known gives the object's box and its offset from the origin; AXM-grip-fixes-
      object-in-hand makes the footprint at the drop the grasped one turned by the carry's turn;
      AXM-support-scannable makes open-from-above a ray test; LIBERO scores the origin
      (AXM-libero-scores-final-state), hence origins about the centre first. Measured: a book's box
      centre is 12 mm from its origin; centred on the origin in libero_90 77's compartment (124 mm, the
      book 110), its end hung 5-7 mm over the wall, between the earlier search's centre and margin
      samples. The carried search everywhere cost success: over libero_10 3's drawer the earlier point
      stood 22 mm clear of the cabinet's face and the carried search's centre did not (10 -> 4 of 10),
      and over the tilted wine rack the earlier search found nothing and used the centre, the bottle's
      cradle, where the carried one found a spot 33 mm off it (libero_goal 9 and libero_90 27, 50 -> 0
      and 20 -> 0); hence the conditions. With them (runs/skill_v24, runs/skill_l10_v10,
      runs/skill_l90_v6 against v22, l10_v8, l90_v4): the 30 benchmark tasks and libero_10's drawer
      unchanged in success, libero_90 1505 -> 1537 of 1800 (books 73 +11, 78 +16, 80 +4, 75 +2; 81
      and 83 +8 -9). evidence: CTR-teacher-reliable, CTR-teacher-settled.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-place-onto-physical-support
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The place skill's lower phase ends, and the release is commanded, when the held object's origin
      is within the lower phase's tolerance of the region-derived target height (the height every other
      use reads: the carry height, the grasp screen, the delivered test); or, for an object that the
      affordance table does not declare held by its handle, that is carried level (its box's lowest
      corner within the lower phase's tolerance of the centre of its box face nearest to facing down)
      and that touches something besides the fingers -- each read at that step -- when its origin is no
      higher than that tolerance above the height at which that bottom-face centre lies a declared place
      clearance above the first collision surface met by a vertical downward ray through the centre's
      plan position at the drop point,
      cast from above the region's top by the object's height, the object's own body and the robot
      excluded (where the ray meets nothing, the region-derived height); "held by its handle" is the
      affordance table's held_by: handle with evidence measured or declared. Claimed: for such an object
      resting with its bottom face's centre at the point where that ray meets the surface, where that surface stands above the region-derived height,
      the lower phase's exit is reachable, so it is not pressed against it to the horizon; the release is never
      commanded on the second ground while the object touches only the fingers; and for an object held
      by its handle, or tilted at that step, the lower phase ends exactly as before. Not claimed: that
      the surface under the bottom-face centre is where the object first touches or rests (a book across
      two compartment walls rests on the walls while the ray meets the floor between them, and is pressed
      on: BRN-scan-then-place's resting test is the general case); that the object stays
      upright or inside the region after the release; the provenance of the clearance and the tolerance.
    premises: [AXM-object-geometry-known, AXM-support-scannable, AXM-libero-scores-final-state, DEF-holding,
               AXM-category-affordances-declared]
    derivation_rule: >-
      LIBERO's region boxes are sites, not surfaces (AXM-libero-scores-final-state reads them as sites):
      the basket's contain region reaches 3 mm below the table while its floor stands 16 mm above it,
      and libero_90 69's plate-left region lies 20 mm below the table top. The region-derived target was
      5-7 mm below where the object can go, the lower phase ends within 4 mm of its target, and once
      LIBERO's first success no longer ended the episode the teacher pressed the object into the floor
      with the jaws shut to the horizon (TST-teacher-settled RUN-0247: libero_object 2 0 and 4 3 of 20
      settled with 20 of 20 success; libero_90 69 and 70 0 of 20, 48 13 of 20). With the second ground,
      10 of 10 settled on each. Read everywhere, the raised height moved the grasp screen and the carry
      height and cost libero_10 3's drawer (10 -> 4 of 10); read only to end the lower phase it does not.
      The moka pot hangs 21 deg from its handle and is righted by being pressed on to the burner, which
      stands 23 mm above its region; stopped at the burner it went 14 -> 6, then 8 when the stop also
      required contact, of 20; excluded as handle-held (AXM-category-affordances-declared), 14 of 20, the
      same episodes as without the rule. evidence: CTR-teacher-settled, CTR-teacher-reliable.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-supports-moved-first
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The planner orders a task's In and On goals among themselves, one at a time: from the goals not
      yet ordered, it takes the first in the bddl's order whose target, as the bddl names it, is not the
      object of another not-yet-ordered In or On goal; if every remaining goal has such a target (a
      cycle), it takes the first remaining in the bddl's order. Each In or On goal becomes a pick of its
      object followed by a place (or a push), in that order. Claimed: when the relation 'the object of
      goal A is the target, as named, of goal B' has no cycle, no place step of an In or On goal sets its
      object on or in an object that the pick of a later In or On goal grasps. Not claimed: anything
      about other plan steps (opens, closes, switches, parks, or moves made to meet a precondition),
      including where they fall relative to these and whether they carry objects along; targets named
      as a region that an object owns, which are not identified with that object; that the plan
      succeeds; or which order results when there is a cycle.
    premises: [AXM-bddl-states-goals-not-methods, AXM-one-gripper, DEF-skill-contract]
    derivation_rule: >-
      The bddl states the goals and not their order (AXM-bddl-states-goals-not-methods), and with one
      gripper an object must be free to be grasped (AXM-one-gripper). Taking at each step a goal whose
      target no remaining goal moves places every support before what is set on it. Measured: libero_90
      63 and 64 (On(b1, b2) and In(b2, tray)): stacked first, the lower bowl's rim was covered when it
      had to go into the tray and no grasp of it closed (0 of 20 each); support first, 20 of 20 each
      (runs/skill_l90_v4), with every episode of the 30 benchmark tasks and libero_10 unchanged. A first
      statement ('a later step is to move') was refuted: a later Close can carry an object along, which
      this ordering does not govern. evidence: CTR-teacher-reliable.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-place-done-when-released
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      At every control step the planner re-evaluates, from that step's state and without latching,
      whether each place step is done and whether its object is delivered. A place step is done only
      when LIBERO's predicate for its goal holds and its object is not held (DEF-holding). Its object is
      delivered at a step only when it is not held and its origin is within a declared plan distance of
      the drop point and within declared heights below and above the target height (the origin height
      the place skill lowers the object to); the release the place skill commands on the ground that the
      object is delivered uses the same step's state. The planner selects, at every control step, the
      first plan step in order that is not done, where the pick before a place step is also skipped when
      that place step's object is delivered. So a place step whose object is delivered but whose goal
      does not hold is not passed over for a later step, and at a step where it is selected the place
      skill, finding its object delivered, commands the jaws open and a retreat rather than taking the
      object back; and a later plan step is selected only when every earlier place step is done, which
      requires its object not held. Claimed,
      for plans in which no later step grasps an object that an earlier place step delivered: no control
      step selects a later plan step while an earlier place step's object is held with its goal
      satisfied; and no control step commands a release on the ground that the object is delivered while
      its origin is more than the declared height above its target height. Not claimed: that LIBERO's predicate still
      holds after the release; that holding is judged without error; anything of plans that re-pick a
      delivered object; releases commanded on other grounds; that a delivered object stays delivered; or
      DEF-skill-contract's start gate: selection does not wait for a released object to be clear of the
      fingers and of the robot, so the next skill can start mid-release (a known gap, not implemented).
    premises: [AXM-libero-scores-final-state, DEF-holding, DEF-skill-contract]
    derivation_rule: >-
      AXM-libero-scores-final-state makes a predicate that holds while the object is still in the jaws
      no achievement: what counts is the state left behind. Measured failures of the looser rules: LIBERO's
      In held for a soup can still in the jaws over libero_10's basket, the next pick lifted it back out,
      and the teacher lowered and lifted it for 700 steps (tasks 0 and 7, 0 of 100; 100 of 100 with the
      rule); with no upper bound on 'delivered', a bowl 8 cm over libero_10 3's drawer counted as
      delivered on a holding flicker and was let go there. Earlier statements were doubted for not
      saying that one step's state serves both the check and the release, for leaving 'done' unlatched
      implicitly, for not stating the selection rule, and for skipping the pick only when its place
      step is done (it is also skipped when the object is delivered), and a statement whose selection
      rule moved past a delivered place step, which the planner does not do: the place step stays
      selected and its skill lets go. evidence: CTR-teacher-reliable.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-regression-planner
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A skill teacher designed to act by regression over declared contracts, re-run every control
      step: pick(o) {hand empty, graspable(o)} -> held(o); place(o, R) {held(o), admits(R, o)} ->
      In/On(o, R); drive(j, mode) {hand empty, accessible(j), and when opening, clear_of(o, j) for every
      object o the goal still has to grasp} -> the joint's predicate; park(o) {held(o)} -> hand empty,
      o resting on a free spot where clear_of(o, j) holds for every container j the goal still has to
      open. clear_of(o, j) is achieved by pick(o) then park(o), each re-derived from the state at every
      step: whichever of drive's preconditions the regression meets first, the park it reaches puts o
      where clear_of holds, so no separate move-clear skill is needed and none is declared. When no free
      spot where those clear_of hold is found, park refuses, naming 'a free spot for o'. The goals and
      the affordance table supply the parameters, and the predicates read the state and the
      configurations the plan will reach, as LMA-geometry-answers-predicates says. The skill set is
      closed at those four. Not built: the teacher that runs walks a fixed skill sequence per goal with
      one special case that moves an object clear before opening, and no measurement here is of this
      design. When
      the regression reaches a predicate that no declared skill's effect entails, it refuses, naming
      that predicate, and runs no other skill in its place; the refusal is recorded beside the scorer's
      verdict. In the current scope this happens for admits(R, o), which drive's effect -- the joint's
      predicate -- does not entail; for accessible(j), which no declared effect entails; and for
      graspable(o) wherever LMA-geometry-answers-predicates gives it no achiever -- regrasping and
      reorienting are not covered; and for a free spot for o where park finds none. Not claimed: that the regression terminates, or selects uniquely, for
      this table; or what the teacher does when the regression is circular at a state. Scope: the
      predicates libero_object, spatial and goal and libero_10's put-in-drawer-and-close need; not yet
      covered: pushing or sliding without a grasp, two objects into one region, enclosed regions, access
      occlusion, reorienting or regrasping an object.
    premises: [LMA-regression-selects-an-applicable-skill, LMA-geometry-answers-predicates,
               DEF-skill-contract, DEF-refusal-is-an-outcome, AXM-bddl-states-goals-not-methods,
               AXM-libero-scores-final-state, AXM-instruments-do-not-decide]
    derivation_rule: >-
      A verifier refuted the previous table: move-clear(o, j) was pick then a park where clear_of held,
      but after its pick the regression met drive's 'hand empty' first and reached the plain park,
      whose spot nothing tied to clear_of, so the object could go back where it was and pick and park
      repeat. Giving every park the clear_of constraint makes the phase the regression happens to reach
      the right one, and leaves move-clear nothing to add. DEF-skill-contract's gate, restated to range
      over what was released and not grasped since, lets place(o) start after o was parked and picked
      again. DEF-skill-contract gives the table, and restated it replaces uncrowded with clear_of. That removes
      the circularity an older table had: moving a crowded object clear began by picking it, and pick
      required uncrowded -- the very predicate the move existed to achieve -- so it always ended at the
      lemma's third outcome. clear_of(o, j) is now a precondition of opening j rather than of picking o,
      and achieving it begins with pick(o), which needs only graspable(o); that holds while j is still
      closed, so achieving clear_of no longer requires itself.
      LMA-geometry-answers-predicates is cited again for how the geometric predicates are read and which
      achievers they have. LMA-regression-selects-an-applicable- skill gives the procedure and its three
      outcomes -- a skill that can run, a predicate no declared skill achieves, or a regression circular
      at this state -- and the refusal is the second of them. The lemma bounds the descent by not
      revisiting a predicate rather than by an acyclic achiever relation, but it is DOUBTED on how it
      binds an achiever's free arguments, so the branch claims neither termination nor unique selection,
      nor what happens at the third outcome, which is none of the refusals DEF-refusal-is-an-outcome
      names. park's spot is bound by the clear_of predicates the goal still needs of o -- each names o and
      its container -- which is one of the bindings that lemma asks for. AXM-bddl-states-goals-not-methods fixes the
      goal language. LMA-hand-is-a-precondition and LMA-protected-progress are refuted and are not
      cited: the branch does not claim that the hand regresses safely to parking or that the executor
      never alternates, and those belong to the lemmas' repair. AXM-libero-scores-final-state and
      AXM-instruments-do-not-decide are cited because DEF-refusal-is-an-outcome is a stipulation about
      bookkeeping and says a branch relying on it cites them itself. evidence: none -- not implemented;
      CTR-teacher-reliable and CTR-teacher-attempts measure the sequence-walking teacher that runs.
    sufficiency: {n_min: 3, min_consensus: 0.8}

policies:
  - id: POL-teacher-design-consistent
    criteria:
      - {target: BRN-carry-reachable-along-carry, require: proven}
      - {target: BRN-handle-grasp-reachable-along-drive, require: proven}
      - {target: BRN-handle-holding-by-aperture, require: proven}
      - {target: BRN-reliability-evidence-valid, require: proven}
      - {target: BRN-drive-tracks-the-handle, require: proven}
      - {target: BRN-leave-handle-along-approach, require: proven}

  - id: POL-planning-data-driven
    criteria:
      - {target: BRN-regression-planner, require: proven}

  - id: POL-teacher-motion-sound
    criteria:
      - {target: BRN-scan-then-place, require: proven}
      - {target: BRN-pinch-for-the-whole-place, require: proven}
      - {target: BRN-execution-bounds-acceleration, require: proven}
