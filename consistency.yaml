      target no remaining goal moves places every support before what is set on it. Measured: libero_90
      63 and 64 (On(b1, b2) and In(b2, tray)): stacked first, the lower bowl's rim was covered when it
      had to go into the tray and no grasp of it closed (0 of 20 each); support first, 20 of 20 each
