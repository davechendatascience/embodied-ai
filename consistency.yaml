    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-pick-descends-beside-overhang
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Vertical is the world's z axis and 'in plan' the projection onto the horizontal plane; the tool's
      pose, the arm's joint positions and the scene's collision geometry are read from each step's state
      (AXM-mujoco-forward-is-a-function-of-state), the arm's joint ranges being constants of its model. A
      pick has, at each step, its object, its grasp -- the tool frame R_g and grasp point -- its pre-grasp
      point (the grasp point backed off by a declared distance along the approach, R_g's third axis), its
      crossing plane's height (at least the pre-grasp's), and the jaws' opening; the pick's own law up to
      this branch is: at the grasp, squeeze; on the approach axis -- within a declared lateral funnel of
      it and no further back along it than the back-off distance plus a declared non-negative margin, so
      the pre-grasp is on it -- advance along it; otherwise up, over and down on to the pre-grasp -- rise
      to the crossing plane where the tool is below it and more than a declared distance off the pre-grasp
      in plan, cross it at the plane turning toward R_g, and come straight down once within the funnel in
      plan. A tool pose is clear when a declared deterministic inverse-kinematics solver, started from the
      arm's joints as read at the step, converges to it, and the arm, put at that solution in the
      simulator with the jaws at the opening, touches nothing but the picked object; each such screen
      writes the arm's joints and the jaws, runs the forward computation, reads the contacts and restores
      everything it wrote -- the arm's joints, the jaws, their velocities and the derived fields -- before
      anything else reads the simulator; the solver's result depends only on its start joints, its target
      pose and the joint ranges, with no memory across calls (AXM-mujoco-forward-is-a-function-of-state).
      The column of a point is the tool poses at frame R_g at that point raised by 0, 1, 2, ... times a
      declared step, up to the crossing plane's height above the pre-grasp. The side point of a grasp --
      of the pick's object, R_g, pre-grasp point, crossing plane's height and jaws' opening -- is computed
      once per episode for each such tuple, at the first step the pick asks for it, from at most one plus
      the number of directions times the number of distances columns and their slide points: none when
      every pose of the pre-grasp's column is clear; otherwise the first point, at the pre-grasp's height
      and at a distance from it in plan of a declared step times 1, 2, ... up to a declared maximum,
      nearest first, and among each distance in a declared number of directions evenly spaced from the
      world's x axis counter-clockwise, whose column is clear and whose points a quarter, a half and three
      quarters of the way back to the pre-grasp, at frame R_g, are clear; none if no such point exists.
      When a pick's grasp has a side point, the squeeze and the advance still come first, and at a step
      where neither applies the command is: on the slide -- within the funnel in plan of the segment from
      the pre-grasp to the side point, and within a declared band of the pre-grasp's height -- the tool
      toward the pre-grasp at frame R_g; otherwise the pick's own up, over and down on to the side point
      in place of the pre-grasp. Claimed: (1) a pick whose grasp has no side point acts as it did without
      this rule; (2) at every step at which the pick's grasp has a side point, the tool is on the slide,
      not at the grasp and not on the approach axis, the commanded translation points from the tool toward
      the pre-grasp; (3) the side point, where it exists, has a column (up to the crossing plane's height
      it was computed for) and three slide points that were each clear at the step it was computed; (4)
      whether a grasp has a side point, and which, is a function of the state at the step it is computed,
      the picked object, the grasp, the crossing plane's height, the jaws' opening, the arm's joint ranges
      and declared constants. Not claimed: that anything between the sampled poses is clear; that inverse
      kinematics from the present joints is the configuration the servo reaches; that the pre-grasp
      itself, the approach or the grasp are clear; that the scene at the step the side point is computed
      is the scene when the hand gets there.
    premises: [DEF-skill-contract, AXM-object-geometry-known, AXM-mujoco-forward-is-a-function-of-state]
    derivation_rule: >-
      Mirror of BRN-lift-leaves-overhang for the way down. libero_90 5 (put the pudding in the open top
      drawer and close it) failed 39 of 50 in the teacher-alone sweep v26, 24 of them stalled in the
      pick's descent with the hand on the open drawer's handle: the pudding (80 x 46 x 28 mm) fits the
      jaws only across its 46 mm, the hand is 21 cm wide along the jaws, and its edge came down on the
      handle 9 cm off the pudding's centre, 17 cm up. Every grasp candidate's column collided at the grasp
      screen. LIBERO's humans grasp it the same way and brush the handle (10 of 10 demonstrations touch
      it). Coming down beside the handle and sliding in under it at the pre-grasp's height leaves the
      handle untouched. Built, with the drawer's open precondition read as the declared contract has it
      (away from the handle, admits(R, o) alone: held also to LIBERO's threshold, the hand reaching the
      pudding eased the drawer 2 cm shut, 1 mm past the threshold, and the plan turned to reopening it
      mid-pick every time): the teacher alone, inits 0-9, libero_90 5 9 of 10 (v26: 1); the other drawer
      tasks 2, 8, 23, 24 10, 3, 3, 7 of 10 as in v26, 32 2 (v26: 3; its tall ketchup cycles between
      release and re-pick in the drawer either way); libero_10 3 18 of 20 as in v26. The 9 of 10 is of the
      two changes together: without the precondition the pick never finishes (the plan turns to the drawer
      mid-pick), so the side column is not measured alone. Restated four times per the verifier: the
      screens' restore stated, claim (2) of direction only, the object, the solver and the approach axis
      named as inputs, the grasp's identity and the number of screens bounded; the screens restore the
      jaws too, and the side point is keyed by the crossing plane's height and the jaws' opening as well;
      the pre-grasp lies on the approach axis and the squeeze and advance come first, and claim (2)
      excludes the squeeze's region as well. Supersedes the staged BRN-dogleg-approach-under-overhang
      (withdrawn; never built).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-share-a-surface-side-by-side
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      When a task's plan sets two or more distinct objects on one region by place_on and places none into
      it by place_in, the drop point in plan of each such object is chosen, once per episode at the first
      step it is asked for, as follows, in place of BRN-drop-point-footprint-as-carried's search. Each
      object's footprint is its box as it lies at that step, turned about the vertical as
      BRN-carry-turns-object-to-fit's rule would turn it for the region, and centred on its origin; its
      width along a horizontal axis is twice the sum of its box's half-extents projected on that axis. The
      rule applies only to a region with exactly two box axes within a declared angle of horizontal; of
      those, the one along which the objects' widths sum to less is taken (ties to the first), projected
      onto the horizontal plane, normalised, and signed so that its component along the region centre's
      position from the robot's base (the frame's origin) is non-negative -- where that component is zero,
      as the region's box axis points. The footprints are laid out along it in the plan's order, from its
      far end, each a declared non-negative gap from the next, the row centred on the region's centre;
      each object's drop point is the region's centre moved along the axis by its footprint centre's
      offset in the row, unless the magnitude of that offset, or of the offset of an object before it in
      the row, exceeds the region's half-extent along that axis, in which case that object's drop point is
      the search's. Claimed: (1) a region set on by one object, or into which the plan places any object,
      keeps the search's drop points; (2) in the row laid out at any one step, the offset the rule gives
      an object has magnitude within the region's half-extent along the axis, and an earlier object's
      offset is greater, along the axis as signed, than a later one's; (3) whether the rule applies, and
      each drop point it gives, are functions of the plan, the region's box, the robot base's position,
      and the objects' boxes and poses at the step each is chosen; a drop point that falls back to the
      search is the search's, a function of what it reads. Not claimed: that the footprints as the objects
      are carried or come to rest are those computed; that neighbours do not touch when the widths
      computed at different steps differ; that the objects rest where they are dropped; that the region's
      other axis leaves room.
    premises: [BRN-drop-point-footprint-as-carried, BRN-carry-turns-object-to-fit, AXM-object-geometry-known]
    derivation_rule: >-
      libero_10 8 (put both moka pots on the stove) failed 50 of 50 in the teacher-alone sweeps v26 and
      v29: the stove's cook region is 15 cm square, a pot's footprint 8 x 15 cm, and the drop point
      search, run for the second pot while the first sat at the centre, found no open point and returned
      the centre; the second pot came down on the first and knocked it off the stove. LIBERO's humans set
      the two pots side by side along the pots' narrow axis, the first on the far side, 9-12 cm apart (12
      of 12 demonstrations: first at +2 to +6 cm, second at -2 to -7 cm from the centre). With the rule
      (and BRN-place-onto-physical-support's release of a handle-held object at rest, without which the
      first pot is never let go), the teacher alone, inits 0-9: libero_10 8 8 of 10. Set on surfaces only:
      applied also to libero_10 0's basket (place_in), its soup, sent to the far side, came down on the
      basket's rim (9 of 10 where dropped together had 10); a container's walls settle two objects dropped
      at one point side by side, a surface does not. Restated once per the verifier: offsets by magnitude,
      the gap non-negative, the axis's sign and its tie defined, the rule's inputs complete;
      BRN-drop-point-footprint-as-carried excepts the drop points this rule gives.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-place-steep-laid-entry
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Terms are BRN-place-enters-roofed-target-level's. At a step at which the place decides a roofed
      target's entry, it evaluates the directions in that branch's order and stops at the first whose
      corridor holds the object -- the direction that branch then takes -- or after the last; a direction
      u is an entry of that branch's list of directions -- a region axis and a sign -- and u's level frame
      at a step is u's entry frame for a laid object as that branch defines it (pitched by at most its lay
      pitch). A declared inverse-kinematics solver's result is a function of its start joints, its target
      pose and the arm's joint ranges alone; the scene's body tree and each body's joint types are
      constants of its model. A set of tool poses is fixed-blocked at a step when, for some pose of it,
      the solver, started from the arm's joints as read at that step, does not converge to it, or the arm
      put at the solution in the simulator, with the jaws at their present opening, has a contact at
      negative distance between a robot geom and a geom of a body that is not the robot's, has no free
      joint of its own, and is neither the placed object nor a body whose parent is it; each such screen
      writes the arm's joints and the jaws, runs the forward computation, reads the contacts and restores
      everything it wrote before anything else reads the simulator
      (AXM-mujoco-forward-is-a-function-of-state). The steep drop point for u at a step is the point in
      plan whose offset from the region's centre along u equals the region's box half-extent along the
      region axis u was built from less a declared depth, and whose component across u is the drop
      point's. For each pitch of a declared list, each pitch below a quarter turn, the steep frame at that
      pitch is built as that branch builds a pitch's frame. For a frame F and a point D in plan at which
      the object, carried at F, has a rest height, F's poses at D are the tool at F placed so that the
      object, carried at F, has its origin at E -- computed as that branch computes it, from D and F --
      and at D at that rest height. The steep decision for a placed object, region and direction u is made
      once per episode, at the first step at which the place evaluates u with the object laid and u has a
      level frame at which the object has a rest height at the drop point: when the level frame's poses at
      the drop point are fixed-blocked, it is the first pitch of the list, in order, at which the object
      carried at the steep frame has a rest height at the steep drop point and the steep frame's poses
      there are not fixed-blocked; otherwise, or where no pitch qualifies, it is level. At that step and
      each later step of the episode at which u is evaluated with the object laid and u has a level frame,
      where the decision is a pitch, u's entry frame is instead the steep frame at that pitch if the
      object carried at it has a rest height at the steep drop point, and u has no entry frame at that
      step if not; no roof fit is required of a steep frame; the steep drop point replaces the drop point
      for u wherever that branch reads it (the corridor, E, the four cases and the recorded release
      point), and the swept height band's top is the lower of the object's top and the roof. When the
      place commands the release with a steep frame taken, the withdrawal it records -- here a push in,
      toward the region -- is, in place of that branch's, the direction -u and the tool point moved along
      -u by the amount by which the tool point's plan offset from the region's centre along u exceeds the
      region box's extent along u (the sum of its half-extents times the magnitudes of its axes'
      components along u) plus a declared margin, or by zero where it does not; the retreat reads it as
      that branch states. Claimed: (1) at every step at which the object is held and is not laid, or is
      laid and no evaluated direction has a recorded pitch decision, whether the target is roofed, whether
      the object is laid, the direction and entry frame taken, the case and the command are as
      BRN-place-enters-roofed-target-level states; (2) where a steep frame is taken at a step, the level
      frame's poses at the drop point were fixed-blocked, and the decision's steep poses were not, at the
      step the decision was made, each as computed at that step; (3) the steep drop point's plan offset
      from the region's centre along u is that half-extent less the depth, and its component across u is
      the drop point's; (4) the steep decision is a function of the state at the step it is made, the
      placed object, the region's box, the drop point and the carry height at that step, the arm's joint
      ranges and declared constants; and at each step, which frame each evaluated direction has is a
      function of the recorded decisions and of that step's state, placed object, region's box, drop point
      and carry height, the joint ranges and declared constants; (5) the recorded steep withdrawal point's
      plan offset from the region's centre along u is the smaller of the tool point's at the release and
      the box's extent along u plus the margin; (6) where a steep frame is taken,
      BRN-place-enters-roofed-target-level's claims (1) and (4) hold with the steep drop point in place of
      the drop point, and its claim (2) with the recorded decisions among its arguments; its claims (3)
      and (5) are not claimed there -- the drop point in plan the place's lower and release read is the
      steep drop point, whose component across u is the place's own (claim (3)). Not claimed: that the
      object carried at a steep frame fits under the roof, or passes under it untouched; that the sweep
      checks anything where the band from the object's bottom plus the clearance to the roof is empty;
      that the steep drop point lies inside the region's face where the region axis u was built from is
      not horizontal; that the part of the object outside the face stays clear of anything; that the servo
      reaches a screened configuration, that anything between the screened poses is clear, or that poses
      screened at the decision step stay clear at later steps; that a level frame's poses touching only
      loose bodies are safe (they keep the level frame); that the object rests level or stays in the
      region after release.
    premises: [BRN-place-enters-roofed-target-level, AXM-mujoco-forward-is-a-function-of-state, AXM-object-geometry-known]
    derivation_rule: >-
      BRN-place-enters-roofed-target-level disclaims that the hand or arm clears the table: libero_90 89
      (the book under the shelf's bottom layer, a 71 mm opening between the table and the middle board)
      failed 50 of 50 in v33, the level laid entry lowering at E with the hand's jaws vertical, its
      collision mesh reaching 10.4 cm along them, into the table, and the wrist on to the standing middle
      book: screened, both level poses of the shelf's open side put the hand into the table (inits 0 and
      1; the other sides' did not converge). LIBERO's humans enter it steeply: over 20 demonstrations the
      approach pitched 23 to 37 deg down (median 32), the book's origin -- at its leading edge -- 0.8 to
      4.5 cm past the face, and every demonstration ending, at the first success, with the book still
      held. With the steep entry (pitches 0.45, 0.55, 0.65, 0.75 rad, depth 5 cm, margin 2 cm), inits 0-9:
      libero_90 89 10 of 10 (v33 0); 88 10 and 86 9 of 10, identical per episode to v33 (their level poses
      touch only loose bodies or nothing). A screen on any contact instead of fixed bodies moved 88 to the
      steep entry and broke it (10 -> 0). TST-teacher-settled (seed 557, 10 episodes): 89 success_final 10
      of 10, released, at rest and finished 10 of 10, and 'tipped' 10 of 10 by 13.6 deg -- the book lies
      flat, 90 deg from standing, while the reference's largest final tilt, 76.4 deg, is of the humans'
      book still held mid-insertion; 88 settled 10 of 10. The withdrawals measured: drawn out along u,
      lost 10 of 10 (the released book dragged back past the face); back along the approach, lost 10 of
      10; pushed in the whole entry distance (the level entry's rule for a laid object), the hand went
      under the board and stayed there, unfinished 10 of 10; pushed in until the tool point is 2 cm
      outside the face, kept 10 of 10. Restated per the verifier: the screens are made once, as one
      decision per placed object, region and direction recorded at a step the statement defines, and every
      claim about them is about that step; the level frame, the solver, penetration and the order of
      evaluation are defined; that branch's claims the steep frame changes are named. Restated per the
      verifier: the parent's claim (5) is among those a steep frame changes; claim (1) is of steps at
      which no evaluated direction has a steep frame; the body tree and joint types the screen reads are
      model constants; the empty band and a tilted region axis are disclaimed. Restated per the verifier:
      claim (1) is of steps at which no evaluated direction has a recorded pitch decision; the parent's
      claims (3) and (5) are not claimed where a steep frame is taken; 'no free joint' is the body's own.
      Restated per the verifier: claim (1) is of steps at which the object is held, and names what it
      covers; directions are entries of the parent's list; the steep pitches are below a quarter turn; the
      screen's blocking bodies exclude the robot's.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-leave-a-roof-level-first
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Vertical is the world's z axis and 'in plan' the projection onto the horizontal plane; the tool's
      pose and the scene's geometry are read from each step's state (AXM-grip-fixes-object-in-hand,
      AXM-mujoco-forward-is-a-function-of-state), and which geoms are the robot's and which collide are
      constants of the model. The articulate skill's approach leg -- the way each of its modes that uses
      one (the hinged door's swing, the hook, the front hook and the press) reaches the point its mode
      starts from, with the crossing plane the mode declares -- is, up to this branch: done when the tool
      is within a declared funnel of that point in plan, or below the plane less a declared band and
      within a declared distance of it in plan, the mode's own command then following; otherwise, below
      the plane less the band, straight up to the plane; otherwise over, at the plane, toward the point. A
      colliding geom of the scene other than the robot's lies over the hand at a point in plan when some
      part of its box lies within a declared radius of that point in plan and its bottom is more than a
      declared height above the tool point. With this branch, at every step at which an approach leg is
      computed with the tool below the crossing plane less the band and some colliding geom lies over the
      hand at the tool point, the leg's command is instead the tool, its rotation goal its present one,
      toward the first point at the tool point's height -- among those at distances of a declared step
      times 1, 2, ... up to a declared maximum from the tool point in plan, nearest first, and at each
      distance in a declared number of directions evenly spaced counter-clockwise from the world's x axis
      -- over which no colliding geom lies over the hand and to which a disc of the radius, swept level in
      plan from the tool point, meets no colliding geom over the height band from a declared distance
      below the tool point to a declared distance above it, other than the robot's and those of bodies
      with a colliding geom that already meets the disc at the tool point in that band; the jaws are
      commanded as the mode commands them. Where no such point exists, the leg is as before. Claimed: (1)
      at every step at which this rule gives the command, the commanded target is at the tool point's
      height; (2) whether this rule gives the command at a step, and its target, are functions of that
      step's tool pose and scene geometry, the leg's crossing plane and start point, and declared
      constants; (3) at steps at which the tool is not below the plane less the band, nothing lies over
      the hand at the tool point, or no point qualifies, the leg acts as before; (4) the target, where one
      is taken, had no colliding geom over the hand at it, and the level sweep to it met no colliding geom
      in the band other than those excepted, as read at that step. Not claimed: that the sweep between its
      samples, or the geoms it excepts, leave the hand's way clear; that the tool tracks the level
      command; that the mode's own command after the leg is clear; that the target stays uncovered as the
      scene moves; anything of skills other than the articulate skill.
    premises: [AXM-object-geometry-known, AXM-grip-fixes-object-in-hand, AXM-mujoco-forward-is-a-function-of-state]
    derivation_rule: >-
      libero_90 23 (close the bottom drawer, then open the top one) failed 37 of 50 in v35: the press that
      closed the bottom drawer left the tool 3.4 cm up, under the top drawer's bar (its bottom 17 cm up, 9
      mm away in plan) and within the column-leave distance of the hook point, so the hook's approach leg
      counted as done and the hook drove straight up into the bar, touching the top drawer, and the servo
      clamped at the plane. Left level first to the nearest point with nothing over the hand, inits 0-19:
      libero_90 23 11 of 20 (v35 5; won 6, lost 0); unchanged per episode on libero_90 2, 5 and 24,
      libero_goal 0 and 3 and libero_10 3 (inits 0-9 each); libero_90 8 2 of 10 (v35 3: init 5 perturbed,
      a leave during the drawer's reopening mid-pick changed the pick that followed). The sweep excepts
      what the hand already touches: from the pressed bar, every direction's sweep met the bar itself and
      no way out was found. Colliding geoms only: a visual mesh (the shelf's) spans its openings. The
      remaining failures stall in the hook's final approach with the servo clamping, a separate mechanism.
      Supersedes the staged statement, which acted before any skill and was doubted for that scope (the
      start step, precedence with other teacher rules, the tool pose's source).
    sufficiency: {n_min: 3, min_consensus: 0.8}

