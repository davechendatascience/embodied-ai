      names it beside the drawers; the positions held fixed in claim (2) are the containers' joints.
      Restated 2026-09-26 in the running teacher's terms: it was stated in BRN-regression-planner's, a
      design that is not built (the teacher walks the plan task_spec builds), so live code rested on an
