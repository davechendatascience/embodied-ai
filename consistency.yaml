    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-regression-planner
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The skill teacher executes by regression over declared contracts, re-run every control
      step: pick(o) {hand empty, uncrowded(o), graspable(o)} -> held(o); place(o, R) {held(o),
      admits(R, o)} -> In/On(o, R); drive(j, mode) {hand empty, accessible(j)} -> the joint's
      predicate; park(o) {held(o)} -> hand empty, o resting on a free spot; move-clear(o) is
      pick then park outside what crowds it. task_spec reads the goals and affordances.yaml;
      predicates read the state only. Scope now: the predicates libero_object, spatial and
      goal and libero_10's put-in-drawer-and-close need; named, not yet covered: two objects
      into one region, enclosed regions, access occlusion, reorienting or regrasping an object.
    premises: [LMA-regression-selects-an-applicable-skill, LMA-hand-is-a-precondition,
               LMA-geometry-answers-predicates, LMA-protected-progress]
    derivation_rule: >-
      (to be implemented) evidence: CTR-teacher-reliable -- the 600-episode reference at
      bcf19e9 (523/600) reproduced wherever the old executor had no special case, then
      libero_10 KITCHEN_SCENE4 (bowl into the bottom drawer, close it).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-lean-step-is-env-step
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      A lean control period -- for each of the 25 physics substeps: mj_step1; refresh the
      JointPositionController's inputs (joint_pos, joint_vel, the arm block of the mass matrix)
      from that state with its new_update flag cleared; on the first substep set_goal(arm
      command); torques = clip(run_controller(), torque_limits); grip_action(gripper command);
      write both into data.ctrl; mj_step2 -- leaves the MuJoCo state (qpos, qvel, act,
      qacc_warmstart, ctrl, time) bit-identical to robosuite's env.step for the same command.
    premises: [AXM-one-execution-path, AXM-reproducible-measurement]
    derivation_rule: >-
      Falsified before implementation by an independent reviewer: it refreshes on every
      substep, but robosuite's first period after a reset runs on the controller's stale cache
      (AXM-robosuite-controller-cache), so the two paths differ from period 0 and never
      re-converge. Superseded by BRN-lean-step-keeps-controller-cache.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-lean-step-keeps-controller-cache
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      A lean control period -- for each of the 25 physics substeps: mj_step1; if the
      JointPositionController's new_update flag is set, refresh its cached joint_pos, joint_vel
      and arm mass-matrix block from that state and clear the flag (update() without its
      mj_forward); on the first substep set_goal(arm command); torques =
      clip(run_controller(), torque_limits); grip_action(gripper command); write both into
      data.ctrl; mj_step2 -- leaves every MuJoCo integration-state field and the controller's
      cache, flag and joint ramp bit-identical to robosuite's env.step for the same command,
      the first period after a reset included. What it skips (the two redundant mj_forward
      calls per substep, observables, the robot's recent-value buffers, LIBERO's visual-state
      update, reward) writes nothing the next substep reads.
    premises: [AXM-one-execution-path, AXM-reproducible-measurement, AXM-robosuite-controller-cache]
    derivation_rule: >-
      mj_forward has no effect on the next step beyond what mj_step recomputes (warmstart reads
      only qacc_warmstart, written in the advance), and mj_step1 + mj_step2 is mj_step for the
      Euler integrator: 300 substeps from a 37-contact state were bit-identical three ways.
      Honouring the flag reproduces robosuite's refresh schedule exactly: 60 periods / 1500
      substeps from TaskEnv libero_goal 8 reset(0), gripper closing, all mjSTATE_INTEGRATION
      fields and qacc with max difference 0; 2.88x faster (12.05 -> 4.18 ms per period).
      Implementation: screwhead/sim/sim_arm.py (to be written), held by a test that runs both
      paths from one saved state.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-task-loss-matches-scorer
    subject: CMP-rl-teacher
    claim_type: contract
    statement: >-
      A task loss built generically from a bddl's goal conjuncts -- for each conjunct, the
      distance of the simulator state to the set of states LIBERO's own predicate accepts
      (object origin to the containment box or on-top band, missing contact as a penalty,
      joint to its threshold) -- is zero exactly on the states LIBERO's _check_success scores
      true, and positive elsewhere; no task-specific term enters it.
    premises: [AXM-bddl-states-goals-not-methods, AXM-libero-scores-final-state,
               AXM-libero-joint-bands, AXM-object-geometry-known]
    derivation_rule: >-
      screwhead/teacher/task_loss.py gates each conjunct by LIBERO's _eval_predicate, the
      function _check_success conjoins. evidence: tools/task_loss_check.py on 240 teacher
      episodes (30 tasks x 8) -- final loss 0 iff success 240/240, 0 disagreements over 56,926
      conjunct-steps (only 210 satisfied states). Independent review: the zero set holds; the
      distance does not measure closeness -- the constant contact penalty is flat from 1 mm to
      30 cm above a support and ranks a bowl 5 cm off-centre on the plate worse than one
      hovering centred 30 cm up; a bowl on top of the closed cabinet reads 5.8 mm from In(bowl,
      top drawer); thresholds are copied from LIBERO into a table. Superseded by
      BRN-task-loss-descends-to-scorer.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-task-loss-descends-to-scorer
    subject: CMP-rl-teacher
    claim_type: contract
    statement: >-
      The task loss sums over the bddl's goal conjuncts a term that is 0 when LIBERO's own
      predicate accepts the conjunct (the _eval_predicate that _check_success conjoins) and
      otherwise max(d, MIN_TERM), where d vanishes only on the acceptance set and grows with the
      displacement from it: (a) the moved object's origin to the predicate's box or band, read
      from the site's live pose and size or the support's origin; plus (b), where the predicate
      requires contact and there is none, the smallest separation between the two bodies'
      collision geometry; plus (c), for an in/on target region carried by an articulated body
      whose joint is not open, that joint's distance to its open threshold, since the region is
      reachable only when open. Joint thresholds and directions are read from LIBERO's objects,
      not a table, and nothing is keyed by task. For placements generated from each task's own
      goal -- the moved object raised above its target, shifted across it, and an articulated
      target region closed versus open -- d is ordered as the displacement is.
    premises: [AXM-bddl-states-goals-not-methods, AXM-libero-scores-final-state,
               AXM-libero-joint-bands, AXM-object-geometry-known]
    derivation_rule: >-
      (to be implemented) Gating keeps the zero set LIBERO's by construction. (b) replaces the
      constant contact penalty that made the loss flat over a descent: a separation shrinks
      monotonically as the object is lowered onto its support. (c) is the one precondition the
      scene imposes on a containment goal that the bddl does not state (libero_goal 3: open the
      drawer, then In). Named, not covered: a goal that also asks to close the region it fills
      (libero_10) makes the open precondition and the Close conjunct cancel while the object is
      outside. evidence: a test built from the reviewer's placements (tests/test_task_loss.py)
      and tools/task_loss_check.py for the zero set.
      Independent review falsified it: LIBERO's In ignores the drawer joint and accepted the
      bowl in the top drawer at q = -0.13 ... -0.09, where is_open is false, so (c) ranked a
      bowl 4.4 mm from an accepted pose (d 0.051) worse than one 5 cm above an open drawer
      (0.050); mj_geomDistance on the live LIBERO model returned false zeros for separated
      parallel faces (wrong at 10-44 of 48 placements by up to 8 cm, and on 74 of 161
      no-contact rollout steps of libero_goal 4), leaving the loss at MIN_TERM; with native CCD
      off it reported spurious penetrations beyond a 5 cm distmax and saturated at it. With an
      exact box-box distance the raise and shift families were ordered by distance to the
      acceptance set in all 30 tasks. Superseded by BRN-task-loss-exact-separation.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-task-loss-exact-separation
    subject: CMP-rl-teacher
    claim_type: contract
    statement: >-
      The task loss sums over the bddl's goal conjuncts a term that is 0 when LIBERO's own
      predicate accepts the conjunct (the _eval_predicate that _check_success conjoins) and
      otherwise max(d, MIN_TERM), where d is 0 only on the acceptance set and otherwise the sum
      of (a) the moved object's origin to the predicate's box or band, read from the site's live
      pose and size or the support's origin; (b), where the predicate requires contact and
      there is none, the separation between the two bodies' LIBERO contact geoms, computed
      exactly for boxes (every contact geom in these tasks is one) and continuous at any
      height; and (c), for an in-region carried by a slide joint, how much further the region
      must slide out before the part of it past the parent's closed front is as deep as the
      object's half-extent along the slide, counted only while the object's origin is not
      already over that exposed part. Joint thresholds and directions are read from LIBERO's
      objects, nothing is keyed by task, and for placements generated from each task's goal --
      the moved object raised above its target, shifted across it, and a drawer region at
      openings from closed to fully open -- d is ordered by the placement's distance to the
      acceptance set.
    premises: [AXM-bddl-states-goals-not-methods, AXM-libero-scores-final-state,
               AXM-libero-joint-bands, AXM-object-geometry-known]
    derivation_rule: >-
      (to be implemented) Answers the review of BRN-task-loss-descends-to-scorer: (c) follows
      what LIBERO accepts (a partly open drawer whose exposed part fits the bowl) rather than
      is_open; (b) uses an exact box-box distance with bounding-sphere pruning, validated
      against the reviewer's QP reference (rv2_ccd.py) to within 1 mm, instead of the live
      model's mj_geomDistance. Thresholds: direction = sign(mean(own range) - mean(other
      range)), threshold = the end of the own range nearest the other (12 of 12 class
      predicates); a turn_on probe restores vis_site_names. Named, not covered: d ignores
      obstacles, so an object resting against a basket, plate or stove wall sits in a local
      minimum it must rise out of (+0.002 to +0.043 over the basket rim); hinged regions
      (microwave) and a goal that also closes the region it fills (libero_10). evidence:
      tests/test_task_loss.py from the reviewer's placements; tools/task_loss_check.py for the
      zero set on teacher episodes.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-rl-teacher-objective
    subject: CMP-rl-teacher
    claim_type: contract
    statement: >-
      A teacher policy trained to maximise the undiscounted episodic return of r_t = Phi(s_t)
      - Phi(s_t+1) + B [success at s_t+1] - lam |a_t - a_t-1|^2, Phi the sum over goal
      conjuncts of the task loss plus w_r times the reach, observing the arm, tool, jaws, the
      servo's last commanded twist and per conjunct the moved thing, the acceptance region and
      the loss's gap vector, and acting through the student's twist + target-aperture
      interface, (i) has success as its optimum whenever B exceeds the smoothness cost of some
      successful execution, (ii) can label any state the student reaches because its action is
      a function of that state, and (iii) yields demonstrations executed through the one
      execution path from its mean action with no noise.
    premises: [AXM-libero-scores-final-state, AXM-bddl-states-goals-not-methods,
               AXM-object-geometry-known, AXM-dagger-needs-markov-labels, AXM-one-execution-path,
               AXM-velocity-steps-are-jerks]
    derivation_rule: >-
      Independent review: (i) sound provided gamma = 1 exactly (critic included) and Phi is
      computed once per step; (ii) the observation is not Markov -- the servo's pose reference
      winds up while the arm is blocked (78 mm after 15 steps in contact; a +0.05 m/s command
      then moved the tool -0.7 mm instead of +26.3 mm) and robosuite's finger target survives
      a soft reset (AXM-robosuite-gripper-target-persists); obstacles and time to go are
      unobserved; the reward's a_t-1 is not the executed twist; (iii) success fires mid-fall
      or still held, disturbing other objects costs nothing, the smoothness penalty reads the
      requested action rather than the motion, in uneven units, and favours intermediate
      gripper targets the student's decode cannot reproduce. Superseded by
      BRN-rl-teacher-markov-objective.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-reset-clears-execution-memory
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      Once a reset has placed its init state, the execution layer holds no memory of the
      previous episode or of the pose before placement: robosuite's finger target is set to
      the value that holds the fingers' current opening, the joint controller's cache is
      refreshed from the placed state, and the joint ramp and both servos are anchored at it.
      An episode's trajectory is then a function of its seed and init state alone, the same
      whichever episodes ran before it in the process.
    premises: [AXM-reproducible-measurement, AXM-one-execution-path,
               AXM-robosuite-controller-cache, AXM-robosuite-gripper-target-persists]
    derivation_rule: >-
      (to be implemented, in SimArm so both environments share it) evidence: the same init
      state run after an episode that ended open and after one that ended closed gives
      bit-identical trajectories; the first period after a reset no longer runs on the
      pre-placement cache (0.0165 rad stale, up to 102 N m of torque difference). Changes the
      execution every demonstration and evaluation uses, so data collected before it is
      recollected (AXM-one-execution-path).
      Independent review falsified it as scoped: the settle pass that caches each init state
      (_settled_init_state, once per process) runs under the previous episode's finger target
      -- the cached aperture was 77.46 / 71.94 / 77.88 mm after a fresh start / a closed / an
      open ending, and a fix at the final placement only still diverged by 5.88 mm; the random
      start teleports the arm after placement (controller cache 0.30 rad stale, the 5-step hold
      moved the tool 25 mm and ended 2.9 mm off the sampled start); the process RNG makes an
      episode's start depend on its order (40.1 mm); and a revisit of k cannot catch the settle
      leak because the settled cache is shared. Superseded by BRN-reset-anchors-execution.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-reset-anchors-execution
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      SimArm anchors the execution layer at every placement of the arm -- after each
      set_init_state (settling an init state, checking a layout's compatibility, placing a
      layout, placing the episode's init state) and after the random start's IK write, before
      its hold: robosuite's finger target is set, clipped to its range, to the value whose
      actuator setpoint is the fingers' current position, and the joint controller's cache is
      refreshed (update(force=True)). With each episode's random draws taken from a generator
      seeded by (seed, episode index), an episode's trajectory is a function of (seed, episode
      index, init state), the same whichever episodes ran before it in the process. Teacher
      caches that persist across episodes (GripperScan) are outside this claim.
    premises: [AXM-reproducible-measurement, AXM-one-execution-path,
               AXM-robosuite-controller-cache, AXM-robosuite-gripper-target-persists]
    derivation_rule: >-
      (to be implemented, one SimArm._anchor used by both environments) Reviewer's probe with
      the anchor after every set_init_state: three histories bit-identical, and a 145-step
      closed-loop SkillTeacher run bit-identical after another episode; the anchor before the
      random start's hold made that hold exact (0.0 mm). The finger dead band (frictionloss 1
      N against kp 1000, +-1 mm per finger) means the anchor holds the placed opening, not the
      setpoint that produced it. evidence: first visits of an init state after each history
      (a fresh process, or the settled cache cleared) with start noise on and the closed-loop
      teacher, compared bit for bit; CTR-teacher-reliable re-certified.
      Independent review: bit-identical across five histories for TaskEnv (with and without
      start noise, rendering on), but falsified for PrivilegedEnv's layout mode --
      _compatible_init_state returns None on an unsettled redraw and reset() recurses, using up
      episode indices, so the first reset ended on episode index 2 / init 26 in a fresh process
      and index 1 / init 28 once init 28 had been settled; LayoutSampler.sample restores the
      state between tries without anchoring; anchoring the fingers at the placed opening moved
      the pre-shape from 30.3 to 27.8 mm (an open-setpoint anchor is history-free and left
      libero_goal 8 at 141 / 142 / 145 / 187 steps, as today); skill_eval's repro records carry
      seed*100+task although split workers use (seed*100+t)*1000+j. Superseded by
      BRN-reset-anchors-open.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-reset-anchors-open
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      SimArm anchors the execution layer at every placement of the arm -- after each
      set_init_state, after each state restore between layout tries, and after the random
      start's IK write before its hold: robosuite's finger target is set to fully open (the
      setpoint every settle pass ends on) and the joint controller's cache is refreshed
      (update(force=True)). An episode's draws come from a generator seeded by (seed, episode
      index), and internal redraws (an incompatible or unsettled init state, a rejected layout)
      from a sub-generator seeded by (seed, episode index, attempt), settling a redrawn init
      state in place rather than recursing into reset. An episode's trajectory is then a
