    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-leave-handle-along-approach
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A skill may not start while a handle any skill has acted on this episode is held or enclosed by
      the jaws. For each such handle this is a predicate on the current state, read whenever a skill
      would start: the jaws do not hold it in DEF-holding's sense, no part of its geometry lies within
      the jaw envelope -- between the fingers, out to the finger meshes' reach past the tool point --
      and no robot geometry touches its geometry. It constrains where each handle is relative to the
      jaws, not where the arm may go: holding another object, or reaching over an opened drawer into it,
      satisfies it. The skill that acted on a handle ends by making the predicate hold for it: the jaws
      release, then the tool moves along the handle's approach axis as the drive left it, away from the
      handle, with no component across that axis and no other motion, until the handle -- its own
      extent along that axis included -- lies wholly beyond the finger meshes' reach past the tool
      point, and stops there. That pose, carried by the drive's motion, is screened with the drive's
      stations: a handle grasp whose retreat ends outside DEF-reachable-pose is not used. If it later
      fails for a handle --
      the arm drifting back until a handle is enclosed again -- that skill's retreat is re-entered
      before any other skill starts. The jaws release first because the predicate cannot hold while they
      hold the handle.
    premises: [AXM-panda-gripper-geometry, AXM-handle-shares-body, DEF-skill-contract, DEF-holding,
               BRN-drive-tracks-the-handle, DEF-reachable-pose, LMA-whole-path-reachable,
               AXM-object-geometry-known]
    derivation_rule: >-
      DEF-skill-contract makes disengagement the planner's obligation and gives its form: a skill that
      releases what it grasped ends with the jaws not holding it, none of it between the fingers and no
      robot geometry touching it, and no skill may start while that fails for anything an earlier skill
      in the episode released. For a drive what it grasped is the handle, which is why the touch clause
      is about the handle rather than the joint's whole body, and the quantifier over every handle acted
      on this episode is that definition's, not an addition here. An earlier statement put 'the hand
      holds nothing' and a standing distance from every handle into the predicate, which under this
      quantifier forbids carrying an object after opening a drawer and forbids reaching into the drawer
      just opened -- the task this branch exists to serve. What entangles the arm is a handle between
      the fingers, so the predicate is written about that and nothing else. AXM-panda-gripper-geometry
      supplies the jaw envelope: the finger meshes reach 9.3 mm past the tool point, so a handle whose
      nearest point along the approach lies beyond that reach is between no part of the fingers, and
      AXM-object-geometry-known gives the handle's extent. The stop is that predicate read on the
      current pose, not a distance travelled: an earlier statement required at least the pads'
      back-edge offset plus the reach, which bounds the retreat from below only, and the retreat it
      admitted ran 100-150 mm out -- measured at 107fa9c, the smallest singular value of the arm's
      Jacobian fell 0.108 -> 0.063 along it and the next skill's first motion crossed 0.003, the servo
      re-anchored and the arm swept an object set down beside the cabinet. LMA-whole-path-reachable is
      why the retreat's end is screened rather than assumed from the drive's end, and
      DEF-reachable-pose is what the screen demands.
      BRN-drive-tracks-the-handle supplies that axis as the drive left it, the grasp frame carried by
