  - id: BRN-teacher-verdicts
    subject: CMP-optimization-teacher
    claim_type: contract
    statement: >-
      verdicts.py decides from the simulated state plus a carried Watch. SETTLED: LIBERO's success
      holds; no robot geom touches a moved object or a goal joint's body; every moved free object's
      weight is balanced by contact forces inside an 8-edge pyramid inscribed in each contact's friction
      cone (faces reaching mu cos^2(pi/8)), with kinetic energy below both the least potential rise that
      tips it about a horizontal edge of its contact hull and mu_min m g times the slide margin to the
      edge of LIBERO's acceptance set; and each goal joint's predicted rest q + qdot M_jj / damping
      (joint limits ignored) satisfies its predicate. Of the state it is given this says the object
      cannot leave acceptance by tipping or sliding from that state, not that it is motionless. Given
      the watch, a period that began with LIBERO accepting is also settled if that balance held at any
      of its substeps; the guarantee is claimed only of the substate where the balance was measured, and
      explicitly not of the period's end state, which may have been knocked since -- the relaxation is a
      filter for the search, not a proof of permanence. RELEASE: the watch reads each substep's start
      and each period's final forwarded state and carries its contact record and open losses across
      periods; a moved object that loses its last robot contact and does not regain one within the
      free-fall window of DEF-gentle-placement's 5 mm -- ceil(sqrt(2 x 0.005 m / g) / timestep) substeps
      of state advanced past the loss, which for a loss first seen at a period's final state is one
      substep fewer than for a loss seen mid-period, because that state is read again before the count
      advances -- is judged at the moment of loss: a violation if its lowest contact-geom point was more
      than 5 mm above the first collidable surface straight beneath it, or its centre of mass was moving
      vertically, in either direction, faster than 0.05 m/s. A loss still open is undecided until
      finish() judges it; fork() copies the watch for a rollout. DISTURBANCE: a movable body the goal
      does not name has a support (the root body bearing the largest upward share of its weight through
      contact forces, -1 when none) and a body-frame face most nearly down (changing at a 45 degree
      tilt), and is disturbed when that pair matches none of the references it is given; the caller
      passes both the episode start's and the previous period's references, since a body knocked earlier
      makes the start's pair alone miss a fresh knock. LOST: a moved object's centre of mass below the
      arena's support surface. Parameters: 5 mm and 0.05 m/s are DEF-gentle-placement's; the free-fall
      window follows from them, gravity and the timestep; the inscribed 8-edge pyramid is a
      construction, conservative against MuJoCo's contact softness by measurement rather than by
      assumption. Not claimed: that a same-support, same-face displacement is a violation; goals with
      several conjuncts or any-joint predicates (settled requires every listed joint); libero_goal 3.
    premises: [DEF-gentle-placement, AXM-release-is-free-fall, AXM-libero-scores-final-state, AXM-object-geometry-known, AXM-parameters-derived, BRN-task-loss-core]
    derivation_rule: >-
      Restated after the falsification of the previous statement (TRL-0229..0231 set aside with it). Two
      faults are fixed and one is scoped. (i) The claim carried its measurements inline and one of them
      was wrong -- a count of judged non-violations that excluded two that did fall. Every measurement
      is out of the claim now; the numbers live with the trials that took them and with
      component-belief's evidence for CMP-optimization-teacher, and the claim states only what must
      hold. (ii) 'Equilibrium at any substep' was stated as if it carried the tipping-and-sliding
      guarantee to the period's end; the counterexample was an object knocked after the accepting
      substep, which stays accepted by the relaxation and later leaves acceptance untouched by the
      robot. The guarantee is now claimed of the substate measured and explicitly withheld from the end
      state, and the relaxation is named as a search filter. (iii) The release window is stated with its
      boundary: a loss first seen at a period's final state is judged over one substep fewer, because
      period_end reads that state and the next substep re-reads it before the count advances. Evidence
      for the verdicts themselves -- fork equivalence, the release sweep, the knock sweep -- belongs in
      component-belief under CMP-optimization-teacher, which has no contract yet; that is the next thing
      this component owes. evidence: CTR-verdicts-decide.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-optimization-teacher
    subject: CMP-optimization-teacher
    claim_type: contract
    statement: >-
      Per task, the teacher is a network pi_theta, its weights frozen before it labels, whose input is
      the teacher's state: every free object's pose, box and velocities; every fixture joint's position
      and rate; every body pose LIBERO re-samples at reset; the execution state of
      BRN-execution-state-restore without the step counter (it carries the finger target, so no record
      of the last commanded level is input); the carried verdicts.Watch -- which moved objects the robot
      touches and, for each open contact loss, its age in substeps, gap and vertical speed; the task
      loss's gap vector; each unnamed movable body's support and face at the episode start. No language.
      It is trained by alternating a receding-horizon sampling search with regression of pi_theta onto
      the searched actions. The teacher acts through Execution(lean=True, anchor=True, scale_lead=True,
      gripper_mode='target') with the student's snap levels, LIBERO's horizon of 600 steps, no execution
      noise. At each control step the search starts afresh from a distribution centred on pi_theta(s)'s
      plan -- a continuous spread set from s, and a categorical over snap levels equal to pi_theta's
      level probabilities floored so every level has positive probability -- drawing its random numbers
      from a generator seeded with one fixed constant recorded with every demonstration. Each sampled
      plan -- a finite sequence of segments over the horizon -- is rolled out from s restored per
      BRN-execution-state-restore with a fork of the executed watch (substep hook each substep,
      period_end at each period's end), and ends at its first decided violation (release, or disturbance
      against the episode start's reference and s's own, or lost, checked at every period end) or its
      first settled period (settled with the watch). Plans are compared lexicographically by the key
      (decided violation or not; for a violating plan the negated period of its violation, otherwise the
      settled period or N+1 if none; the terminal order at the rollout's end state), losses still
      undecided at the rollout's end entering no entry; plans with equal keys share the mean of their
      ranks' weights; the update weights by rank alone and bounds KL(updated || start distribution); the
      first action of the best plan is executed. Terminal order: for an in or on conjunct, rho_g + d/2
      (the tool point's distance to the nearest point of the moved object's contact geoms plus half the
      task loss's distance); for a joint conjunct, the tool point's distance to the nearest point of the
      handle geom plus the handle's travel to the threshold (r |dtheta| for a hinge, r the handle's
      distance from the joint axis in the model; |dq| for a slide); 0 once LIBERO accepts. A
      demonstration is kept only if it ends settled, its continuous watch finishes with no violation and
      no disturbance or loss was decided on the executed trajectory, and its executed trajectory
      satisfies DEF-smooth-motion, read through _advance's substep hook. Both clauses are that
      definition's and are not restated here: this branch previously carried its own numbers and they
      drifted from it -- 2 m/s^2 where the definition says 6, and a re-anchor bar over every executed
      step where the definition bars them in free motion only.
      Then: (1) for states reached under this execution, the label is pi_theta(s) or such a search from
      s -- a function of the teacher's state; labelling states reached under another execution needs the
      student-adoption obligation below; (2) the search's rollouts predict the executed steps exactly
      and judge them with the executed verdicts and watch (BRN-execution-state-restore,
      BRN-teacher-verdicts); (3) the search's settings -- horizon N, segment length and count,
      iterations, samples, rank weights, the spread's initial value and shrink rule, the level floor,
      the KL budget, the seed, the number of instances -- and the terminal order enter neither the
      per-instance problem (the fewest steps to a settled state with no violation within 600) nor any
      verdict on the executed trajectory; they change which plan a finite search finds, and every
      demonstration records them. The verdicts' numbers are BRN-teacher-verdicts'; the action set and
      execution constants are the student's (AXM-one-execution-path), taken as given. Not claimed here:
      that the student's collection, DAgger and evaluation adopt this execution (a separate obligation:
      gripper_mode, fixed snap levels, horizon 600, no noise on the gripper channel, the lean options;
      it follows BRN-policies-read-one-forwarded-state); that the search reaches settled success (Q1),
      where it stalls (Q2), that nearby randomized instances get the same solution (Q3), how the
      terminal order compares to the steps taken (Q4), its cost (Q5).
    premises: [AXM-dagger-needs-markov-labels, AXM-one-execution-path, AXM-parameters-derived, AXM-libero-resamples-fixtures, BRN-task-loss-core, BRN-teacher-verdicts, BRN-execution-state-restore, BRN-policies-read-one-forwarded-state, DEF-smooth-motion]
    derivation_rule: >-
      Restated after TRL-0220..0222: the seed is a fixed recorded constant (the execution state held the
      step counter, so a byte seed depended on it) and the step counter is not input; the watch is
      carried state, input to pi_theta, and forked into every rollout, so the executed trajectory's
      releases are judged by the one continuous watch (a fresh watch per rollout missed or invented
      releases in 9 of 10 boundary cases); undecided losses at a rollout's end enter no entry;
      disturbance is judged against both the episode start's and s's references, so undoing one is not a
      violation; violating plans are ordered by how late they violate (the doc's section 3.5); ties
      share their mean rank weight; joint conjuncts get a terminal order in metres from the model's
      geometry; the keep-filter uses DEF-smooth-motion's 95th percentile and adds 'no violation on the
      executed trajectory'; (1) is scoped to states reached under this execution. The plan
      parameterization is left general here; BRN-screw-search specializes it. evidence:
      CTR-search-settles.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-screw-search
    subject: CMP-optimization-teacher
    claim_type: contract
    statement: >-
      The search of BRN-optimization-teacher samples plans made of segments, each one normalized body
      twist V (moment first) and one snap level held for the segment's periods. (a) Through TwistServo,
      which integrates the twist on SE(3) (T_ref <- T_ref exp([V] dt)), a segment moves the servo's pose
      reference along exactly one screw motion only after its rate limiter has reached V --
      ceil(|dV_ang| / 0.025) or ceil(|dV_lin| / 0.1) periods for a change dV in normalized units -- and
      only while no joint's lead exceeds joint_step (0.1 rad); when one does, the uniform lead scaling
      sets T_ref = fk(ref) and the reference follows no fixed screw. Measured on libero_goal 8: inside
      that set the reference matched exp([V] t) to 0.0 mm and 4e-6 deg and the executed tool lagged it
      by a constant (3.0 mm at 0.1 m/s, 7.5 mm at 0.25 m/s); the set's extent along a body axis was
      omega 0.070-0.133 and v 0.117-0.570 (normalized) at the two states measured, so isotropic segments
      of spread 0.1 left it in 21-22 of 30 samples. The rollouts simulate the servo exactly either way,
      so the parameterization decides only where plans are sampled. (b) Spreads are isotropic in
      normalized twist coordinates, i.e. under the left-invariant metric |v|^2 / v_max^2 + |omega|^2 /
      omega_max^2 at the grip site, v_max = 1 m/s and omega_max = 10 rad/s from robosuite's osc_pose
      (pos_scale 0.05 m, rot_scale 0.5 rad at 20 Hz; length scale 0.1 m); the execution's other scales
      (the rate limiter's 0.4 m, the state-dependent lead-limited set) are not matched. (c) Before
      sampling, the mean of the leading segments may be shifted along the negative gradient, with
      respect to the segment twist, of the smooth part of the terminal order: for a free tool, rho_g
      through the grip site's velocity p_dot = R v (the tool point is the tool frame's origin, so
      rho_g's angular gradient is zero); for a held object (both finger groups on it), d through the
      object's twist Ad_{T_off^-1} V as a rigid attachment at its in-hand offset T_off
      (AXM-grip-fixes-object-in-hand) -- never through contact dynamics. The shift counts against
      BRN-optimization-teacher's KL budget, measured from the unshifted distribution centred on
      pi_theta(s)'s plan; its step length is a compute parameter. Measured: the analytic gradients match
      exact reference finite differences to 2.8e-12 (rho_g) and 6.2e-10 (held d) on libero_goal 8,
      2.6e-12 and 2.3e-12 on libero_object 1. (d) No grasp-quality term enters the field:
      held-and-lifted periods of successful skill-teacher grasps lacked force closure (libero_spatial 0:
      65 of 65), so a slope toward force closure would push the search away from grasps that work
      (LMA-grip-fails-by-contact-not-load). (e) Plans, pi_theta's outputs and the object verdicts
      contain no robot-joint quantity (goal-joint verdicts read fixture joints); pi_theta's input does
      (the execution state), and which twists execute on the screw depends on the arm's lead limit, so a
      policy for another arm needs a tool-space input plus screwhead's robot spec tokens. Not claimed:
      that (a)-(c) reduce the samples a search needs (Q7); that a teacher transfers to another arm (Q8).
    premises: [BRN-optimization-teacher, BRN-task-loss-core, BRN-servo-lead-scaled-uniformly, BRN-execution-bounds-acceleration, AXM-grip-fixes-object-in-hand, AXM-object-geometry-known, AXM-parameters-derived, AXM-one-execution-path]
    derivation_rule: >-
      Restated after TRL-0232..0234: (a) scoped to the lead-limited set and the limiter ramp, with the
      measured extent of that set (the uniform lead scaling rewrote T_ref and left the screw by up to
      527 mm outside it); (b) states the metric and frame instead of 'isotropic in se(3)'; (c) worded as
      measured (p_dot = R v, Ad_{T_off^-1}) and the proposal shift charged to the KL budget, resolving
      the contradiction with BRN-optimization-teacher; (d) dropped -- the reviewer measured working
      grasps without force closure and found the term's torque length scale unsourced and its units
      needing the squeeze; (e) adds that executable twists depend on the arm's lead limit. Premises now
      include the servo lead scaling, the rate limiter and the rigid in-hand grip the claims use. The
      reviewer also found that the servo's lead-scale rewrites are not counted as re-anchors, which
      bears on BRN-optimization-teacher's smoothness keep-filter. evidence: CTR-search-settles.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  # ---- CMP-scene-randomizer: resets, layouts and what a policy reads: one execution core, two environments
  - id: BRN-lean-step-is-env-step
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      A lean control period -- for each of the 25 physics substeps: mj_step1; refresh the
      JointPositionController's inputs (joint_pos, joint_vel, the arm block of the mass matrix)
      from that state with its new_update flag cleared; on the first substep set_goal(arm
      command); torques = clip(run_controller(), torque_limits); grip_action(gripper command);
      write both into data.ctrl; mj_step2 -- leaves the MuJoCo state (qpos, qvel, act,
      qacc_warmstart, ctrl, time) bit-identical to robosuite's env.step for the same command.
    premises: [AXM-one-execution-path, AXM-reproducible-measurement]
    derivation_rule: >-
      Falsified before implementation by an independent reviewer: it refreshes on every substep, but
      robosuite's first period after a reset runs on the controller's stale cache
      (AXM-robosuite-controller-cache), so the two paths differ from period 0 and never re-converge.
      Superseded by BRN-lean-step-keeps-controller-cache. evidence: CTR-execution-reproducible.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-lean-step-keeps-controller-cache
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      A lean control period -- for each of the 25 physics substeps: mj_step1; if the
      JointPositionController's new_update flag is set, refresh its cached joint_pos, joint_vel
      and arm mass-matrix block from that state and clear the flag (update() without its
      mj_forward); on the first substep set_goal(arm command); torques =
      clip(run_controller(), torque_limits); grip_action(gripper command); write both into
      data.ctrl; mj_step2 -- leaves every MuJoCo integration-state field and the controller's
      cache, flag and joint ramp bit-identical to robosuite's env.step for the same command,
