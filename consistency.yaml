      admits.
    premises: [LMA-whole-path-reachable, DEF-witness-or-refusal, DEF-refusal-is-an-outcome, AXM-handle-shares-body, AXM-object-geometry-known, AXM-mujoco-forward-is-a-function-of-state, AXM-mujoco-integration-state, AXM-libero-scores-final-state, AXM-instruments-do-not-decide]
