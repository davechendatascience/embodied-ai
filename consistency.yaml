      while the tool was at 18 cm, and the pick stalled there to the horizon (init 14; 9 of the 17
      failures with the leaned tiers and the upward leave, each with a screened upright rim pinch). Turned
      at its height first, those 9 inits (3, 8, 14, 17, 20, 30, 38, 42, 48) went 0 -> 9 of 9.
      BRN-place-in-aligns-before-descending is the same rule on the place's side. Restated per the
      verifier: claims (1) and (4) are of the law's down phase; the slide is not it.
    sufficiency: {n_min: 3, min_consensus: 0.8}

