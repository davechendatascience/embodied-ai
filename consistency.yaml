  - id: BRN-execution-bounds-acceleration
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The execution layer executes every policy's action with its joint goal ramped linearly over
      the whole control period, the commanded twist changing by at most 2 m/s^2 in its linear part
      and 5 rad/s^2 in its angular part -- and by at most 0.5 m/s^2 in its linear part in any period in which the jaws are commanded
      closed and both finger groups touched one body that is not the robot within the last five
      periods -- and a 0.1 rad per-period joint clip shared by the controller, the servo's lead
      limit and the settling hold. Whether the jaws hold something is read from the contacts, the
      period's action and a count of periods since both fingers last touched one body, which the
      execution layer carries as it carries the previous commanded twist; the rule is the same for
      every policy.
    premises: [LMA-smooth-in-execution, LMA-grip-fails-by-contact-not-load,
               AXM-rim-pinch-drops-under-smooth-motion, AXM-one-execution-path]
    derivation_rule: >-
      LMA-smooth-in-execution gives the ramp, the bounded change of the commanded twist and the
      clip, applied to every policy alike, which AXM-one-execution-path requires of any condition
      the bound depends on: contacts and the action are both inputs every policy's execution has.
      LMA-grip-fails-by-contact-not-load says a pivot nothing resists is driven by the tool's
      accelerations. The count is the layer's own state: read from the contacts alone the condition
      flickered mid-carry, and latched until the jaws were commanded open it held the bound through
      the regrasp after a drop with nothing held (a verifier's counterexample). Five periods of grace
      is chosen, not measured against the flicker's own distribution; with it, no episode outside
      libero_goal 3's changed over 1500 against the latch. It is execution state like the previous commanded twist, and
      BRN-execution-state-restore's saved fields must include it. The values are measured, not
      derived, on the same seeds: bounding every
      period at 1 m/s^2 took libero_goal 9 from 1 to 50 of 50 but libero_spatial from 478 to 447,
      the approach overrunning its phase switches (spatial 3, 6 and 8 lost 31 episodes), and a
      braking cap in the teacher did not recover them; 0.5 m/s^2 in every period removed most of the
      bowl's mid-carry drops and lost more episodes still. Bounded only while the jaws hold
      something, 0.5 m/s^2 kept libero_goal 9 at 25 of 25. Read as "the jaws asked narrower than
      they are" the condition was true of every free close and slowed empty approaches; read from
      the contacts alone it flickered, which the count's grace covers. The bound does not stop the
      mid-carry drops: they persist at 0.5 m/s^2 while holding, and what
      separates them from the 0.5-everywhere runs that nearly remove them is open. evidence:
      CTR-teacher-reliable, CTR-teacher-gentle (CTR-teacher-smooth: substep acceleration p95
      median 2.18 m/s^2 against ~12 before the ramp and the bound, RUN-0047).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-push-cages-a-dish
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      For a goal On(o, R) where o's category is declared moved_by push, the plan's step is a push, and the
      push commands the jaws to 62 mm at every step. Each control step it reads o's pose: u is the plan
      direction from the centre of o's box to R's centre; o's floor is the highest top of o's colliding
      geoms whose centres lie within 0.2 of o's plan radius of its centre; the entry point lies ahead of
      o's centre along u by 0.44 of o's plan radius (its box's larger horizontal half-extent), at the
      height that puts the finger meshes' reach below the tool point on that floor. The jaw frame is one
      of the two that point the tool down with the jaw axis along u, the one nearer the wrist. While the
      fingertips are below o's top, the tool is within 15 mm of the entry point across u and less than 40
      mm ahead of it along u, and the wrist is within 0.10 rad of that frame, the push commands the tool
      toward a point 80 mm ahead of the entry point along u at the push speed, 0.10 m/s. Otherwise the
      tool returns to the entry point by the teacher's up-over-down approach, whose plane lies a declared
      lift above o's top: straight to the entry point when within 20 mm of it in plan, or within 50 mm
      while below the plane; else up to the plane, across and down. At each step of that approach the tool
      poses at three stops -- the entry point, the entry point carried to R, and halfway between -- are
