      the contacts alone it flickered, which the count's grace covers. The bound does not stop the
      mid-carry drops: they persist at 0.5 m/s^2 while holding, and what
      separates them from the 0.5-everywhere runs that nearly remove them is open. evidence:
      CTR-teacher-reliable, CTR-teacher-gentle (CTR-teacher-smooth: substep acceleration p95
      median 2.18 m/s^2 against ~12 before the ramp and the bound, RUN-0047).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-push-cages-a-dish
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      For a goal On(o, R) where o's category is declared moved_by push and R lies on the surface o
