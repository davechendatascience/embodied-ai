  - id: BRN-policies-read-current-state
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      Every policy's input for step t -- the teacher's snapshot, the student's state and
      images, the recorder's frames -- is read from the simulator state at the end of step
      t-1's last physics substep (observations forced after each step, not robosuite's sampled
      observables), so each action is chosen from the state it acts on, and reading an
      observation never changes a trajectory.
