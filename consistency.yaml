  - id: BRN-place-carries-on-through-a-flicker
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Terms are BRN-place-done-when-released's (its let-go test: not held in DEF-holding's sense, and, for
      the object last held, touched by no robot geometry and with the tool point more than a declared
      margin outside the object's box; and the place's target, the point its delivered test reads) and
