  - id: BRN-drive-tracks-the-handle
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The first control step in an episode at which the skill drives a joint by its handle, it chooses
      one handle grasp -- an orientation, a jaw width and an approach direction, screened for reach
      along the joint's motion from the state at that step -- and records it with the joint's position
      q0 at that step; the choice is kept for the rest of the episode, and re-running the screen from a
      later state may choose differently. At every step the grasp orientation R_h and the approach are
      the recorded ones carried by the joint's motion from q0 to its current position q (turned by
      q - q0 about the hinge axis for a hinge, unchanged for a slide), and the grasp position p_h is the
      handle geom's current centre. While the handle is held, the drive target is the pose (R_h, p_h)
      carried by the joint's motion through dq, the joint's remaining travel to just past its goal
      threshold, clipped to 0.06 rad (hinge) or 0.03 m (slide). Claimed: given the recorded choice, the
      skill's command at every step of the drive is a function of the current state; and the drive
      target leads the handle's current grasp pose by at most 0.06 rad (hinge) or 0.03 m (slide), the
      rotation less than the squeeze alignment tolerance of 0.10 rad. Not claimed: that the recorded
      choice is re-derivable from a later state.
