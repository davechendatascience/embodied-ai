      box axes whose vertical component is below a declared bound. If the region box does not have
      exactly two horizontal axes, or the object's box has none, the commanded tool orientation is the
      current one. Otherwise the skill computes the object's plan extents along the region's two
      horizontal axes; if they fit with no tolerance (each within the region's extent), the commanded
      orientation is the current one. If not, with theta a smallest turn about the vertical laying the
      object's longest horizontal axis (the first in box order among equals) along the region's longer
      horizontal axis (the first among equals), ties between turns of equal size broken toward the
