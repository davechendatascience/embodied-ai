  - id: BRN-roofed-entry-goes-in-shallow
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Terms are BRN-place-enters-roofed-target-level's and BRN-drop-point-footprint-as-carried's. A
      place's region is closed above for its object when, at the step the place's drop point is chosen,
      that point is the drop-point search's (not BRN-share-a-surface-side-by-side's) and the search -- its
      earlier search and, where BRN-drop-point-footprint-as-carried runs it, its carried search -- found
      no candidate open from above; this is recorded then, with the drop point, and cleared at an
      episode's start. The go-shallow record for the object and region is cleared at an episode's start
      and is set or cleared only where a later branch states that it sets or clears it; where none has set
      it, it is not set. At a step at which a later branch evaluates the place's rule as an observer and
      states how it counts closed above, the condition below -- the region closed above and the go-shallow
      record set -- is instead that the region is closed above as that branch counts it. For a direction
      u, at a step at which the object is not laid, when the region is closed above and the go-shallow
      record is set, the drop point for u -- which this branch states it replaces -- is the place's drop
      point moved along u by the amount, where positive, by which its offset from the region's centre
      along u falls short of the region's half-extent along the region's axis u is taken from less a
      declared depth, zero or more and at most that half-extent; the rest height, bottom, top, entry point
      E, corridor, sweep and commands for u are then those at that point, and where the object has no rest
      height there, u has no entry frame. Claimed: (1) for such a direction the drop point for u lies on
      the line through the place's drop point along u, and its offset from the region's centre along u,
      read at that step, is the greater of the place's drop point's offset and that half-extent less the
      depth; (2) where that offset already reaches that half-extent less the depth, or the object is laid,
      or -- at a step with no observer -- the region is not closed above or the go-shallow record is not
      set, or -- at an observer's step -- the region is not closed above as the observer counts it, this
      branch leaves the drop point for u as it is without this branch; (3) whether the region is closed
      above is fixed for the episode from the step the drop point is chosen, and the go-shallow record
      changes only where a later branch states that it sets or clears it. Not claimed: that the object
      fits across the opening or rests where it is released; that LIBERO's containment holds along the
      region's other axes; that a door or lid closes over the object; the provenance of the depth.
    premises: [BRN-place-enters-roofed-target-level, BRN-drop-point-footprint-as-carried, LMA-caches-reset-per-episode]
    derivation_rule: >-
      The microwave's heating region has no point open from above -- its roof covers all of it -- so the
      drop point search returned its centre, 8.4 cm in from its front face. There a mug held by its handle
      has the hand inside the opening, whose height (14.4 cm) and width (20.7 cm) the hand and the mug do
      not fit together: at the centre every candidate of every tier met the microwave at the release (0 of
      940, libero_10 9 init 2). LIBERO's humans release it with its origin 0-5 cm past the region's face
      and close the door, which pushes it in (8 of 8 demonstrations end 3.6-5.3 cm past the face). With
      the depth 2 cm, the handle tier's leaned pinches pass the screen at the release (10 of 252) and
      libero_10 9 went 0 -> 5 of 5 (inits 0-4) with BRN-pinch-leans-when-upright-unreachable and
      BRN-grasp-screened-at-roofed-release. Restated per the verifier: closed above is the search finding
      no point open from above, whatever point it then returns; claim (1) states the offset exactly, read
      at the step, since a region on a drawer can move after its drop point is chosen. Restated per the
      verifier: claim (2) says this branch leaves the drop point alone there, since for a laid object
      BRN-place-steep-laid-entry may replace it. Restated for the go-shallow record: shallow wherever the
      region was closed above moved libero_90 42's pan, which the grasp screen had passed at the centre,
      to the shelf's front edge (49 -> 43 of 50 in v41); gone in shallow only where the grasp was screened
      there, 43 -> 49 (v42), and libero_10 9 kept its mug in shallow (44 -> 49 in v44 with the door
      table). Restated per the verifier: claim (2)'s conditions are stated for steps with and without an
      observer.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-grasp-screened-at-roofed-release
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
