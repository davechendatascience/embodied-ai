      (BRN-laid-entry-crosses-pitched) may put a frame of its own in the place of u's level frame: the
      decision screens the frame in force. Restated per the verifier: where a later branch's frame stands
      in for u's level frame, that branch's recorded decisions -- made at earlier steps -- are among the
