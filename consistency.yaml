      grasp kept as drive-checked passed every pose listed; (2) with refusal enabled, no grasp that failed
      a pose is used; (3) with refusal disabled, every kept grasp that failed a drive pose is marked not
      drive-checked. Not claimed: that the poses are reachable in DEF-reachable-pose's sense -- its
