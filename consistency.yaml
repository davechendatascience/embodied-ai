      mm), current on 4 of 120 steps; one extra observe() at step 10 changed the closed-loop
      trajectory from step 11. evidence: lag 0 on every step; an inserted observe() leaves a
      closed-loop episode bit-identical; CTR-teacher-reliable re-certified.
      Independent review: sound for trajectory invariance (joint lag 0 on 120/120 steps; extra
