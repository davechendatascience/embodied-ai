# Declarations for the consistency-belief MCP: the design reasoning behind the teacher,
# as a proof DAG rooted in what this project has measured or requires.
#
# Like belief.yaml this file is the approval gate: the server reads it from git HEAD, so
# nothing here counts until a human commits it.
#
# The two ledgers are paired. belief.yaml (component-belief) records whether the teacher
# WORKS: tests run through its run_test and land as measured trials. This file records
# whether the reasons we give for the design FOLLOW from their premises. A branch is proven
# only by adversarial probes (verify_step) that fail to find a counterexample, run by a
# reviewer other than the one who wrote it, and it is only worth anything while its
# contract's evidence holds.
#
# WHERE THE COMPONENTS ARE. Every branch carries `subject:`, and that names a component
# declared in belief.yaml -- the same id under which that component's code paths, contracts
# and measurements live. The branches below are grouped by it, one banner per component, and
# `derivation_rule` names the `evidence:` contract that measures the claim. consistency-belief
# checks both ends at load: a subject belief.yaml no longer declares is REMOVED_SUBJECT (the
# component was deleted or renamed, so the design governs nothing), a subject in prose is
# UNATTACHED_SUBJECT, and a CMP-/CTR- id cited in derivation_rule that belief.yaml does not
# declare is UNKNOWN_EVIDENCE. `status(view="coverage")` lists every component from both files
# at once: governed (code and a declared branch), undeclared design (code nobody justified),
# planned (a design declared before anything is built). Axioms, definitions and lemmas carry
# no subject: they are the shared ground the components' designs are built on.

# The components these designs govern, in the order they appear below. belief.yaml owns each one
# -- its purpose, code paths and contracts -- so this list is an import, and every branch's
# subject must be one of them. `status(view="coverage")` shows both files side by side.

components:
  - {id: CMP-optimization-teacher, note: the general teacher -- task loss, verdicts, exact restore, the search, pi_theta}
  - {id: CMP-scene-randomizer, note: resets, layouts and what a policy reads -- one execution core, two environments}
  - {id: CMP-twist-servo, note: the twist servo and the joint ramp every policy's action goes through}
  - {id: CMP-skill-library, note: the hand-written skill teacher that still drives the student's demonstrations}

axioms:
  - id: AXM-libero-scores-final-state
    domain: environment
    statement: >-
      Success is LIBERO's own predicate evaluated on the simulator state: In(obj, region)
      is containment of the object's origin, plus contact when the region is an object (for
      a site region -- the basket's contain region, a drawer's -- check_contact is always
      true, so containment alone); On(obj, site) is the origin within the site's footprint
      and height band, plus contact with the site's parent object when it has one;
      Open/Close/TurnOn/TurnOff compare one joint to a threshold.
    rationale: >-
      A reimplemented predicate drifted from the scorer: a box test called In true with
      the can 8 mm above the basket rim while LIBERO scored the episode a failure.

  - id: AXM-dagger-needs-markov-labels
    domain: requirement
    statement: >-
      The teacher must be able to label any state the student reaches, so its action is a
      function of the current state (and of decisions re-derivable from it), never of the
      history of the episode or of previous episodes.
    rationale: DAgger relabels student-visited states; a history-dependent label is undefined there.

  - id: AXM-one-execution-path
    domain: requirement
    statement: >-
      Demonstrations, DAgger rollouts and evaluation execute actions through the same
      servos and the same action decode.
    rationale: >-
      Relabelling command-mode data and testing through the servo was a train/test mismatch
      that invalidated a round of results.

  - id: AXM-servo-tracks-reachable-poses
    domain: physics
    statement: >-
      The twist servo tracks a commanded pose only where the arm has a converged IK
      solution with room to move (smallest singular value and joint margin bounded away
      from zero) and is not inside a fixture; elsewhere it clamps on joint limits and
      re-anchors its reference, and the tool does not follow the command.
    rationale: Measured repeatedly as re-anchor and clamp counts rising while the tool stalls.

  - id: AXM-panda-gripper-geometry
    domain: physics
    statement: >-
      The Panda's gripping surfaces are its pads, reaching from 4.4 mm past to 11.6 mm
      behind the tool point; its finger meshes reach 9.3 mm past it and its palm begins
      31 mm behind it. Each finger is a position servo (1000 N/m toward closed, capped at
      20 N), so the squeeze on an object scales with how far each finger is held from closed.
    rationale: >-
      Measured from the exact collision geometry (sim/scan.py; the earlier 5 mm / 40 mm
      came from a box helper that mis-sized every mesh) and read from the MJCF actuators.

  - id: AXM-libero-resamples-fixtures
    domain: environment
    statement: >-
      Every env.reset() re-samples fixture poses from numpy's global RNG and writes them to
      model.body_pos and model.body_quat of fixture root bodies attached to the world, and to
      no other model field; set_init_state restores neither.
    rationale: >-
      Two unseeded resets moved the wooden cabinet 12 mm apart. Across 30 tasks (libero_goal,
      spatial and object 0-9), episodes and instances differ only in fixture root bodies'
      body_pos and body_quat -- all 10 libero_spatial tasks re-sample body_quat too, and
      libero_object re-samples nothing (TRL-0240).

  - id: AXM-handle-shares-body
    domain: environment
    statement: >-
      A fixture's handle is one geom of the MuJoCo body it moves (the drawer's bar and its
      face are one body; so are the stove knob's box and the rest of its button), so contact
      with that body does not say the fingers are on the handle.
    rationale: Read from the scene; replayed, fingertips pressed on the drawer face counted as contact with the drawer.

  - id: AXM-grip-fixes-object-in-hand
    domain: physics
    statement: >-
      While an object is held without slipping, its pose relative to the tool does not
      change, and both poses are in the simulator state at every step (a privileged input:
      the teacher reads object poses from the simulator, which the student will not).
    rationale: The teacher's object poses come from Scene.body_pose / object_box, i.e. MuJoCo state.

  - id: AXM-support-scannable
    domain: environment
    statement: >-
      For a region open from above, the surface an object will rest on at a target position
      is the first collision geometry that downward rays over the object's footprint there
      meet; the teacher reads that geometry from the simulator (privileged, like object
      poses). Enclosed regions -- under a shelf board, inside a microwave -- are not found
      this way: a downward ray meets the ceiling first.
    rationale: The drop-point search and clearing.py already locate open surfaces with mj_ray.

  - id: AXM-release-is-free-fall
    domain: physics
    statement: >-
      Once the jaws open, an object not yet resting on a support falls; from a gap h it lands
      at sqrt(2 g h) (20 mm: 0.63 m/s) and can bounce, tip or slide out of its target.
    rationale: >-
      Measured at 4edb9d0 (tools/teacher_motion.py): deliberate releases 14-29 mm (up to 88)
      above the surface, the bowl already falling at 0.1-0.24 m/s.

  - id: AXM-acceleration-loads-the-grip
    domain: physics
    statement: >-
      A held object's inertial load is its mass times the tool's acceleration; the grip holds
      only while pad friction, from at most 20 N of normal force per finger, exceeds gravity
      plus that load along the gripped surfaces.
    rationale: >-
      Measured at 4edb9d0: rim grips lost the bowl 0.2-0.36 m up during lifts and carries,
      with tool acceleration p95 3.5-5 m/s^2 and peaks up to 35.

  - id: AXM-velocity-steps-are-jerks
    domain: physics
    statement: >-
      The servo tracks each commanded twist within one 20 Hz control step, so a step change
      of dv in the commanded velocity is executed as an acceleration of about dv x 20.
    rationale: >-
      Measured at 4edb9d0 -- acceleration p95 3.5-5 m/s^2, jerk p95 100-170 m/s^3, at phase switches.

  - id: AXM-stepped-joint-goal-lunges
    domain: physics
    statement: >-
      LIBERO's JOINT_POSITION controller steps its joint goal once per 50 ms period, and the
      stiff critically damped PD behind it (kp 4000) moves the arm in a lunge and coast inside
      every period, whatever the commanded velocity.
    rationale: >-
      Measured at the 2 ms physics substep -- within one steady carry step the tool speed went
      0.08 -> 0.20 -> 0.09 m/s; substep acceleration p95 12.1 m/s^2 where 20 Hz differencing read 3.9.

  - id: AXM-robosuite-interpolator-hyperbolic
    domain: environment
    statement: >-
      robosuite 1.4.0's LinearInterpolator returns start + (goal - start) / (N - k) without
      advancing start, so half of each move lands in the last two of its N = 25 substeps.
    rationale: >-
      Read from linear_interpolator.py and measured -- the joint torque sagged mid-period and
      spiked to -178 N m at its end; enabling it made substep acceleration worse (max 94.5 m/s^2).

  - id: AXM-rim-pinch-drops-under-smooth-motion
    domain: physics
    statement: >-
      Rim pinches of the akita bowl lose it during lifts and carries even with tool
      acceleration bounded near 2 m/s^2 -- the drops are not caused by execution jerk.
    rationale: >-
      TST-teacher-motion before and after execution smoothing -- 24 then 27 drops in 20 episodes,
      with substep acceleration p95 going from ~12 to a median 2.2 m/s^2.

  - id: AXM-object-geometry-known
    domain: environment
    statement: >-
      Every object's and fixture's collision geometry, in its current pose, is in the
      simulator state (a privileged input, like object poses).
    rationale: Scene.object_box and the grasp planner already read MuJoCo geoms.

  - id: AXM-bddl-states-goals-not-methods
    domain: environment
    statement: >-
      A LIBERO bddl states the goal conjuncts (In, On, Open, Close, TurnOn, TurnOff), the
      objects and fixtures with their categories, and the regions -- and nothing about how
      any of it is to be achieved.
    rationale: Read from all 130 bddl files (task_spec.py docstring counts the predicates).

  - id: AXM-category-affordances-declared
    domain: requirement
    statement: >-
      What the bddl leaves out about a category -- how it is moved (pick, push, or not at
      all), where it is held, how it rests on each kind of support, what a fixture's joints
      are -- is declared once per bddl category in screwhead/teacher/affordances.yaml, each
      value tagged measured, declared or open; an open value is not relied on.
    rationale: >-
      The user's decision (2026-09-21) -- per-category facts, not per-task scripts, so the
      teacher stays generic across suites; tests/test_affordances.py keeps the table complete.

  - id: AXM-libero-joint-bands
    domain: environment
    statement: >-
      LIBERO's Open and Close predicates for one joint leave a band where neither holds:
      drawers count open below -0.14 and closed above 0.0; the microwave door open below
      -1.3 rad and closed above -0.005.
    rationale: Read from libero/envs/objects/articulated_objects.py (WhiteCabinet, Microwave).

  - id: AXM-one-gripper
    domain: physics
    statement: >-
      The robot has one gripper: while it holds an object it cannot grip anything else,
      drive a fixture's joint or push, and it frees its hand only by setting the object down.
    rationale: The Panda in every LIBERO task (robots=["Panda"], gripper_types="PandaGripper").

  - id: AXM-objects-are-light
    domain: physics
    statement: >-
      Every movable object in libero_object, spatial and goal weighs 5.2-31.7 g (the basket
      136 g): gravity at most 0.31 N, against squeeze forces of 1-20 N at a pad friction of 2.0.
    rationale: Read from the model's body masses (docs/grasp_mechanics.md).

  - id: AXM-squeeze-is-a-spring
    domain: physics
    statement: >-
      A finger's target cannot pass fully closed, so the squeeze on an object of width w is
      about 1000 x w/2 N per finger, capped at 20 N: about 1.3 N on a 2.6 mm bowl rim, 20 N on
      a 40 mm box -- and it falls as a slipping object lets the jaws close.
    rationale: >-
      Actuator gain 1000 N/m, forcerange +-20 N, ctrlrange 0..40 mm; measured 4.0 -> 2.1 N as
      a rim pinch crept from 8.1 to 4.2 mm (libero_spatial 6, episode 0).

  - id: AXM-no-torsional-friction
    domain: physics
    statement: >-
      Pad and object contacts are condim 3: tangential friction (2.0, the larger of the pair)
      and no torsional or rolling friction, so only the spread of the contact points resists
      an object pivoting about the jaw axis.
    rationale: >-
      Read from the geoms; measured, a bowl pivoted 0.3 -> 16 degrees about a rim pinch over
      45 steps and fell (libero_spatial 6, episode 0).

  - id: AXM-slip-spikes-are-transient
    domain: physics
    statement: >-
      A held object's velocity relative to the jaws spikes for a step or two during the
      squeeze (the fingers nudge it) and at the start of a lift (it lags), while a carried
      object's stays below about 0.01 m/s and 0.2 rad/s.
    rationale: >-
      Measured on libero_spatial 6; a holding test on instantaneous relative velocity
      (0.05 m/s, 1 rad/s) read those spikes as losses.

  - id: AXM-reproducible-measurement
    domain: epistemic
    statement: >-
      A measurement is evidence only if the same seed reproduces the same episode, and an
      observer does not change the behaviour it records.
    rationale: Without it, paired comparisons of two teacher versions measure noise.

  - id: AXM-instruments-do-not-decide
    domain: epistemic
    statement: >-
      An instrument never decides an outcome. The outcome of an episode is what the scorer says
      about the state the episode reached; an instrument's own failure is reported as a failure of
      the instrument, and is never recorded as a failure of the thing it was watching. A run that
      does not complete the episodes it declared reports the shortfall rather than presenting the
      episodes that happened to arrive as though they were the sample it promised. Evidence is
      bound to the run that produced it: a result written by an earlier run is not evidence about
      a later one, whatever name it is filed under.
    rationale: >-
      Otherwise a crashing logger reads as an unreliable teacher, a worker that dies silently
      shrinks n while the rate is reported as though it had not, and a stale file is restamped
      with the current revision -- three ways to publish a number about nothing. AXM-reproducible-
      measurement asks that observing not change the behaviour; this asks that observing not
      supply the verdict.

  - id: AXM-mujoco-forward-is-a-function-of-state
    domain: environment
    statement: >-
      Writing a configuration into MuJoCo's state and running its forward pass yields the body,
      geom and contact geometry that configuration has: the derived fields are functions of the
      state written, not of the states that preceded it. The same pass makes each contact's normal
      force readable per contact. So a configuration the world was never in can be screened by
      writing it, forwarding, reading, and restoring what was there before.
    rationale: >-
      Two claims need it and neither can cite AXM-mujoco-integration-state for it: that axiom says
      restoring a state reproduces the steps that follow, which licenses the restore and says
      nothing about the write. Screening a grasp at a joint position the drawer has not reached,
      and asking which contact balances a finger's squeeze, both read fields derived from a
      configuration rather than integrated from one.

  - id: AXM-robosuite-controller-cache
    domain: environment
    statement: >-
      robosuite 1.4.0's controllers compute from a cache of the arm's joint position, velocity
      and mass matrix that update() refreshes (after an mj_forward) only while the controller's
      new_update flag is set; run_controller sets the flag at its end. env.reset() rebuilds the
      controller, whose constructor fills the cache at the robot's init_qpos and clears the
      flag, before set_init_state moves the arm -- so the first control period after a reset
      computes its joint goal and its PD torque from that stale cache.
    rationale: >-
      Read from controllers/base_controller.py and measured by an independent reviewer on
      TaskEnv libero_goal 8, reset(0): the cached joint position was 0.0165 rad from the state,
      and a refresh on the first period changed its torque by up to 102 N m.

  - id: AXM-robosuite-gripper-target-persists
    domain: environment
    statement: >-
      robosuite 1.4.0's PandaGripper keeps its finger target (current_action, advanced by
      0.01 per substep toward the commanded sign) from the moment its model is built; a soft
      env.reset() sets the finger joint positions but not that target, so the fingers of a new
      episode are driven from wherever the previous episode's command left it.
    rationale: >-
      Read from models/grippers/gripper_model.py (set once) and robots/single_arm.py (reset
      sets finger qpos only); measured by an independent reviewer: from the same reset state
      and the same 26 mm target, the aperture after 6 steps was 42.5 mm when the previous
      episode ended open and 28.9 mm when it ended closed.

  - id: AXM-mujoco-integration-state
    domain: environment
    statement: >-
      MuJoCo's mjSTATE_INTEGRATION (mj_getState / mj_setState) holds everything of mjData that
      mj_step1 and mj_step2 read from one step to the next -- time, qpos, qvel, act,
      qacc_warmstart, ctrl, qfrc_applied, xfrc_applied, eq_active, mocap poses, userdata,
      plugin state -- so, for the same model and the same inputs, restoring it reproduces the
      steps that follow.
    rationale: >-
      MuJoCo's documentation of the state-component bits (mjtState); measured across processes
      and instances with the model's body poses equal (TRL-0217, TRL-0238).

  - id: AXM-parameters-derived
    domain: requirement
    statement: >-
      A threshold or weight in a design is taken from a declared source -- LIBERO's scorer
      (read from its objects, or probed through its predicates), the MuJoCo model (geometry,
      masses, inertias, damping, gains, limits), the bddl (goal and initial conditions), a
      definition in this file, or a measured distribution named with its measurement -- or it
      is a free parameter the design shows cannot change its optimum or its verdicts. A number
      chosen by hand to make a case pass is not admissible.
    rationale: >-
      The user's decision (2026-09-22): designs should limit hand-tuned parameters. That day's
      design pass refuted servo v2-v5 and the RL objective v1-v4 almost entirely on hand-picked
      bounds and weights (rate by period 3, within 2 periods, <= 40 N m, random 0.02 m/s kicks,
      seven reward weights), and found the skill teacher's squeeze thresholds tuned to a 0-24
      substep observation lag.

definitions:
  - id: DEF-reachable-pose
    term: Reachable pose
    meaning: >-
      A tool pose with a converged IK solution whose smallest singular value exceeds 0.05
      and whose every joint is at least 0.15 rad from its limit, with the arm not
      penetrating a fixture. This is the teacher's screen, a conservative stand-in for
      "trackable by the servo"; the servo's actual boundary is not claimed to be here.

  - id: DEF-holding
    term: Holding
    meaning: >-
      Both finger groups touch the target and the jaw aperture is stopped by it: neither
      near zero (closed on nothing) nor near fully open.

  - id: DEF-gentle-placement
    term: Gentle placement
    meaning: >-
      At release the object's lowest point is within 5 mm of the surface beneath it and its
      vertical speed is below 0.05 m/s.

  - id: DEF-smooth-motion
    term: Smooth motion
    meaning: >-
      Two clauses, one on what is commanded and one on what is executed, because they are
      different quantities. (a) COMMANDED, and enforced by the execution layer: over the episode
      the commanded twist changes by at most the servo's declared rate limits (sim/servo.py:
      2 m/s^2 in the linear part, 5 rad/s^2 in the angular, per control period), each period's
      joint goal is ramped linearly across the period, and the joint reference never leads the
      measured joints by more than max_lag -- so no step change in the commanded velocity reaches
      the arm, and no executed step in which no robot geom touches anything is a counted
      re-anchor, counted as BRN-servo-lead-scaled-uniformly counts it (a scaled step whose IK
      residual exceeds max_pose_err). Contact steps are excluded for the reason clause (b)
      excludes contact substeps, and on the same kind of evidence: a counted re-anchor is a
      tracking error, and an arm that presses a knob or carries an object accumulates one because
      the world resists the reference, not because the command was rough. Measured by replaying
      16 search episodes of libero_spatial (1826 executed steps, 924 re-anchors): 0.083 re-anchors
      per free-motion step against 0.597 per contact step, 7.2x, with 97.1% of all re-anchors
      falling on contact steps while contact is 82.3% of the steps. The distinction decides the
      keep-filter rather than decorating it -- under the clause as first written none of those 16
      episodes is keepable, and restricted to free motion 6 of 16 are. (b) EXECUTED, and measured over the substeps in which no robot geom touches
      anything: the tool's acceleration at the 2 ms physics substep has a 95th percentile over
      those substeps of at most 6 m/s^2. The acceleration at a substep is a second difference over
      three samples, and it counts as free motion only if all three are free: labelling it by the
      last sample alone admits the difference taken across the end of a contact, which is where the
      largest acceleration of the episode sits. That is not a detail -- replaying 16 spatial
      episodes, the last-sample mask fails this clause on 5 of them at 7.1 to 20.5 m/s^2 while the
      three-sample mask passes all 16, at a p95 between 2.4 and 5.2. Contact substeps are excluded
      because an arm pressing a
      knob or setting an object down accelerates since the world stops it, which is the task and
      not the motion -- on a settled search episode the free-motion figure is 4.5 m/s^2 against
      16.5 in contact, and contact is a third of that episode. The bound is the envelope of
      ramped free motion, not a limit of the grasp: over 20 skill-teacher episodes at this
      revision the free-motion episode p95 has median 2.9 and 90th percentile 6.1, against
      12.1 m/s^2 for the same measurement with the joint goal stepped rather than ramped
      (AXM-stepped-joint-goal-lunges); the distribution lives with CTR-teacher-smooth and
      CTR-servo-keeps-its-reference, which score this clause. It is not claimed that a held object
      slips above it -- LMA-grip-fails-by-contact-not-load says a grip fails through its contacts,
      not through the object's weight or the arm's accelerations.
    rationale: >-
      The previous statement set one number, 2 m/s^2, and applied it to the measured response.
      2 m/s^2 is the servo's limit on how fast the COMMANDED twist may change
      (BRN-execution-bounds-acceleration), which the execution layer enforces by construction and
      which does not bound the arm's response: that response carries the stiff joint controller's
      tracking and whatever the tool is touching. Measured over 80 recorded skill-teacher
      episodes, 5% have an episode acc_p95 at or below 2 m/s^2 (median 3.94, 90th percentile
      7.05, maximum 10.69), which is why CTR-teacher-smooth reads refuted and why the
      optimization teacher's keep-filter, which inherits this definition, kept nothing. The
      number in (b) is now sourced as a measured envelope of ramped execution and named as such;
      it excludes the worst decile of ramped episodes and rejects stepped execution outright.
      (a) states what the execution layer guarantees, and is the clause a design may cite as
      enforced rather than measured.

  - id: DEF-refusal-is-an-outcome
    term: Refusal is an outcome
    meaning: >-
      A refusal is a recorded annotation beside the scorer's verdict, not a replacement for it. The
      episode's outcome remains what the scorer says of the state the episode reached; a refusal
      additionally records that the planner stopped, the predicate that had no witness, and the level at
      which it was asked. This is a stipulation about bookkeeping, which is all a definition can be: the
      claims that an outcome is the scorer's and that no instrument supplies one belong to the axioms,
      and a branch relying on this term cites them itself. Refusals are counted and reported separately
      from failures over the same declared denominator, and no reported rate merges the two. A refusal
      says only that no witness was produced at that state -- by a query that found none, by a query
      that gave up inside its budget, or by a skill set containing no achiever. Which of the three it
      was is not decided by the refusal and is recorded with it. Not claimed: that a refused
      precondition is unachievable, since a conservative screen refuses states a forced attempt would
      solve, measured at 50 of 50 on one task; that a refusal rate measures coverage; that refusing is
      better than attempting; or anything about the scene a later episode begins in, which a reset
      restores and re-samples whatever the previous episode did.
    rationale: >-
      An earlier statement made a refusal a third kind of outcome, which contradicts the axioms that fix
      an outcome as the scorer's verdict and nothing else, and carried three claims it could not
      support: that flailing spends the horizon, that it disturbs the scene, and that a later attempt
      would otherwise find that scene as it was -- the last being false, since a reset re-samples
      fixture poses regardless. Annotation rather than outcome keeps the separation that makes coverage
      and reliability separately improvable without displacing the scorer.

  - id: DEF-witness-or-refusal
    term: Witness or refusal
    meaning: >-
      A geometric query the planner asks -- which grasp, which carry height, which touchdown pose,
      which handle approach -- answers in one of exactly two ways. It returns a candidate together
      with the predicate that candidate satisfies, or it returns nothing. It never returns its
      best-scoring failing candidate, and it never widens the predicate to make one pass. A
      precondition with no witness is a precondition that does not hold: the skill does not run,
      the planner records which predicate had no witness, and the episode ends unsolved rather
      than proceeding on a candidate known to fail. This is a property of the answer, not of the
      search that produced it -- a query may rank its candidates, relax its ordering or give up
      early, so long as what it hands back either satisfies the predicate it names or is absent.
      The point is that every caller may then assume the named predicate holds of whatever it
      receives, and a forced best-effort substitute silently withdraws exactly that. What the
      caller may assume is the screen, never more: DEF-reachable-pose disclaims being the servo's
      boundary, and LMA-whole-path-reachable is a negative lemma that supplies no predicate a
      finite query could witness, so trackability along a motion is not what any such answer
      carries. A query answers for the stations it names and for nothing between them.

  - id: DEF-skill-contract
    term: Skill contract
    meaning: >-
      A skill's preconditions, effects and postcondition, each a predicate on the current state --
      held(o), hand empty, uncrowded(o), graspable(o), admits(C, o), accessible(j), a free spot
      for o, and LIBERO's own In, On, Open, Close, TurnOn, TurnOff -- with the parameters the
      affordance table supplies (how a category is moved, held and set down). Every skill carries
      the same postcondition: when it ends the arm is disengaged from whatever it acted on --
      clear of that thing along the axis it approached along, and touching it nowhere.
      Disengagement belongs to the contract rather than to the body of any one skill, because the
      planner may follow any skill with any other, and a skill that leaves the arm entangled makes
      the next skill's preconditions unreadable from the state. A skill may not start while the
      previous skill's postcondition does not hold.

  - id: DEF-lean-period-reads
    term: What a lean control period reads
    meaning: >-
      Besides MuJoCo's integration state and the model, SimArm._advance and execute under
      Execution(lean=True) read, between control periods: the joint ramp's start, goal and k;
      the joint controller's joint_pos, joint_vel, mass matrix (in its stored memory layout) and
      new_update flag; the twist servo's ref, T_ref and V_prev; the gripper's current_action;
      and the command. The controller's goal is overwritten at each period's first substep,
      robosuite's clock is read only by env.step, and GripperServo carries no state between
      calls. Audited in the code (SimArm._advance and execute, TwistServo, GripperServo,
      JointRamp, robosuite's set_goal, run_controller, update and grip_action) by two
      independent reviews (TRL-0224, TRL-0239).

  - id: DEF-plan
    term: Plan
    meaning: >-
      The skill a regression over the skill contracts selects, at each control step, from
      the task's goal conjuncts and the current state: the first unmet conjunct in
      goal-relation order, then the first unmet precondition of the skill that achieves it,
      recursively, down to a skill whose preconditions hold.

lemmas:
  - id: LMA-whole-path-reachable
    statement: >-
      A motion segment fails if the servo cannot track some pose along it, whatever its
      endpoints are, so checking the endpoints of a segment is not sufficient.
    premises: [AXM-servo-tracks-reachable-poses]
    derivation_rule: >-
      The servo tracks each intermediate pose in turn; one unreachable intermediate pose
      triggers clamping and re-anchoring whatever the endpoints are.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-holding-is-geometric
    statement: >-
      Whether the jaws hold a handle must be decided from each finger group's press being borne by the
      handle's own geometry, and from an aperture the handle stopped -- not from contact with the body
      the handle belongs to. Both halves are needed and neither suffices: contact at body granularity
      cannot locate a finger on the handle at all, and contact with the handle cannot separate a grip
      from a graze, because the pads span a depth over which another feature of the same body may be
      what actually stops the jaws. This lemma requires that form of test; the thresholds belong to the
      claim that scores it.
    premises: [AXM-panda-gripper-geometry, AXM-handle-shares-body, DEF-holding]
    derivation_rule: >-
      AXM-handle-shares-body puts the handle and the face beside it on one body, so a body-level test
      cannot distinguish a grip on the bar from a palm laid on the drawer front -- it is not a stricter
      reading of the same test but a different question. AXM-panda-gripper-geometry gives the pads their
      16 mm of depth, which is what makes the second half necessary as well: within that span the jaws
      can rest on one feature while touching another, so a test asking only what is touched admits a
      graze. DEF-holding asks for an aperture the object stopped, and reading that as the handle bearing
      the press is what carries the requirement from contact to force without naming a number here.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-caches-reset-per-episode
    statement: >-
      Every decision the teacher caches -- grasp, handle frame, drop point, carry height -- is cleared
      at each episode boundary, so no label depends on an episode that ran before it.
    premises: [AXM-dagger-needs-markov-labels]
    derivation_rule: >-
      A cache that survives an episode makes the label depend on a previous episode, which
      AXM-dagger-needs-markov-labels forbids outright, so clearing at the boundary is necessary. It is
      not sufficient for a Markov label and is not claimed to be: within an episode a cached decision
      carries the state it was made at, so a teacher reading one is a function of that history and not
      of the current state alone. This lemma claims the boundary only; whether a within-episode cache
      can be reconciled with the axiom is a separate question it leaves open.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-seed-fixtures-per-init-state
    statement: >-
      Seeding numpy's global RNG before every reset, per initial-state index, makes the
      fixture poses a function of (seed, init index), identical when a state is settled
      and when it is replayed. (That whole episodes reproduce is measured, not derived:
      CTR-teacher-deterministic.)
    premises: [AXM-libero-resamples-fixtures, AXM-reproducible-measurement]
    derivation_rule: The fixture pose becomes a function of (seed, init index), identical at settle and replay.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-observers-read-only
    statement: >-
      A diagnostic must not cause a decision to be made: every read it performs returns a decision
      already taken or returns nothing, and no read has choosing as a side effect. This is a requirement
      on any assessment rather than a report about one; whether a given assessment meets it is a
      question of implementation fidelity, answered by a test and not here.
    premises: [AXM-reproducible-measurement, AXM-dagger-needs-markov-labels]
    derivation_rule: >-
      A diagnostic that chooses and caches a decision changes what the teacher then acts on, so the
      property must hold by construction and not by call order: every read a diagnostic makes returns
      the decision already cached or returns nothing, and no read has choosing as a side effect. An
      arrangement in which a diagnostic would choose whenever the cache is empty satisfies no ordering
      discipline that survives a change of caller.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-touchdown-from-paired-rays
    statement: >-
      Where an object first touches its support is where, over its footprint, the gap
      between its underside and the support below is smallest -- the touchdown tool pose is
      the current tool pose lowered by the minimum, over paired downward rays, of (underside
      height - support height), with the underside read from the object's geometry in its
      current in-hand pose. One support height minus one box bottom is that only when the
      support or the underside is flat across the footprint.
    premises: [AXM-grip-fixes-object-in-hand, AXM-support-scannable, AXM-object-geometry-known]
    derivation_rule: >-
      Rigid descent of a held object -- contact begins at the ray whose gap closes first; both
      heights per ray are in the state. Re-read while descending, since the grip holds only
      while it does not slip.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-contact-release-is-robust
    statement: >-
      If the touchdown estimate can err by more than DEF-gentle-placement's 5 mm, then
      releasing once the object rests on its support -- stopped by it, touching the intended
      support rather than a rim, a wall or another object, with nothing holding it touching
      first -- is gentle regardless of that error, and a release at a precomputed height is
      not. (A height release with an estimate good to ~3 mm is gentle too; which regime holds
      is a measurement of predicted vs actual first-contact tool heights.)
    premises: [DEF-gentle-placement, AXM-release-is-free-fall, LMA-touchdown-from-paired-rays]
    derivation_rule: >-
      A resting object has zero gap and about zero speed at release; a height trigger leaves
      the estimate error as a gap, i.e. free fall from it.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-pinch-clears-the-descent
    statement: >-
      A pinch lets its object reach the support only if the fingers and hand stay clear of
      the support, container walls and other objects along the descent to touchdown and at
      it -- checked with the ACTUAL in-hand pose after the grasp, since the object shifts when
      the pads close and a predicted pose can be off by that shift.
    premises: [LMA-touchdown-from-paired-rays, LMA-whole-path-reachable, DEF-reachable-pose]
    derivation_rule: >-
      Endpoint clearance is not path clearance (LMA-whole-path-reachable); the in-hand pose is
      known only once held.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-regression-selects-an-applicable-skill
    statement: >-
      Regressing from the first unmet goal conjunct through first unmet preconditions -- taking, where a
      predicate has more than one achiever, the first in the contract table's declared order -- and not
      revisiting a predicate within one descent, ends within the number of declared predicates at one of
      three places: a skill whose preconditions all hold, a predicate no declared skill achieves (a
      named gap, reported), or a predicate already visited in this descent, which is a regression
      circular at this state and is reported as such rather than followed. The skill it ends at is a
      function of the state and the goal. No acyclicity of the achiever relation is assumed: the bound
      comes from not revisiting, and a cycle in the relation shows up, at a state where it matters, as
      the third outcome rather than as a regress that does not end.
    premises: [DEF-skill-contract, DEF-plan, AXM-dagger-needs-markov-labels]
    derivation_rule: >-
      At each step of the descent the current predicate either has an achiever whose preconditions all
      hold (the first outcome), has no achiever (the second), or has one whose first unmet precondition
      is the next predicate; that predicate is either new, and the descent continues, or already
      visited, and it stops (the third). The three are exhaustive, and since each continuing step visits
      a predicate not visited before and DEF-skill-contract declares finitely many, the descent stops
      within their number. The earlier statement drew that same bound from an acyclic achiever relation,
      which this table does not have -- pick needs hand empty, which park achieves, and park needs held,
      which pick achieves -- so its antecedent was false and it entailed nothing. The cycle does no harm
      at a state where a skill on it can run: if the hand holds something and the goal needs it empty,
      park's precondition already holds and the descent ends there at the first outcome. Where it does
      harm -- two objects each crowding the other, so move-clear of either needs the other moved -- the
      third outcome names it. The descent reads which predicates hold now, the goal's conjuncts in their
      order, and the declared orders of preconditions and achievers; DEF-plan fixes those orders, and
      with them the skill it ends at is a function of the state and the goal. The goal is fixed for the
      episode, so this meets AXM-dagger-needs-markov-labels: no label depends on the episode's history.
      The achiever rule answers the gap recorded against DEF-plan, which assumed one achiever per
      predicate while uncrowded has two.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-hand-is-a-precondition
    statement: >-
      With one gripper, "hand empty" is a precondition of every skill that grips something
      new, drives a joint or pushes, and parking the held object (setting it down on a free
      spot of a surface it can rest on) achieves it; so a state where the current goal needs
      the hand while it holds something else regresses to parking that object, never to a
      step that cannot run.
    premises: [AXM-one-gripper, DEF-skill-contract, AXM-support-scannable]
    derivation_rule: >-
      AXM-one-gripper makes the hand a shared resource; declaring it as a precondition with
      park as its achiever puts every conflict over it on the regression chain.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-geometry-answers-predicates
    statement: >-
      uncrowded, graspable, admits, accessible and free-spot are computed from the geometry
      in the current state each step, with no per-episode cache in the test; a failed one is
      achieved by the skills whose declared effects make it true -- close the container that
      crowds an object or blocks a joint, move a crowded object or an obstacle clear -- chosen
      by the predicate, never by a list of tasks. Tests that depend on the held grasp are
      evaluated once the object is held, on the actual in-hand pose.
    premises: [AXM-object-geometry-known, AXM-support-scannable, DEF-skill-contract]
    derivation_rule: >-
      Everything these predicates depend on -- object and fixture geometry and poses, the
      in-hand pose once held -- is in the state (AXM-object-geometry-known); achievers are
      found by matching a predicate against declared effects.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-protected-progress
    statement: >-
      Goal conjuncts are tried in an order that respects the relations the goal set states
      (every fill of a container before its Close; a moved support before what is placed on
      it), and a skill whose declared effect would falsify an already-achieved earlier
      conjunct is not selected while the regression offers another; so the executor does not
      alternate between two skills that undo each other's goals.
    premises: [AXM-bddl-states-goals-not-methods, AXM-libero-scores-final-state, DEF-skill-contract, DEF-plan]
    derivation_rule: >-
      Effects are declared, so "would falsify an achieved conjunct" is checkable before
      selection; fill-before-close and support-first remove the two goal-stated conflicts.
      Conflicts over geometry (capacity of one region for two objects, access occlusion)
      are predicates to be added when a suite needs them, not covered by this ordering.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-grip-fails-by-contact-not-load
    statement: >-
      In these suites a grip fails through its contacts -- a thin pinch squeezed weakly, a
      pivot nothing resists, a pinch closing on edges or against the support -- not through
      the object's weight or the arm's accelerations; so grasp choice and grasp checking
      are about contact geometry, not load.
    premises: [AXM-objects-are-light, AXM-squeeze-is-a-spring, AXM-no-torsional-friction]
    derivation_rule: >-
      Loads are at most 0.31 N of gravity (and ~0.01 N of inertia under the 2 m/s^2 bound)
      against friction capacity in newtons; what remains are the contact failure modes the
      other two axioms describe.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-loss-needs-robust-evidence
    statement: >-
      A loss may be declared only on evidence that is not transient -- the fingers no longer
      touching the object, or the object far from where the jaws hold it -- never on an
      instantaneous velocity: declaring a loss makes the pick law open the jaws, so a false
      loss turns a grip into a drop, while a false hold only delays a regrasp.
    premises: [AXM-slip-spikes-are-transient, AXM-one-gripper, DEF-holding]
    derivation_rule: >-
      The error costs are asymmetric; measured, holding judged on instantaneous relative
      velocity took the teacher from 526 to 511 of 600 (spatial -7, goal -8: false losses
      mid-squeeze and mid-carry, the jaws opened, the bowl fell from 28 cm).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-smooth-in-execution
    statement: >-
      Tool motion is smooth (DEF-smooth-motion) when the execution layer ramps each period's
      joint goal linearly across the period, bounds how fast the commanded twist changes, and
      sizes its per-period joint clips for the lag a ramped arm has; and because every
      policy's action goes through that one layer unchanged, the teacher's label stays a
      function of the state and the student is executed the same way.
    premises: [AXM-stepped-joint-goal-lunges, AXM-robosuite-interpolator-hyperbolic, AXM-one-execution-path,
               DEF-smooth-motion]
    derivation_rule: >-
      A linear ramp removes the in-period step (AXM-stepped-joint-goal-lunges) where robosuite's
      interpolator does not (AXM-robosuite-interpolator-hyperbolic); a bound on the commanded
      twist's change removes the steps between periods; clips sized for a period of extra lag
      keep the reference from being dragged back and re-anchored.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-loss-lower-bounds-steps
    statement: >-
      For a single in or on conjunct covered by BRN-task-loss-core (so excluding libero_goal 3's
      slide-carried drawer region), let d(s) be the task loss's distance without M, rho_g(s) the tool
      point's distance to the nearest point of the moved object's LIBERO contact geoms, and v_max any
      upper bound on the tool point's path length within one control period. For any state s that LIBERO
      rejects, and any plan from s in which (i) the moved object's orientation when LIBERO first accepts
      equals its orientation at s, (ii) no body other than the moved object whose pose LIBERO's
      predicate for the conjunct reads moves -- for an in conjunct the target site's body, for an on
      conjunct the target site's body or target object and every body carrying the support's contact
      geoms, including jointed children such as a stove's knob or a cabinet's drawers, (iii) the moved
      object's pose changes only while the tool point lies within its contact geoms, and its origin
      never moves farther than the tool point meanwhile, the number of control steps until LIBERO first
      accepts is at least (rho_g(s) + d(s)/2) / v_max. Where LIBERO accepts at s the bound is 0. The
      conditions are idealized: taken exactly, they held on 0 of 290 rejected states in 14 scripted
      descents and on 0 of 50,234 rejected states before first acceptance in 245 successful
      skill-teacher episodes, so the lemma bounds idealized plans and gives no tolerant form. It asserts
      no value for v_max and no tightness.
    premises: [BRN-task-loss-core, AXM-object-geometry-known]
    derivation_rule: >-
      Restated after TRL-0235..0237 (counterexample and entailment sound): the vacuity figures corrected
      to '0 of 290 rejected states in 14 scripted descents' and '0 of 50,234 rejected states before
      first acceptance in 245 successful episodes' (the counted states named); (ii)'s headline worded as
      the reviewer read LIBERO's predicates (in reads the site's pose only; on reads the site or target
      object and the support's contact geoms); the looseness sentence removed -- it was wrong in
      direction (2x is the floor against executed steps, which ran 2.0 to 451 on near-in-scope states)
      and in scope (on conjuncts can be 2x loose too) -- replaced by asserting no tightness.
    sufficiency: {n_min: 3, min_consensus: 0.8}

branches:
  # ---- CMP-optimization-teacher: the general teacher: task loss, verdicts, exact restore, the search, pi_theta
  - id: BRN-teacher-policy
    subject: CMP-optimization-teacher
    claim_type: contract
    statement: >-
      Per task, pi_theta reads the teacher state of BRN-optimization-teacher
      (screwhead/teacher/state.py: the privileged state, with no clock and no step counter, its
      dimension fixed per task and recorded with the checkpoint), a per-arm specification (the arm's
      screw axes, joint limits and reach, declared with the arm), and the arm's feasibility signals at
      that state -- the smallest singular value of the body Jacobian and each joint's distance to its
      limit, both computed by the decode -- and emits, per plan segment, a normalized body twist (6,
      moment first) and logits over the student's snap levels. It is trained by the alternation of
      BRN-optimization-teacher: a search records the state it saw and the plan it chose; pi_theta is
      regressed onto those plans (squared error on the twist, cross-entropy on the level) over episodes
      that passed the keep-filter; the next round's searches start from pi_theta's plan; its weights are
      frozen before it labels or is searched around. Embodiment-freedom is claimed in this sense and no
      other. (1) The output carries no robot-joint quantity (BRN-screw-search (e)). It does not follow
      that one network's output means the same motion on two arms: a normalized twist is interpreted
      through that arm's declared tool frame and twist normalization, which on the Panda are robosuite's
      osc_pose scales at the grip site (BRN-screw-search (b)), and the level channel is a
      gripper-actuator quantity -- the snap levels are finger targets on the Panda's pads
      (AXM-panda-gripper-geometry) -- so a new arm transfers the output only with its own declared
      normalization, tool frame and aperture map. (2) Where an arm's singularities and joint limits are
      met is the decode, not the network: AXM-servo-tracks-reachable-poses gives tracking only where IK
      converges with room to move, and otherwise the joint reference is clamped and the servo
      re-anchors. Nothing here claims that limits are avoided along a trajectory, and nothing here rests
      on a null-space term, which acts only on redundancy and is identically zero for an arm whose
      Jacobian has no null space at the state. Limits and conditioning are screened per pose, before
      transfer, by the audit in (4), under DEF-reachable-pose as declared for the body Jacobian in the
      units screwhead's kinematics uses; another arm's reach makes that threshold a different physical
      margin, so the convention must be restated with it. (3) Which twists an arm can execute is arm-
      and state-dependent and is not claimed equal for two arms: on the Panda the servo's lead limit
      alone confines them to a state-dependent subset of the +-1 box (measured per state, TRL-0232), and
      a request outside it is scaled, not tracked (BRN-servo-lead-scaled-uniformly). (4) Neither a plan
      that settles on one arm nor pi_theta's weights are claimed to transfer. What transfers by
      construction is the objective (BRN-task-loss-core through BRN-optimization-teacher), the
      object-side verdicts, which carry no robot-joint quantity (BRN-teacher-verdicts, BRN-screw-search
      (e)), and the search procedure. A search on another arm meets that arm's singularities and limits
      as its own execution path does -- on the premise that BRN-execution-state-restore holds there,
      which is measured only on the Panda -- and only once that arm can be instantiated in this
      execution path at the Panda's mount, with a decode and gripper of its own; no premise here
      establishes that it can. Before any transfer is attempted, the poses a task needs (grasp, carry,
      place) are audited for the candidate arm under DEF-reachable-pose, because LIBERO's scenes are
      laid out for the Panda's workspace and another arm at the same mount may not reach them. (5) An
      infeasible request is executed as the servo scales it (BRN-servo-lead-scaled-uniformly), and the
      episode is kept only if it still ends settled and its executed trajectory satisfies
      DEF-smooth-motion, whose clause 'never abandons its pose reference' is read here as that branch's
      counted re-anchor -- a scaled step sets the pose reference to FK of the scaled joint reference and
      counts as a re-anchor exactly when its IK residual exceeds max_pose_err. No keep rate is claimed,
      and the filter is not claimed to be non-empty.
    premises: [BRN-optimization-teacher, BRN-screw-search, BRN-teacher-verdicts, BRN-servo-lead-scaled-uniformly, AXM-one-execution-path, AXM-dagger-needs-markov-labels, AXM-parameters-derived, AXM-servo-tracks-reachable-poses, AXM-panda-gripper-geometry, DEF-reachable-pose]
    derivation_rule: >-
      Restated after TRL-0247 (falsified), TRL-0248 and TRL-0249 (gaps), recorded from the
      consistency-verifier's declarations-only review; those trials verified the previous statement and
      no longer count. What changed, fault by fault. The falsified inference in clause (1) -- 'carries
      no joint quantity, so the same output is meaningful for any arm' -- is gone: joint-freeness is
      kept as the premise states it, and interpretation is made explicitly arm-relative, including the
      level channel, whose snap levels are Panda finger targets, so AXM-panda-gripper-geometry is now
      cited. The falsified clause (2) no longer claims that limits are handled: the null-space mechanism
      is dropped, since it is identically zero on a non-redundant arm, and the damped-least-squares step
      bound is dropped with it, since no declaration states the decode's IK method -- that branch is
      owed and is not assumed here. What remains is what AXM-servo-tracks-reachable-poses declares, plus
      per-pose screening by the audit, with DEF-reachable-pose's unit dependence named rather than
      glossed. Clause (4) qualifies the transfer the verifier found unstated: exact restore is premised,
      not proven, off the Panda, and instantiability at the mount is named as unestablished; the
      verdicts are cited by id now that BRN-teacher-verdicts is restated and declared. Clause (5) drops
      'needs no special handling', identifies DEF-smooth-motion's abandonment clause with
      BRN-servo-lead-scaled-uniformly's counted re-anchor so the two predicates are one by declaration
      rather than by hope, and states outright that no keep rate is claimed -- the negation probe's
      point that the clause is cheap stands, and it is better stated cheaply than falsely. Undefined
      terms are replaced by their content: 'screwhead's robot-specification tokens' by the arm's screw
      axes, joint limits and reach; the state's dimension is recorded with the checkpoint rather than
      written into the claim. Measurements stay out: the executable-subset figure is cited to its trial,
      and the evidence for pi_theta itself belongs in component-belief under CMP-optimization-teacher,
      which still has no contract. Files: screwhead/teacher/state.py (the input, built),
      screwhead/teacher/policy.py and tools/teacher_train.py (the network and the fit),
      checkpoints/teacher/SUITE_TASK.pt (the weights, with the state's layout and the search settings
      beside them). Not claimed: that pi_theta alone reaches settled success, or that a search started
      from it beats a search from zero (Q9); that regression on kept episodes suffices rather than
      iterated relabelling; that any arm passes the audit or that the search settles on it (Q8, measured
      in that order -- audit pass rate per arm and task, then the search's settled rate, then
      pi_theta's). evidence: CTR-search-settles, which measures the alternation this claim is part of;
      pi_theta's own contract is owed once policy.py exists.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-task-loss-core
    subject: CMP-optimization-teacher
    claim_type: contract
    statement: 'The task loss sums over the bddl''s goal conjuncts a term that is 0 when LIBERO''s own predicate accepts the conjunct (the _eval_predicate that _check_success conjoins) and otherwise d + M, M any positive constant. For an in or on conjunct d = a + b: (a) the moved object''s origin to the predicate''s box or band, read from the site''s live pose and size or the support''s origin; (b), where the predicate requires contact and LIBERO sees none, the exact separation between the two bodies'' LIBERO contact geoms (all boxes in these tasks, with margin and gap 0). For an open, close, turnon or turnoff conjunct d is the joint''s distance to its threshold in the joint coordinate. The tolerances d uses are LIBERO''s own -- joint thresholds and directions read from its objects, the on-top radius, band heights and containment slack found by probing its predicates (the shapes of its tests, box, band frame and disc, follow its code) -- and nothing is keyed by task. For the 30 tasks, each of whose goals has a single conjunct, and excluding an in-region carried by a slide joint: the loss is 0 exactly when LIBERO accepts, and M changes neither that nor how rejected states compare; for in and on conjuncts, d is also 0 on LIBERO''s strict boundaries and where MuJoCo misses a contact between deeply overlapping thin boxes with the origin inside the box or band, d is continuous on rejected states and at most twice as steep as the object''s translation, and d / 2 <= max(a, b) <= D*, where D* is the rigid translation the object needs, at its current orientation, to reach a pose LIBERO accepts; for joint conjuncts, d is continuous, 1-Lipschitz and monotone in the joint coordinate. Not claimed: that d orders placements by D*. Not covered: an in-region carried by a slide joint (libero_goal 3''s drawer); obstacles, which d ignores; goals with several conjuncts, where M adds a step at each conjunct''s acceptance, so its value changes comparisons and needs a declared source.'
    premises:
    - AXM-parameters-derived
    - AXM-bddl-states-goals-not-methods
    - AXM-libero-scores-final-state
    - AXM-libero-joint-bands
    - AXM-object-geometry-known
    derivation_rule: >-
      Restated after a confirmation review whose bound measurements all held on the 30 tasks (max(a, b)
      <= D* to 2e-16 m over 2,100 targeted states and 58,780 LIBERO-checked poses; its premise --
      contact implies exact separation <= 0, margin = gap = 0 on all 7 contact pairs -- over 39,875
      near-contact states; slope <= 1.9058 over 197,040 pairs; no hidden underestimate in 300 small-d
      states) and found two scoping faults: M's invariance holds only for single-conjunct goals
      (libero_10 task 0's two conjuncts flip at M = 0.1474), now scoped to the 30 and named for
      libero_10; the slope and D* clauses hold only for in/on conjuncts, joints getting their own
