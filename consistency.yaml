    premises: [AXM-category-affordances-declared, AXM-object-geometry-known, AXM-support-scannable,
               AXM-panda-gripper-geometry, DEF-reachable-pose, LMA-whole-path-reachable,
               DEF-witness-or-refusal, DEF-refusal-is-an-outcome, AXM-libero-scores-final-state,
               AXM-instruments-do-not-decide, DEF-skill-contract]
    derivation_rule: >-
      A verifier refuted the earlier statement's "so that the leading finger lies inside o's rim":
      a fixed fraction of the radius and a fixed opening do not scale, and a 110 mm dish would put
      the finger on its edge. The scope now states the size condition. The affordance table declares
      the plate moved_by push: it is 137 mm across against the gripper's 75 mm opening, and picked
