  - id: BRN-scan-then-place
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Every step of a place after its carry falls in exactly one of three cases, read from that step's
      state and the place's drop point, in this order. (R) The object rests on its intended support
      (DEF-resting) with its origin inside the goal region; or the jaw aperture is increasing; or the
      jaws are wider than the object along the jaw axis; or the aperture is at its fully open stop: the
      jaws are commanded fully open, and the tool straight up at the retreat speed if the jaws are wider
      than the object or at the fully open stop, else held still. (F) Otherwise, the object touches no
      body other than the robot: the jaws are commanded to hold it and the tool moves toward the drop
      point's descent, its linear speed no greater than the lower speed and no greater than
      sqrt(2 a max(c_s, 0)), c_s the clearance (LMA-clearance-bounds-motion) between the object and its intended
      support and a the servo's linear change bound while holding (BRN-execution-bounds-acceleration).
      (T) Otherwise: the jaws are commanded to hold it; while its tilt drop (the height its lowest box
      corner stands below its bottom face's centre) exceeds the lower phase's tolerance the tool goes
      down at a speed no greater than sqrt(2 a d), d that tilt drop, and otherwise straight up at the
      lower speed. Claimed: (1) every step falls in exactly one case; (2) the jaws are commanded open
      only in case R, and case R never commands them toward closed, so neither a flicker of holding, an
      opening that disturbs the object, nor an object wider than the open jaws brings them closed again
      while any of R's conditions holds; (3) every command is read from that step's state and the
      place's drop point. Not claimed, and named: that the object touches nothing but its support while
      lowered -- the servo's lead (AXM-servo-lead-bounds-travel, up to 34 mm) makes a clearance bound
      for that a future branch with a bounded-lead servo near supports; that lowering rights every
      tilted object; that case T's lift leads to a later rest; supports whose normals lie outside the
      friction angle (the wine rack's cradle); that the resting pose is within LIBERO's humans' tilt;
      that the retreat touches nothing; slip in the grip; that the drop point, chosen once per episode,
      is re-derivable from a later state; the provenance of the rest speed and the change bound.
    premises: [DEF-resting, LMA-contact-release-is-robust, LMA-release-when-resting-stays,
               LMA-clearance-bounds-motion, AXM-static-stability, AXM-libero-contact-parameters,
               AXM-servo-lead-bounds-travel, BRN-execution-bounds-acceleration, BRN-carry-turns-object-to-fit,
               AXM-libero-objects-are-boxes]
    derivation_rule: >-
      The release logic of the three placement rules measured on 2026-09-24, restated three times
      under the verifier. The cases are tested in order, so they are exclusive, and T is the remainder,
      so they are exhaustive -- an object resting with its origin outside the region falls in T and is
      lifted. R holds on an opening aperture, on jaws wider than the object, and at the fully open stop,
      so the chatter that lifted libero_90 77's book 5 cm -- holding flickering back as the jaws opened --
      and a rim-pinched bowl wider than the open jaws both stay in R. F admits contact with the palm or
      fingers only. DEF-resting, from AXM-static-stability, the measured friction and the objects' box
      shapes, says when a touch is a place to let go: a pot on one corner is not resting (its contacts
      have no hull with an interior) and T lowers on while it is tilted, which
      rights it (the moka pot, 14 of 20 only when pressed on); a bottle standing on the basket's floor
      rests. LMA-release-when-resting-stays and LMA-contact-release-is-robust make a release in R, once
      nothing but the support touches it, leave it at rest and unfallen. A stopping guarantee against
      other bodies was withdrawn: the tool follows the servo's reference, up to 34 mm ahead of it, not
      the commanded twist (AXM-servo-lead-bounds-travel). When built it replaces the second ground of
      BRN-place-onto-physical-support and its handle-held exception. Not yet implemented. evidence:
      CTR-teacher-settled, CTR-teacher-gentle (release_gap_mm <= 5).
    sufficiency: {n_min: 3, min_consensus: 0.8}

