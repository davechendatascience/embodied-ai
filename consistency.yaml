  - id: BRN-servo-reference-bounded
    subject: CMP-twist-servo
    claim_type: contract
    statement: >-
      TwistServo bounds its pose reference as it bounds its joint reference: whenever the joint
      reference is clamped (the lead limit, a joint limit, or an arm held back by contact), the
      pose reference is reset to the pose the clamped joint reference reaches, so it never
      leads the arm by more than the lead limit, and once the obstruction clears a commanded
      twist moves the tool within one period instead of first unwinding an accumulated lead.
    premises: [AXM-servo-tracks-reachable-poses, AXM-one-execution-path]
    derivation_rule: >-
      (to be implemented) Measured by an independent reviewer: after 15 steps pressing into
      contact at 0.1 m/s the pose reference sat 78 mm below the tool with 0 re-anchors, and a
      +0.05 m/s command for 12 steps moved the tool -0.7 mm, against +26.3 mm with the
      reference re-anchored. The re-anchor test compares the pose reference with the
      unclamped IK solution (servo.py:114-120) while only the joint reference is clamped
      (servo.py:122). evidence: that probe re-run, and CTR-teacher-reliable /
      CTR-teacher-smooth re-certified, since every policy executes through the servo.
      Independent review falsified it: the lead limit is 0.1 rad per joint, so FK of the
      clamped reference still left the pose reference 30 mm below a blocked tool, recovery
      after pressing moved -0.2 mm in 12 periods (a perfect re-anchor +28.5 mm), and per-joint
      clipping writes a direction error into the reference (2.0 mm over an open-loop +x move).
      It also found the windup in free motion: libero_spatial 0 episode 0's carry left the
      reference 71 mm ahead of the tool with 0 re-anchors before joint 4 surged to 1.91 rad/s.
      Superseded by BRN-servo-lead-scaled-and-unwound.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-servo-lead-scaled-and-unwound
    subject: CMP-twist-servo
    claim_type: contract
    statement: >-
      TwistServo keeps its references within one period of the arm: (a) when the IK step would
      make the joint reference lead the measured joints by more than the lead limit (0.1 rad on
      some joint), the whole lead is scaled down uniformly, ref = meas + s (theta - meas) with
      s = limit / max|theta - meas|, and the pose reference is set to FK(ref), so the lead keeps
      its direction and the pose reference is always the pose the joint reference reaches; (b)
      every step, if the lead is at that limit and the measured joint motion along it over the
      last period is below a fraction of what the lead commands, the arm is blocked, and both
      references are re-anchored at the measured joints and the rate limiter's twist is set to
      the tool's measured twist. Then the joint reference never leads the measurement by more
      than 0.1 rad per joint at command time, and after an obstruction clears a commanded twist
      is followed at the commanded rate from the third period.
    premises: [AXM-servo-tracks-reachable-poses, AXM-one-execution-path]
    derivation_rule: >-
      (to be implemented) Uniform scaling kept an open-loop +x move straight (drift 2.0 -> 0.0
      mm, reviewer's probe); a re-anchor only on binding steps let the lead grow back to 0.065
      rad between binds (first motion at period 9), hence the every-step blocked test; the
      rate limiter would otherwise hold the pre-block twist and reverse at 0.1 m/s per period.
      Scale resets and blocked re-anchors are counted apart from the existing reanchors (which
      CTR-teacher-smooth requires to be 0). To check: no false blocked trigger when a motion
      starts from rest; squeezes and the drawer drive (which never bound the clip in the
      reviewer's episodes) unchanged. evidence: the reviewer's pressing probe re-run,
      CTR-teacher-reliable and CTR-teacher-smooth re-certified.
      Independent review falsified the recovery clause: gating the blocked test on the lead
      being AT the limit let windup below it survive (a 15-step press ended with a 0.033 rad
      lead, the pose reference 10.6 mm below the tool; the commanded rate came from period 8,
      9 or later, never 3 unless a re-anchor happened to land one step before), and the
      detector, one period stale, once drove the tool -2.54 mm against the command. The lead
      bound held; the teacher was not worse (libero_goal 7: 153 -> 135 steps, substep
      acceleration max 29.6 -> 7.8 m/s^2). Superseded by BRN-servo-lead-unwound-when-not-followed.
    sufficiency: {n_min: 3, min_consensus: 0.8}

