    premises: [BRN-handle-tier-for-handled-objects, BRN-pinch-leans-when-upright-unreachable, AXM-category-affordances-declared]
    derivation_rule: >-
      libero_10 9's yellow-and-white mug goes into the microwave only by its handle: the humans take it so
      in 8 of 8 demonstrations, leaned 36-59 deg, and with its leaned handle pinch the teacher went 0 ->
      45 of 50 (v40). Declared held by its handle outright, the handle tier came first everywhere, and its
