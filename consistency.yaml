      the regrasp after a drop with nothing held (a verifier's counterexample). Five periods of grace
      is chosen, not measured against the flicker's own distribution; with it, no episode outside
      libero_goal 3's changed over 1500 against the latch. It is execution state like the previous commanded twist, and
      BRN-execution-state-restore's saved fields must include it. The values are measured, not
      derived, on the same seeds: bounding every
      period at 1 m/s^2 took libero_goal 9 from 1 to 50 of 50 but libero_spatial from 478 to 447,
      the approach overrunning its phase switches (spatial 3, 6 and 8 lost 31 episodes), and a
      braking cap in the teacher did not recover them; 0.5 m/s^2 in every period removed most of the
      bowl's mid-carry drops and lost more episodes still. Bounded only while the jaws hold
