      substep fewer than for a loss seen mid-period, because that state is read again before the count
      advances -- is judged at the moment of loss: a violation if its lowest contact-geom point was more
      than 5 mm above the first collidable surface straight beneath it, or its centre of mass was moving
      vertically, in either direction, faster than 0.05 m/s. A loss still open is undecided until
      finish() judges it; fork() copies the watch for a rollout. DISTURBANCE: a movable body the goal
      does not name has a support (the root body bearing the largest upward share of its weight through
      contact forces, -1 when none) and a body-frame face most nearly down (changing at a 45 degree
      tilt), and is disturbed when that pair matches none of the references it is given; the caller
      passes both the episode start's and the previous period's references, since a body knocked earlier
      makes the start's pair alone miss a fresh knock. LOST: a moved object's centre of mass below the
      arena's support surface. Parameters: 5 mm and 0.05 m/s are DEF-gentle-placement's; the free-fall
      window follows from them, gravity and the timestep; the inscribed 8-edge pyramid is a
      construction, conservative against MuJoCo's contact softness by measurement rather than by
