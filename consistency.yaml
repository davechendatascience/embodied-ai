  - id: BRN-regression-planner
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A skill teacher designed to act by regression over declared contracts, re-run every control
      step: pick(o) {hand empty, graspable(o)} -> held(o); place(o, R) {held(o), admits(R, o)} ->
      In/On(o, R); drive(j, mode) {hand empty, accessible(j), and when opening, clear_of(o, j) for every
      object o the goal still has to grasp} -> the joint's predicate; park(o) {held(o)} -> hand empty,
      o resting on a free spot where clear_of(o, j) holds for every container j the goal still has to
      open. clear_of(o, j) is achieved by pick(o) then park(o), each re-derived from the state at every
      step: whichever of drive's preconditions the regression meets first, the park it reaches puts o
      where clear_of holds, so no separate move-clear skill is needed and none is declared. When no free
      spot where those clear_of hold is found, park refuses, naming 'a free spot for o'. The goals and
      the affordance table supply the parameters, and the predicates read the state and the
      configurations the plan will reach, as LMA-geometry-answers-predicates says. The skill set is
      closed at those four. Not built: the teacher that runs walks a fixed skill sequence per goal with
      one special case that moves an object clear before opening, and no measurement here is of this
      design. When
      the regression reaches a predicate that no declared skill's effect entails, it refuses, naming
      that predicate, and runs no other skill in its place; the refusal is recorded beside the scorer's
      verdict. In the current scope this happens for admits(R, o), which drive's effect -- the joint's
      predicate -- does not entail; for accessible(j), which no declared effect entails; and for
      graspable(o) wherever LMA-geometry-answers-predicates gives it no achiever -- regrasping and
      reorienting are not covered; and for a free spot for o where park finds none. Not claimed: that the regression terminates, or selects uniquely, for
      this table; or what the teacher does when the regression is circular at a state. Scope: the
      predicates libero_object, spatial and goal and libero_10's put-in-drawer-and-close need; not yet
      covered: pushing or sliding without a grasp, two objects into one region, enclosed regions, access
      occlusion, reorienting or regrasping an object.
    premises: [LMA-regression-selects-an-applicable-skill, LMA-geometry-answers-predicates,
               DEF-skill-contract, DEF-refusal-is-an-outcome, AXM-bddl-states-goals-not-methods,
               AXM-libero-scores-final-state, AXM-instruments-do-not-decide]
    derivation_rule: >-
      A verifier refuted the previous table: move-clear(o, j) was pick then a park where clear_of held,
      but after its pick the regression met drive's 'hand empty' first and reached the plain park,
      whose spot nothing tied to clear_of, so the object could go back where it was and pick and park
      repeat. Giving every park the clear_of constraint makes the phase the regression happens to reach
      the right one, and leaves move-clear nothing to add. DEF-skill-contract's gate, restated to range
      over what was released and not grasped since, lets place(o) start after o was parked and picked
      again. DEF-skill-contract gives the table, and restated it replaces uncrowded with clear_of. That removes
      the circularity an older table had: moving a crowded object clear began by picking it, and pick
      required uncrowded -- the very predicate the move existed to achieve -- so it always ended at the
      lemma's third outcome. clear_of(o, j) is now a precondition of opening j rather than of picking o,
      and achieving it begins with pick(o), which needs only graspable(o); that holds while j is still
      closed, so achieving clear_of no longer requires itself.
      LMA-geometry-answers-predicates is cited again for how the geometric predicates are read and which
      achievers they have. LMA-regression-selects-an-applicable- skill gives the procedure and its three
      outcomes -- a skill that can run, a predicate no declared skill achieves, or a regression circular
      at this state -- and the refusal is the second of them. The lemma bounds the descent by not
      revisiting a predicate rather than by an acyclic achiever relation, but it is DOUBTED on how it
      binds an achiever's free arguments, so the branch claims neither termination nor unique selection,
      nor what happens at the third outcome, which is none of the refusals DEF-refusal-is-an-outcome
      names. park's spot is bound by the clear_of predicates the goal still needs of o -- each names o and
      its container -- which is one of the bindings that lemma asks for. AXM-bddl-states-goals-not-methods fixes the
      goal language. LMA-hand-is-a-precondition and LMA-protected-progress are refuted and are not
      cited: the branch does not claim that the hand regresses safely to parking or that the executor
      never alternates, and those belong to the lemmas' repair. AXM-libero-scores-final-state and
      AXM-instruments-do-not-decide are cited because DEF-refusal-is-an-outcome is a stipulation about
      bookkeeping and says a branch relying on it cites them itself. evidence: none -- not implemented;
      CTR-teacher-reliable and CTR-teacher-attempts measure the sequence-walking teacher that runs.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-swing-door-as-the-humans
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The articulate skill drives the microwave's door -- the fixture of category microwave, a hinge --
      without a grasp, in either mode. At each control step of that drive it reads from that step's state,
      through the forward pass (AXM-mujoco-forward-is-a-function-of-state): the door's joint angle q, its
      hinge axis and anchor, the door body's pose and its geoms, and the tool's pose (the arm's forward
      kinematics). It commands the jaws fully open and the tool toward one target pose. The target is
      built from one of three declared tables, each a list of entries (a door angle, a tool point and tool
      axes in the door body's frame): for opening, the front-side table while q has not reached the angle
      of that table's entry farthest open and the tool point is on the handle's side of the panel's face
      (its least coordinate along the door frame's y axis), else the behind-side table; for closing, the
      closing table. 'The entry nearest an angle' is the chosen table's entry whose angle is nearest it,
      ties going to the entry nearer the table's closed end; an entry 'carried at' an angle is its pose in
      the door body's frame, placed in the world by the door's present pose turned about its hinge axis
      through its anchor by that angle minus q. The tool is engaged when it is within a declared
      engagement distance and turn of the entry nearest q carried at q. Not engaged, the target is the
      entry nearest q carried at q; engaged, it is the entry nearest q + lead carried at q + lead, the
      lead a declared angle in the drive's direction. The command toward the target is given by one rule
      of the tool's pose, the target and the top of the door's geoms, with 'the plane' a declared height
      above that top and 'below' meaning more than a declared band below the plane: when the tool point is
      laterally within a declared funnel of the target, or below and laterally within a declared column
      distance of it, toward the target itself; otherwise, when below, straight up to the plane; otherwise
      -- at or above the plane's band -- across to the point on the plane above the target. Claimed: (1)
      no control step of this drive commands the jaws closed; (2) the command at every step is a function
      of that step's state, the skill's arguments (the fixture and the mode), the declared tables and the
      declared constants; (3) every target is an entry of the chosen table carried at q or at q + lead.
      Not claimed: that the door moves, or reaches LIBERO's threshold for the mode (measured in
      component-belief); that the tool is clear of the door when the drive ends; that the path is free of
      contact; that a table's entry is a pose any one human held; that an object in the door's sweep is
      moved first.
    premises: [AXM-libero-joint-bands, AXM-object-geometry-known, AXM-bddl-states-goals-not-methods,
               AXM-mujoco-forward-is-a-function-of-state]
    derivation_rule: >-
      The teacher grasped the door's handle and carried the grasp along the hinge's arc; the grasp slipped
      at -0.41 rad (libero_90 35 init 0; LIBERO's Open holds below -1.3), and in the teacher-alone sweep
      v25 'open the microwave' succeeded in 0 of 50, 'close the microwave' in 27. LIBERO's humans never
      grasp this door (no grasp recorded in any of the 50 demonstrations of opening): their palm catches
      the handle's bar from behind its outer end, past the door's free edge, and drags the door to about
      -0.8 rad; they go over and behind the panel and push it on; they close it from the handle's side;
      the jaws are open (80 mm) in every recorded bin. The tables are those poses, binned by the door's
      angle (tools/door_survey.py, screwhead/teacher/door_swing.json; tests/test_door_swing.py holds every
      table the law chooses non-empty and sorted). Led from the first step instead of engaged first, the
      palm came down in front of the bar and pushed the door shut. With the law, 10 of 10 episodes of each
      (inits 0-9, the teacher alone) succeeded. The scope is the microwave by category because its tables
      are the microwave's. Verified 3/3 (TRL-0628..0630) after three restatements (a refuted scope and
      lookup, two gaps on the state's inputs and the approach rule).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-place-enters-roofed-target-level
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Vertical is the world's z axis and 'in plan' is the projection onto the world's horizontal plane;
      poses, the arm's joint positions and the scene's collision geometry are read from each step's state
      (AXM-grip-fixes-object-in-hand, AXM-mujoco-forward-is-a-function-of-state); the arm's joint ranges
      are constants of its model. At every control step of a place at which the object is held, given the
      placed object, the place's drop point in plan, the region's box (its centre, axes and half-extents)
      and the place's carry height, the skill decides whether the target is roofed and how to enter it.
      The object's pose in the tool's frame is read from the step's state; 'carried at' a tool frame F
      means the object at that pose relative to a tool with frame F. Its rest height at a point, carried
      at F, puts its lowest point a declared clearance above the first surface met straight down, from the
      region's centre height, under its box centre when its origin is at that point in plan, the object's
      own body excluded; where that ray meets nothing it has none. The downward frame has its approach
      straight down and its jaw axis the tool's present jaw axis projected onto the horizontal plane and
      normalised (the world's y axis where that projection vanishes). Carried at the downward frame, the
      object's most upright axis is the one of its box's axes nearest the vertical, ties to the first; its
      height is twice its half-extent along that axis; its level axes are the other two; its reach is its
      largest level half-extent plus a declared margin; its resting bottom at the drop point is its rest
      height there less the depth of its lowest point below its origin, and its top is that bottom plus
      its height. Where it has no rest height at the drop point, the target is not roofed at that step.
      The target is roofed at a step when some colliding geom other than the robot's and the object's,
      with its bottom below the carry height plus the height, either lies within the reach of the object's
      centre at rest in plan with its bottom above the object's top, or lies over that centre in plan with
      its bottom above the resting bottom plus the clearance; the roof is the lowest bottom among those
      geoms. The object is laid when the roof lies below its top plus the clearance. The directions are
      the region's box axes within a declared angle, below a quarter turn, of horizontal, each projected
      onto the horizontal plane and normalised, in the order of the region's axes, each with + before -.
      The wrist order of two tool frames puts first those the last joint reaches within its range less a
      declared margin -- its present position plus the frame's turn, the angle whose tangent is the y over
      the x component, in the present tool frame, of the frame's first axis (zero where both vanish) --
      then the smaller angle of the rotation from the present frame, ties to the first. For a direction u,
      when the object is not laid, the entry frame is the present tool frame turned about the vertical by
      the signed angle from the horizontal projection of the object's longest level axis (ties to the
      first) to u, less a half turn toward zero where its magnitude exceeds a quarter turn; its along
      half-extent is that longest level half-extent, its across half-extent its least level half-extent,
      and its rest height, bottom and top are those at the downward frame. When it is laid, for the pitch
      angles a declared lay pitch, below a quarter turn, times 1, 0.75, 0.5, 0.25 and 0, in that order,
      the pitch's frame has approach cos(pitch) times -u minus sin(pitch) times the vertical, and is the
      first under the wrist order of the two frames whose jaw axis is the vertical's, or its negative's,
      component orthogonal to that approach, normalised, and whose first axis is the jaw axis crossed with
      the approach; the entry frame is the first pitch's frame at which the object, carried at it, has a
      rest height at the drop point and its bottom there plus its vertical extent (twice the half-extent
      of its box projected onto the vertical) plus the clearance is at or below the roof; where none is, u
      has no entry frame. A laid object's along and across half-extents, at the entry frame, are its box's
      half-extents projected onto u and onto the horizontal normal to u, and its bottom and top are its
      rest height there less the depth of its lowest point, and that bottom plus its vertical extent. For
      the entry frame, the entry point E is the drop point at the entry's rest height moved along u by the
      distance, along the region's axis, from the object's box centre at rest to the region's face on u's
      side (zero if negative), plus the along half-extent, plus a declared margin. The object is in u's
      corridor when the tool point lies behind the drop point along u -- its offset from the drop point in
      plan has a component along u at least the length of its component across u -- and the object's
      origin is within a declared distance, in plan, of the line through the drop point along u, from that
      distance before the drop point to that distance beyond E, and no higher than E plus a declared band.
      A direction with an entry frame is kept when the object is in its corridor, or else when a disc of
      the across half-extent plus a margin, swept level in plan from the object's box centre at rest to
      that centre moved as the origin is to E, over the height band from its bottom plus the clearance to
      its top, meets no colliding geom other than the robot's and the object's. Taken is the first
      direction with an entry frame, in the order above, whose corridor holds the object; if none does,
      the kept direction whose moved centre is nearest the robot's base in plan, ties to the first in that
      order. 'Over' a point means within a declared distance of it in plan. For a roofed target with a
      direction taken, at a step at which the object is held, the place's drop point is at the entry's
      rest height -- which replaces the region-derived target height in BRN-place-onto-physical-support's
      first ground and, for the delivered test, is what the recorded point below carries; the carry height
      and the grasp screen keep the region-derived height -- and the command is, by four cases: (a) in the
      corridor and not over the drop point, the tool's translation along the offset from the object's
      origin to the drop point at that height; (b) not in the corridor, over E and above E's height plus
      the band, the tool's translation along the offset from the object's origin to E; (c) otherwise not
      in the corridor, the place's own slide and lift, their rotation goal unchanged, and its carry, with
      E as their destination; (d) in the corridor and over the drop point, the place's own lower and
      release toward the drop point at that height (BRN-place-onto-physical-support). The commands of (a)
      and (b), the carry and the lower turn the tool toward the entry frame. At every step at which the
      place finds the object held, it first clears the records below; when it then commands the release
      with a direction taken, it records, for the object and region, the drop point at the entry's rest
      height, and a withdrawal: a direction -- u, or -u when the entry frame's approach lies within 45
      degrees of level (a laid object) -- and the tool point then moved along that direction by E's
      distance from the drop point; both records are also cleared at an episode's start. While the object
      is not held and a release is recorded, the place's target -- what its delivered test reads -- is the
      recorded point. While a withdrawal is recorded and no placed object is held, the retreat commands
      the tool, its rotation goal unchanged, toward the point level with it along the withdrawal's
      direction at the withdrawal point's distance along it, until that distance is within the over
      distance; then it clears the withdrawal and retreats as before. A target not roofed at a step, or
      roofed with no direction kept, is placed at that step as before. Claimed: (1) at every step at which
      the object is held, the target is roofed, a direction is taken, and the object is in that
      direction's corridor and not over the drop point, the tool is commanded along the offset from the
      object's origin to the drop point at the entry's rest height; (2) at every step at which the object
      is held, whether the target is roofed, whether the object is laid, which direction and entry frame
      are taken, and which of the four cases (a) to (d) applies are functions of that step's state, the
      placed object, the drop point, the region's box, the carry height, the arm's joint ranges and
      declared constants; (3) for a laid object with a direction taken, the object carried at the entry
      frame at its rest height at the drop point has its top, plus the clearance, at or below the roof of
      that step; (4) while a withdrawal is recorded, no placed object is held and the withdrawal point's
      distance along its direction exceeds the over distance, the retreat's commanded translation has no
      vertical component; (5) the drop point in plan is the place's own. Not claimed: that the object
      reaches the corridor; that the roof, the laid decision or the direction stay the same while the
      object is in the corridor; that the tool reaches the entry frame or tracks the commanded height;
      that the hand or arm clears the roof, the table or other objects; that the object fits the opening
      across its width, rests level, or stays in the region after release; that the withdrawal leaves the
      object undisturbed; anything of the place's own lift, carry, lower and release beyond what
      BRN-place-onto-physical-support states.
    premises: [BRN-place-onto-physical-support, AXM-object-geometry-known, AXM-grip-fixes-object-in-hand, AXM-mujoco-forward-is-a-function-of-state]
    derivation_rule: >-
      Every roofed target in LIBERO failed for the teacher, whose place comes straight down over the drop
      point: the shelf's two layers (libero_90 40, 42, 86, 88, 89: 0 of 50 each in the teacher-alone sweep
      v26) and the microwave's heating region (libero_10 9, 0 of 50). LIBERO's humans enter each of them
      level, along the region's horizontal y axis (the object's path over its last 12 cm before release:
      medians 0.92, 0.98, 0.88, 0.92 and 0.98 of the unit direction, 20 demonstrations each). The first
      statement (entered upright, turned about the vertical) brought libero_90 40 to 10 of 10 and 42 to 6
      of 10 (inits 0-9) and left the books at 0: counting only what lay above the object's top at rest,
      the roofed test did not count a roof the standing book is taller than -- hence the band from its
      resting bottom; counted within the reach at any height above that bottom, a wine rack's bar 3.5 mm
      beside the bottle's centre, 23 cm below its top, roofed libero_goal 9's rack and the bottle was laid
      on to the stove (0 of 50 where v26 had 50) -- hence below the top only what lies over the object's
      centre, as the shelf's boards do over the books' and the pans' (libero_goal 9 back to 50 of 50, the
      shelf tasks unchanged episode for episode). The humans lay the books: 56 of 60 demonstrations of
      libero_90 86, 88 and 89 release the book with its thickness up, the approach tilted down by a median
      8.6 deg (88), 6.8 deg (86) and 32 deg (89). Built and traced on 88 and 89: level, the wrist trailing
      20 cm behind the tool at its height sat on the next book on the table -- hence the pitch; at the
      full pitch 89's book missed its 71 mm opening by 0.8 mm -- hence pitched only as far as the opening
      allows; by the jaws' nearer sign the wrist sat 0.01 rad from its limit 19 deg short of the frame --
      hence the wrist order; commanded level, the arm sagged 22 mm reaching in and the book's edge met the
      shelf's floor -- hence toward the drop point at the rest height; judged against the region-derived
      height, 11 cm above where it rests, a released book was taken back out, and the retreat straight up
      lifted it on the open jaws' lower finger -- hence the recorded release and the level withdrawal.
      Measured and not built: centring the object's box on the drop point (libero_90 88 settled 2 of 10,
      against 10 of 10 without); a wider lower toward E (libero_90 86 13 of 20 over two fixture draws,
      against 14 of 20 without); a drop point chosen across the region for an arm clear of the scene (at
      every candidate libero_90 89's hand met the table). With the law, the teacher alone, inits 0-9,
      fixture seed 555, success: libero_90 40 10, 42 6, 86 9, 88 10, 89 0 of 10; fixture seed 557, settled
      (TST-teacher-settled) 40 7, 42 5, 86 3, 88 10 of 10, success 10, 5, 5, 10. libero_10 9 stays 0 of
      10. Not solved: 89 (under the bottom layer the hand meets the table; the humans insert at 32 deg and
      let the book drop), and a descent at E onto a book standing on the table (86). Restated three times
