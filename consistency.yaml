      libero_90 34 (50 -> 10 of 36). Offered after the upright face and rim pinches, where those pass the
      mug is taken as before (libero_10 4 8 of 8 and libero_90 34 4 of 4 of the inits v40 lost), and where
      they do not -- into the microwave -- the leaned handle pinch is taken before the leaned rim pinch,
      which went 1 of 5 there against 5 of 5. Restated per the verifier: the planner's tier order is
      declared here, so the handle tiers' move leaves the others' order as it was; claim (2) is of what
      this branch offers. Restated per the verifier: held_by is read through the same evidence gate, so an
