      claim (2) held to the steps the object is held; the commands' moving point named (the tool, by the
      object's origin's offset), the rest height single-valued, the records' order within a step stated;
      claim (2) of the four cases, not of the place's own phases. Restated after a refutation: claim (1)
      held to the steps the object is held; the entry's rest height named as replacing the region-derived
      height in the premise's first ground and the delivered test. And two changes: near the drop point
      the object lies in every direction's corridor, and libero_90 88's book, entered along -y, was taken
      as along +y and the hand withdrew into the shelf -- hence the tool behind the drop point; drawn out
