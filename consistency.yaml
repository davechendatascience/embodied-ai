  - id: BRN-reset-anchors-all-execution
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      SimArm anchors the execution layer at every placement of the arm -- after each set_init_state,
      after each state restore between layout tries, and after the random start's IK write before its
      hold: robosuite's finger target is set to fully open (the setpoint every settle pass ends on), the
      joint controller's cache is refreshed (update(force=True)), and the joint ramp is re-installed at
      the placed pose. An episode's draws come from a generator seeded by (seed, episode index), and
      internal redraws from a sub-generator seeded by (seed, episode index, attempt), a redrawn init
      state settled in place rather than by recursing into reset; teacher caches kept per attempt are
      keyed and cleared by (episode, attempt) (scripted_teacher.py:233-235, skills.py:151-156 and :406).
      An episode's trajectory under a teacher is then a function of (seed, episode index, init state) in
      both environments, the same whichever episodes ran before it in the process, and a hold after a
      placement starts from the placed state. Outside the claim: GripperScan, measured once per process
      (differences <= 1e-15 m); EGL rendering, which can differ by one intensity level between renders
      of one state; distill's student-driven, mixed and DART episodes, whose features depend on which
      workers share a GPU batch. What a trial records, so that it can be reproduced and never pooled
      across executions, is BRN-trial-provenance.
    premises: [AXM-reproducible-measurement, AXM-one-execution-path, AXM-robosuite-controller-cache, AXM-robosuite-gripper-target-persists]
    derivation_rule: >-
      Reduced to the mechanism that held in every one of six reviews: bit-identical teacher episodes
      across up to 10 process histories in TaskEnv and across histories in PrivilegedEnv layout mode (a
      redraw and 20-21 rejections included); split, non-split, teacher_motion and distill trials
      reproduced bit-for-bit in fresh processes; every hold site starting from the placed state (drift
      <= 6.1e-9 rad with the anchor vs up to 2.2e-1 without). Every refutation from round 3 on was in
      the record-keeping clauses added to this branch -- the record_rollout replay, the execution hash
      missing the arm model read from another project's venv, numpy's version -- so those move to their
      own branch, BRN-trial-provenance, which this one no longer claims. evidence:
      CTR-execution-reproducible.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-policies-read-one-forwarded-state
    subject: CMP-scene-randomizer
    claim_type: contract
    statement: >-
      The execution core's one control-period helper -- used by execute() and by the settling holds,
      which read the placed state themselves before holding -- ends with one mj_forward, and every
      policy input is read from that forwarded state: the teacher's snapshot and scene poses, the
      student's state and images, the recorder's frames, and success, which is LIBERO's predicate
      evaluated on the forwarded state (env.step's own done, computed before the forward, is discarded
      for decisions and logged alongside for comparability). Observations are forced only (no
      per-substep sampling), refreshed by every function that changes the state (the IK write, object
      writes, layout proposals and restores, set_init_state, begin()), the observation a period ends
      with is the one the next period's servo reads, and reading an observation never renders a second
      time (PrivilegedEnv.obs() reuses the period's frames). Each action is then chosen from the exact
      state it acts on, positions and everything derived from them agree to 0 mm, and reading or
      rendering an observation never changes the simulated state or a teacher's trajectory; rendered
      frames, like every EGL render, can differ by one intensity level between renders of one state, so
      image-conditioned policies are reproducible only up to that. It is adopted together with the reset
      anchor (BRN-reset-anchors-all-execution), which makes a hold after a placement start from the
      placed state. Adopting it changes what every policy sees, so before any data is collected under it
      the skill teacher is re-validated (per BRN-teacher-switches-dwell), the scripted labeller is
      re-run, and every student dataset -- DAgger rounds, frame and token caches, checkpoints -- is
      recollected or retrained; keeping trials from before and after apart is BRN-trial-provenance.
    premises: [AXM-reproducible-measurement, AXM-one-execution-path, AXM-dagger-needs-markov-labels, BRN-reset-anchors-all-execution]
    derivation_rule: >-
      Restated after a confirmation whose only gap was scope: "reading or rendering never changes a
      trajectory" held for the simulated state and teacher trajectories (0 of 600 steps changed by extra
      reads), but a second render of one forwarded state differed at 2 of 600 steps (3 wrist pixels, 1
      level) and PrivilegedEnv.obs() without raw re-rendered and replaced self.raw
      (teacher_env.py:204-205), swapping a student's frame at 1 of 600 -- now obs() reuses the period's
      frames and the EGL limit is named, as in the reset branch. evidence: CTR-execution-reproducible.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  # ---- CMP-twist-servo: the twist servo and the joint ramp every policy's action goes through
  - id: BRN-servo-lead-scaled-uniformly
    subject: CMP-twist-servo
    claim_type: contract
    statement: When the IK step would make TwistServo's joint reference lead the measured joints by more than its lead limit max_lag (0.1 rad as SimArm sets it) on some joint, the reference is set to meas + s (theta - meas) with s = max_lag / max|theta - meas| and the pose reference to FK of that reference; such a step is counted as a scale event, and also as a re-anchor when its IK residual exceeds max_pose_err (servo.py:116's re-anchor condition); otherwise the servo computes exactly as servo.py does now (servo.py:122 kept as written). Then, at command time, the joint reference leads the measured joints by at most max_lag per joint, and on a scaled step that lead keeps the direction of theta - meas and the pose reference is exactly FK of the joint reference. On the skill teacher -- libero_spatial 0 and 6 (init 48 included) and libero_goal 0, 7 and 8, two episodes each -- success is no lower than with per-joint clipping.
    premises:
    - AXM-servo-tracks-reachable-poses
    - AXM-one-execution-path
    derivation_rule: >-
      Reduced to the clauses measured sound in all three reviews of this branch: lead at command time <=
      max_lag (up to float rounding); direction of theta - meas kept (cos >= 0.9999999999999997 on 1486
      scaled steps); pose reference = FK(ref) to 0.0 mm; non-binding branch bit-identical to the current
      servo (0 mismatches over 9599 steps); re-anchors counted exactly on the 10 scaled steps with
      residual > max_pose_err, no trajectory changed by the counting; success 10/10 vs 9/10 with and
      without the reset fix (24/30 vs 23/30 on 15 more tasks). Consequences measured under stated
      conditions, kept out of the claim because each held only in the condition measured: pressing on
      flat_stove_1_burner the stored lead is 30.3-32.2 mm (per-joint clipping 80.5 / 135.0 / 258.3 mm in
      3D); with the command reversed it unwinds at 2.4-2.7 mm per period against 2.5 commanded; if the
      block gives way the arm closes it within 3 periods at <= 0.46 m/s and 15.1 m/s^2, where clipping
      moves 78-121 mm or jumps 154 mm at up to 0.60 m/s and 24.6 m/s^2. evidence:
      CTR-servo-keeps-its-reference.
    sufficiency:
      n_min: 3
      min_consensus: 0.8

  # ---- CMP-skill-library: the hand-written skill teacher that still drives the student's demonstrations
  - id: BRN-carry-reachable-along-carry
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A carry is planned only at a height that passes a declared screen: at every station of the carry
      -- over the pick point, over the drop point, the stations between them, and the columns the object
      rises and is lowered through -- the tool is a reachable pose with the arm not penetrating a
      fixture, for the in-hand offset the object has when the screen runs. Stations are spaced so that
      the arm's IK solution changes by no more than DEF-reachable-pose's joint margin between
      consecutive stations, which makes their number follow from the carry rather than from a choice,
      and forces an interior station on any carry long enough to need one. The screen answers for those
      stations and not for the poses between them. It is asked again whenever the in-hand offset has
      changed since it last ran, over the stations still ahead; a height is never carried past a change
      in the offset it was screened for. When no height examined passes every remaining station, the
      query refuses per DEF-witness-or-refusal: no carry is witnessed among the candidates examined, and
      nothing is said of heights not examined. A refusal before the lift means the skill does not run; a
      refusal during the carry ends the episode with the refusal recorded beside the scorer's verdict.
      Not claimed: that the carried object clears the fixtures, which this screen tests only of the arm;
      that the stations witness the poses between them.
    premises: [LMA-whole-path-reachable, DEF-reachable-pose, DEF-witness-or-refusal, DEF-refusal-is-an-outcome,
               AXM-grip-fixes-object-in-hand, AXM-no-torsional-friction, AXM-rim-pinch-drops-under-smooth-motion,
               AXM-parameters-derived]
    derivation_rule: >-
      LMA-whole-path-reachable rules out judging a segment by its endpoints, which is why the claim runs
      over stations and names the columns, and equally why it is a screen over those stations, since the
      lemma denies any finite set settles the motion. DEF-reachable-pose gives what each station
      demands, in its own words -- not penetrating a fixture -- and its 0.15 rad joint margin also gives
      the spacing: it is a definition in this file, which AXM-parameters-derived admits as a source, so
      the station count is derived rather than chosen. The spacing is claimed to make that count
      non-arbitrary and to force interior stations, not to make the stations sufficient.
      AXM-grip-fixes-object-in-hand ties a station's tool pose to the object's only while the object is
      held without slipping, and AXM-no-torsional-friction and AXM-rim-pinch-drops-under-smooth-motion
      say the offset changes without a regrasp. An earlier statement voided the height on any such
      change, which for a pinch grasp voids it at every station after the first and satisfies the claim
      vacuously by planning nothing; asking the screen again at the current offset needs no tolerance
      and plans nothing on an offset the object no longer has. DEF-witness-or-refusal permits a query to
      give up early, so the refusal is stated over the candidates examined -- the qualifier this
      branch's sibling already carried and this one lacked. DEF-refusal-is-an-outcome gives a refusal
      during the carry its bookkeeping. evidence: CTR-teacher-reliable (spatial 6, 14 -> 19/20 paired;
      the per-grasp revision 186 -> 186 paired); CTR-teacher-attempts, where a refusal is counted.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-handle-grasp-reachable-along-drive
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A handle grasp is used only if accessible(j) holds of it in DEF-skill-contract's sense: at every
      station of the joint's motion -- its start, its end, and the stations between them -- the grasp
      frame carried by that motion is a reachable pose with the arm not penetrating a fixture.
      Evaluating a station means writing the joint to the position the station denotes and the arm to
      its IK solution for the carried frame there, forwarding, screening, and restoring the state that
      was there before. Stations are spaced so that the arm's IK solution changes by no more than
      DEF-reachable-pose's joint margin between consecutive stations, which makes their number follow
      from the motion rather than from the plan, and forces an interior station on any drive long enough
      to need one. The screen answers for those stations and for nothing between them. When no candidate
      examined passes every station, the query refuses per DEF-witness-or-refusal: accessible(j) has no
      witness among the candidates examined, the skill does not run, and the refusal is recorded beside
      the scorer's verdict. A candidate that fails the stations is not used with its failure recorded as
      a caveat.
    premises: [LMA-whole-path-reachable, DEF-reachable-pose, DEF-witness-or-refusal, DEF-refusal-is-an-outcome,
               DEF-skill-contract, AXM-handle-shares-body, AXM-object-geometry-known, AXM-mujoco-integration-state,
               AXM-mujoco-forward-is-a-function-of-state, AXM-parameters-derived, BRN-drive-tracks-the-handle]
    derivation_rule: >-
      DEF-skill-contract is what accessible(j) means here, and was cited nowhere before; the claim now
      states that sense rather than assuming it. LMA-whole-path-reachable gives the stations.
      DEF-reachable-pose gives what a station demands and, through its 0.15 rad joint margin, the
      spacing -- a definition in this file, which AXM-parameters-derived admits, where 'declared with
      the plan' was none of that axiom's sources and let a two-station plan reduce the screen to the
      endpoint check the lemma forbids. The spacing is claimed to make the station count follow from the
      motion and to force interior stations, not to make the stations sufficient.
      BRN-drive-tracks-the-handle gives the carried frame: the handle travels with the joint, rotated by
      a hinge and carried without rotation along a slide, so the pose screened at a station is the grasp
      as that station would hold it. AXM-mujoco-forward-is-a-function-of-state licenses writing both the
      joint and the arm to a configuration the world is not in and reading its geometry, since
      DEF-reachable-pose's conditions are properties of the arm's configuration;
      AXM-mujoco-integration-state licenses the restore. AXM-handle-shares-body and
      AXM-object-geometry-known put the handle on the moving body and the fixtures' collision geometry
      in the state. DEF-witness-or-refusal permits a query to give up early, so the refusal is read over
      the candidates examined. evidence: CTR-teacher-reliable (goal 0/3/7: drive_checked in 60 of 60
      episodes).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-handle-holding-by-aperture
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      For a grip whose command drives the fingers to their closing limit, the jaws hold a handle when,
      with the finger target at rest against that limit, three things hold together. Each finger group's
      contacts with the handle's own geometry carry more than half of that finger's closing force,
      summed over the group -- not merely touching the handle, and not some other geometry of the body
      the handle belongs to. The aperture lies within the span of the handle's own geometry across the
      jaw axis, to within the penetration the model's contact parameters allow, so jaws stopped by a
      thicker or thinner feature of the same body sit outside it. And over a window longer than a
      transient spike, the aperture has not closed by more than a handle held at rest closes over the
      same window, so a slip that lets the jaws close slowly and steadily fails however slow it is. No
      one of the three suffices: contact does not attribute the stop, the aperture does not exclude a
      feature of the same width, and stillness does not say what is still. A grip commanded to a width
      rather than to the limit is outside this claim.
    premises: [LMA-holding-is-geometric, DEF-holding, AXM-handle-shares-body, AXM-panda-gripper-geometry,
               AXM-object-geometry-known, AXM-robosuite-gripper-target-persists, AXM-squeeze-is-a-spring,
               AXM-slip-spikes-are-transient, AXM-mujoco-forward-is-a-function-of-state, AXM-parameters-derived]
    derivation_rule: >-
      LMA-holding-is-geometric requires the form -- the handle's own geometry and an aperture the handle
      stopped -- and leaves the thresholds to the claim that scores it, so each number here needs its
      own declared source. AXM-handle-shares-body makes the geometry qualifier necessary.
      AXM-squeeze-is-a-spring gives each finger's closing force, 1000 N/m times its distance from closed
      and capped at 20 N, and AXM-mujoco-forward-is-a-function-of-state makes per-contact normal forces
      readable, so the share is computable. It is more than half and summed over the finger group: an
      earlier statement said at least half and justified it as the least share two contacts cannot both
      hold, which is false at exactly half, and summing over the group is what the lemma's 'press'
      means. AXM-object-geometry-known gives the handle's span and AXM-panda-gripper-geometry the pads'
      16 mm depth across which another feature could stop the jaws; requiring the aperture to fall
      within the handle's own span is what makes such a stop visible, and it replaces DEF-holding's
      band, which has no endpoints. The tolerance on the span is the contact penetration the MuJoCo
      model's contact parameters allow, one of AXM-parameters-derived's sources.
      AXM-robosuite-gripper-target-persists is why the target is read at rest against its limit rather
      than as a commanded sign; it carries no aperture speed, and the free-closing speed an earlier
      statement took from it was a difference between two runs read as distance travelled, so no speed
      appears here. AXM-slip-spikes-are-transient gives the window, longer than a spike of a step or
      two. Its speed figure bounds a held object's motion relative to the jaws, which a steady slip can
      stay under indefinitely, so the claim bounds displacement over the window rather than rate; the
      bound is the measured aperture closure of a handle held at rest over the same window, a measured
      distribution AXM-parameters-derived admits once named with its measurement, which is
      component-belief's to take. evidence: CTR-teacher-reliable (goal 0, 14 -> 20/20 paired; the geom
      revision 20/0/20 unchanged).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-reliability-evidence-valid
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The per-task success rates offered as evidence for CTR-teacher-reliable exclude four named ways a
      rate is made of nothing, and claim no more than that. An episode's trajectory is a function of its
      seed, its episode index and its initial state, not of the episodes that ran before it in the same
      process, for the teacher episodes these rates are formed over, which lie outside the classes
      BRN-reset-anchors-all-execution excludes: GripperScan's once-per-process measurement, EGL
      rendering, and distill's student-driven, mixed and DART episodes. That whole episodes reproduce is
      measured by CTR-teacher-deterministic, not derived here. The instruments that form the rates are
      required to leave each episode's outcome to the scorer, to report a shortfall against the episodes
      declared rather than rate whatever arrived, and to offer only the trials the run itself wrote.
      Those three are requirements this branch states; whether a given run meets them is implementation
      fidelity, measured in component-belief, and is not claimed here. Not claimed: that the rates are
      valid evidence in any sense beyond these exclusions.
    premises: [AXM-instruments-do-not-decide, AXM-libero-scores-final-state, BRN-reset-anchors-all-execution]
    derivation_rule: >-
      BRN-reset-anchors-all-execution gives the trajectory clause, and the claim now says trajectory
      where an earlier statement said episode: that branch places EGL rendering outside its claim, so an
      episode that renders is not a function of its seed, index and initial state even though its
      trajectory is. Its exclusions are restated here rather than inherited silently, which is the
      omission on which BRN-trial-provenance was refuted. AXM-libero-scores-final-state fixes what an
      outcome is, and AXM-instruments-do-not-decide supplies the three requirements on the instruments.
      They are stated as requirements rather than claimed met, because an axiom that forbids an
      instrument deciding an outcome cannot establish that none did; an earlier statement dropped
      LMA-observers-read-only as subsumed by that axiom and so removed the only node carrying the claim
      that the requirement was met, while still asserting it. AXM-reproducible-measurement and
      LMA-seed-fixtures-per-init-state are no longer cited: the first did no work in the derivation, and
      the second is DOUBTED and supplied only what BRN-reset-anchors-all-execution, which is proven,
      already gives. evidence: CTR-teacher-deterministic (same seed, same timeline, run twice).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-drive-tracks-the-handle
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Skills.articulate derives the handle grasp frame and the drive target from the joint's
      current position: the frame chosen once per episode is carried by the joint's motion
      since it was chosen (a rotation for a hinge, nothing for a slide), and the drive
      target leads the handle's current grasp pose by at most 0.06 rad (hinge) or 3 cm
      (slide), less than the squeeze alignment tolerance of 0.10 rad.
    premises: [AXM-dagger-needs-markov-labels, AXM-panda-gripper-geometry, LMA-holding-is-geometric]
    derivation_rule: >-
      screwhead/teacher/skills.py _handle_frame (frame via _joint_motion(qpos - q0)) and _drive
      (dq clipped to the lead, from R_h and p_h). A frame fixed in the world makes the label
      depend on the joint angle at selection; a target led from the tool's own pose lets the
      tool outrun a damped knob and pry the jaws open.
      evidence: CTR-teacher-reliable (goal 7, 12 -> 20/20 paired; goal 0 20 -> 20).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-leave-handle-along-approach
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      A skill may not start while a handle any skill has acted on this episode is held or enclosed by
      the jaws. For each such handle this is a predicate on the current state, read whenever a skill
      would start: the jaws do not hold it in DEF-holding's sense, no part of its geometry lies within
      the jaw envelope -- between the fingers, out to the finger meshes' reach past the tool point --
      and no robot geometry touches its geometry. It constrains where each handle is relative to the
      jaws, not where the arm may go: holding another object, or reaching over an opened drawer into it,
      satisfies it. The skill that acted on a handle ends by making the predicate hold for it: the jaws
      release, then the tool moves along the handle's approach axis as the drive left it, away from the
      handle, by at least the pads' back-edge offset plus the finger meshes' reach, with no component
      across that axis and no other motion until the predicate holds. If it later fails for a handle --
      the arm drifting back until a handle is enclosed again -- that skill's retreat is re-entered
      before any other skill starts. The jaws release first because the predicate cannot hold while they
      hold the handle.
    premises: [AXM-panda-gripper-geometry, AXM-handle-shares-body, DEF-skill-contract, DEF-holding,
               BRN-drive-tracks-the-handle]
    derivation_rule: >-
      DEF-skill-contract makes disengagement the planner's obligation and gives its form, a predicate on
      the current state read at each start. It binds each skill to whatever it acted on and gates the
      next skill on the previous one's postcondition; the quantifier is over every handle acted on this
      episode because a handle opened earlier and left enclosed entangles the arm exactly as the last
      one would, and the predicate is chosen so that quantifying over all of them costs nothing in
      ordinary motion. An earlier statement put 'the hand holds nothing' and a standing distance from
      every handle into the predicate, which under this quantifier forbids carrying an object after
      opening a drawer and forbids reaching into the drawer just opened -- the task this branch exists
      to serve. What entangles the arm is a handle between the fingers, so the predicate is written
      about that and nothing else. AXM-panda-gripper-geometry supplies the jaw envelope and the retreat
      distance: the pads reach 11.6 mm behind the tool point and the finger meshes 9.3 mm past it, so
      11.6 + 9.3 = 20.9 mm along the approach axis is the least motion that takes a handle gripped at
      the pads' back edge out of the envelope. BRN-drive-tracks-the-handle supplies that axis as the
      drive left it, the grasp frame carried by the joint's motion, which for a hinge differs from the
      axis at the start. The touch clause is on the handle's own geometry rather than its body, because
      AXM-handle-shares-body says only that contact with the body does not locate a finger on the
      handle, not that every contact with the body pushes the joint. DEF-holding makes release a
      precondition of the predicate, which is all the ordering needs; an earlier statement argued it
      from how a held handle moves under a retreat, which no premise here supports. evidence:
      CTR-teacher-reliable (goal 3's drawer task is the one this governs).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-scan-then-place
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      Skills.place pairs downward rays over the held object's footprint with its underside to
      find the touchdown tool pose, lowers to it slowing over the last centimetres, and
      releases once the object rests on the intended support.
    premises: [LMA-touchdown-from-paired-rays, LMA-contact-release-is-robust]
    derivation_rule: >-
      (to be implemented) evidence: CTR-teacher-gentle (release_gap_mm <= 5).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-pinch-for-the-whole-place
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      After the grasp, the teacher checks the actual pinch against the descent to touchdown
      (fingers and hand clear of support, walls and other objects) and regrasps if it fails;
      the choice among rim pinches is driven by why they drop
      (AXM-rim-pinch-drops-under-smooth-motion), which is still to be measured.
    premises: [LMA-pinch-clears-the-descent]
    derivation_rule: >-
      (to be implemented) evidence: CTR-teacher-gentle (drop_count == 0), CTR-teacher-reliable.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-execution-bounds-acceleration
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      SimArm executes every policy's action with its joint goal ramped linearly over the whole
      control period (sim/joint_ramp.py), the commanded twist changing by at most 2 m/s^2 and
      5 rad/s^2 (sim/servo.py), and a 0.1 rad per-period joint clip shared by the controller,
      the servo's lead limit and the settling hold (Execution.joint_step).
    premises: [LMA-smooth-in-execution]
    derivation_rule: >-
      screwhead/sim/sim_arm.py _open and _gains, screwhead/sim/servo.py _limit,
      screwhead/sim/joint_ramp.py. evidence: CTR-teacher-smooth (substep acceleration p95
      median 2.18 m/s^2 against ~12 before; 16 of 20 episodes without re-anchors, RUN-0047),
      CTR-teacher-reliable (libero_spatial 188/200 against 186).
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-regression-planner
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The skill teacher acts by regression over declared contracts, re-run every control step: pick(o)
      {hand empty, uncrowded(o), graspable(o)} -> held(o); place(o, R) {held(o), admits(R, o)} ->
      In/On(o, R); drive(j, mode) {hand empty, accessible(j)} -> the joint's predicate; park(o)
      {held(o)} -> hand empty, o resting on a free spot; move-clear(o) is pick then park outside what
      crowds it, each phase re-derived from the state at every step rather than remembered -- the pick
      phase while o is not held, the park phase while it is. The goals and the affordance table supply
      the parameters, and the predicates read the state and the plan's fixed targets: a container's open
      position, an object's destination. The skill set is closed at those five. When the regression
      reaches a predicate that no declared skill's effect entails, it refuses, naming that predicate,
      and runs no other skill in its place; the refusal is recorded beside the scorer's verdict. In the
      current scope this happens for admits(R, o), which drive's effect -- the joint's predicate -- does
      not entail, and for graspable(o), which nothing achieves because regrasping and reorienting are
      not covered. Not claimed: that the regression terminates, or selects uniquely, for this table.
      Scope: the predicates libero_object, spatial and goal and libero_10's put-in-drawer-and-close
      need; not yet covered: pushing or sliding without a grasp, two objects into one region, enclosed
      regions, access occlusion, reorienting or regrasping an object.
    premises: [LMA-regression-selects-an-applicable-skill, DEF-skill-contract, DEF-refusal-is-an-outcome,
               AXM-bddl-states-goals-not-methods]
    derivation_rule: >-
      DEF-skill-contract gives the table. LMA-regression-selects-an-applicable-skill gives the procedure
      -- regress from the first unmet goal conjunct through first unmet preconditions to a skill that
      can run or to a predicate no declared skill achieves, reported as a named gap -- and the refusal
      is that named gap. The lemma's termination guarantee is conditional on an acyclic achiever
      relation, and this table is not acyclic: pick needs hand empty, which park achieves, and park
      needs held, which pick achieves. The branch therefore uses the lemma's procedure and outcome and
      does not claim its termination; that belongs to the lemma's repair. An earlier statement said the
      refusal had no instance in scope because every goal conjunct has an achiever, which confused goal
      conjuncts with the predicates the regression reaches: admits and graspable are reached and have no
      achiever, so the refusal fires today. AXM-bddl-states-goals-not-methods fixes the goal language.
      The predicates read the plan's fixed targets as well as the state, because a container's crowding
      is judged at its open position and a grasp at its destination; the targets come from the goal,
      which is fixed for the episode, so this does not make a label depend on the episode's history.
      Three premises an earlier statement cited are no longer cited -- LMA-hand-is-a-precondition,
      LMA-geometry-answers-predicates and LMA-protected-progress, each refuted -- because the branch no
      longer claims what they carried: that the hand regresses safely to parking, that every failed
      predicate has an achiever, and that the executor never alternates. Those claims are not abandoned;
      they belong to the lemmas, which are refuted and are to be repaired. evidence:
      CTR-teacher-reliable -- the 600-episode reference at bcf19e9 (523/600) reproduced wherever the old
      executor had no special case, then libero_10 KITCHEN_SCENE4 (bowl into the bottom drawer, close
      it); CTR-teacher-attempts, where a refusal is counted.
    sufficiency: {n_min: 3, min_consensus: 0.8}

policies:
  - id: POL-teacher-design-consistent
    criteria:
      - {target: BRN-carry-reachable-along-carry, require: proven}
      - {target: BRN-handle-grasp-reachable-along-drive, require: proven}
      - {target: BRN-handle-holding-by-aperture, require: proven}
      - {target: BRN-reliability-evidence-valid, require: proven}
      - {target: BRN-drive-tracks-the-handle, require: proven}
      - {target: BRN-leave-handle-along-approach, require: proven}

  - id: POL-planning-data-driven
    criteria:
      - {target: BRN-regression-planner, require: proven}

  - id: POL-teacher-motion-sound
    criteria:
      - {target: BRN-scan-then-place, require: proven}
      - {target: BRN-pinch-for-the-whole-place, require: proven}
      - {target: BRN-execution-bounds-acceleration, require: proven}
