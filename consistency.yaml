      human demonstrations of libero_goal 5, replayed from their recorded states, never close the
      jaws: open about 62 mm, aligned with the motion, the tool point about 7.5 mm above the plate's
      centre -- fingertips on the dish floor -- leading its centre by 0.44 of its radius, moving it
