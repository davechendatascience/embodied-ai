  - id: BRN-handle-grasp-reachable-along-drive
    subject: CMP-skill-library
    claim_type: contract
    statement: >-
      The first time in an episode that the skill needs a joint's handle grasp, it screens the candidates
      the grasp planner offers on the handle geom, once, and keeps the result for the rest of the episode.
      A candidate passes when, at every pose it is screened at, the arm's inverse-kinematics solution,
      solved from the arm's joints at that step, converges, and, with that solution written to the arm's
      joints and the fingers set to the candidate's approach opening, no robot geometry penetrates a body
      without a free joint other than the joint's moving body and that body's children. Its poses are the
      grasp, its pre-grasp 0.10 m back along the approach and the points every 0.02 m between them, all
      with the joint where it is; the grasp carried by the joint's motion through half of dq and through
      dq, dq the joint's remaining travel from its position at that step to just past its goal threshold
      (translated along a slide, turned about a hinge's anchor); and the grasp carried through dq and
      backed off along the carried approach by the handle's clearance -- its box's half-extent along that
      approach, the box as it stands at that step, plus the finger meshes' reach past the tool point. Only
      the arm's and fingers' joints are written: the fixture's joint stays where it is at every pose; each
      pose is written, forwarded and read, and the joint positions and velocities are restored and
      forwarded. Contact with a free-jointed body and conditioning rank the passing candidates and reject
