      it by place_in, the drop point in plan of each such object is chosen, once per episode at the first
      step it is asked for, as follows, in place of BRN-drop-point-footprint-as-carried's search. Each
      object's footprint is its box as it lies at that step, turned about the vertical as
      BRN-carry-turns-object-to-fit's rule would turn it for the region, and centred on its origin; its
      width along a horizontal axis is twice the sum of its box's half-extents projected on that axis. The
      rule applies only to a region with exactly two box axes within a declared angle of horizontal; of
      those, the one along which the objects' widths sum to less is taken (ties to the first), projected
