      a declared distance of the place's target in plan and within a declared band about the target's
      height. The place's not-held law, at a step of a place at which its object is not held, is: where
      the object is at the place, settle there; else where the place's own release of the object is
      recorded and it is falling, wait; else take the object back -- a pick of it, as the place's first
      move. The place's own release is recorded when the place commands the jaws open to let the object go
      -- at the place, or at the end of a tip -- and cleared at every step at which the object is held and
      at an episode's start. That law now applies at a step at which the object is not held only when the
      object is at the place, or its release is recorded, or it passes the let-go test; at any other step
      at which it is not held the place acts as at a step at which it is held. Claimed: (1) at a step at
      which the object is not held, is not at the place and its release is not recorded, the place takes
      it back only if it passes the let-go test; (2) at a step at which the object is at the place, or its
      release is recorded, or it passes the let-go test, the place acts as it did without this rule; (3)
