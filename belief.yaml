# Declarations for the URDF-conditioned VLA action head.
#
# Design: docs/design_VLA_action_head.md. Goal: docs/design_VLA_goal.md.
# Brief (zh-TW): docs/project_brief_zh-TW.md.
#
# This file is the approval gate. The server reads it from git HEAD, not the
# working tree — editing it changes nothing until a human commits. Uncommitted
# edits show as PENDING in `status` and score no evidence.
#
# The thesis under test: a single policy emits an embodiment-free tool twist,
# and a fixed analytic layer parameterized by the URDF decodes it to joint
# commands for any 6- or 7-DoF arm.
#
# Revised ordering. A transfer claim is only worth testing on a policy that does
# the task from what it SEES. Measured: on LIBERO-spatial's bundled init states a
# demonstration-trained head with its images zeroed matched the sighted head --
# one mean trajectory solves the suite (12 mm placement spread) -- so a success
# there, on any arm, is a proprioceptive trajectory prior and says nothing about
# the head. So the chain is now three gates, in order:
#
#   1. geometry     the conversion, decoder and gripper are exact
#                   (POL-decoder-safe, POL-gripper-understood; supported)
#   2. grounding    under relation-preserving layout and start-pose
#                   randomization, a blind policy trained on the same data fails
#                   and the sighted one succeeds (POL-grounded)
#   3. transfer     the grounded policy survives an embodiment swap that a
#                   padded-vector baseline does not (POL-premise-survives,
#                   POL-thesis-supported)
#
# Data for gate 2 comes from per-task demonstration programs with privileged
# state (screwhead/scripted/scripted_teacher.py), executed through TwistServo, filtered to
# successes, then aggregated with DAgger (tools/distill.py). Teacher and student
# share one declared evaluation: tools/distill.py collect --trials, seed 555,
# layouts 0.08 m, start 0.10 m / 0.05 m / 30 deg / 10 deg / 0.3 rad, horizon 400.
#
# ONE EXECUTION PATH (scripts/token_vla.sh). Demonstrations, DAgger rollouts and
# evaluation execute actions identically: the arm through TwistServo, the gripper
# as a target aperture through GripperServo, and the student's gripper decode
# (snap levels) stored in its checkpoint. A model trained on data collected under
# one execution and tested under another is not evidence for either: the first
# target-aperture model (command-mode rounds relabelled, snap applied only at
# test) was stopped unscored for that reason.
#
# Evidence so far is from the command-gripper token VLA (vla_tok_r2, 200 episodes
# each, ingested). The student tests below still run command-mode checkpoints
# through the checkpoints/vla_student*.pt symlinks; they gain --gripper-target when
# the aligned target model replaces them.
#
# Every code file under screwhead/ and tools/ belongs to a component; each component
# lists its files in a `# code:` line. A file no component claims is deleted.
#
# WHAT THESE GATES DO NOT TEST. Every contract above is scored on the same ten
# libero_spatial tasks, driven by ten hand-written demonstration programs whose
# constants (the drawer's 26 mm pre-shape, per-task rim sectors, the relations in
# layouts.py) were tuned on those tasks. A policy can satisfy all of them by being
# good at exactly these ten. Gate 2b below is the guard: a task nobody trained on,
# and a teacher nobody hand-wrote for it.
#
# Ledger facts that shape this file (component-belief source):
#   - compatibility_key reads repro only; distill.py writes task, randomization,
#     teacher_revision and policy_revision there.
#   - a policy criterion keeps ONE compat group per bucket (decide.py keys states
#     by bucket), so with several policy revisions in the ledger a policy verdict
#     is not trustworthy -- read `status view=belief` per revision before decide.
#   - a trial missing a rule metric is excluded, not failed; distill.py therefore
#     writes grasp_offset_mm = 1e6 rather than null when nothing was measured.

components:
  # code: screwhead/geometry/poe.py, screwhead/sim/mjcf.py, screwhead/geometry/se3.py, screwhead/sim/libero.py (Panda chain at LIBERO's grip site)
  - id: CMP-poe-conversion
    purpose: Convert a URDF into a home pose and one screw axis per joint
    outputs: [IFC-poe__kinematics]
    testable_capability: >-
      Reproduces the simulator's own forward kinematics to machine precision on
      randomly sampled configurations, for every arm it is given
    failure_modes:
      - {id: FM-rpy-order, observable: home pose is tilted but plausible; fixed-axis rpy applied in the wrong order}
      - {id: FM-zero-offset, observable: every joint angle is offset because the file's zero differs from the encoder index}
      - {id: FM-prismatic-sign, observable: prismatic joints move the tool the wrong way}
      - {id: FM-tool-frame-drift, observable: axes are right but the tool offset is measured to the wrong link}
    remediation: The five-step conversion in Modern Robotics ch.4 sec.4.5; check against sim FK before anything downstream

  # code: screwhead/geometry/kinematics.py, screwhead/geometry/kin_np.py (NumPy fast path for the control loop), tests/test_kin_np.py (holds it to the torch reference)
  - id: CMP-kinematics
    purpose: Batched differentiable forward kinematics and body Jacobian from screw axes
    inputs: [IFC-poe__kinematics]
    outputs: [IFC-kinematics__ik]
    testable_capability: >-
      Jacobian agrees with finite differences of its own forward kinematics, and
      the space and body forms agree, across arms of differing joint counts
    failure_modes:
      - {id: FM-adjoint-order, observable: Jacobian columns use the wrong upstream product and only agree at the home posture}
      - {id: FM-gradient-wrong, observable: analytic gradient disagrees with autograd through the exponential map}
      - {id: FM-batch-leak, observable: results depend on batch composition when joint counts differ}
    remediation: Column i is joint i's screw axis carried by the Adjoint of everything upstream; ch.5 sec.4.2

  # code: screwhead/geometry/ik.py
  - id: CMP-ik-decoder
    purpose: Decode a tool twist to joint commands by damped least squares
    inputs: [IFC-expert__ik, IFC-kinematics__ik]
    outputs: [IFC-ik__controller]
    testable_capability: >-
      Converges on reachable targets, keeps every step inside the damping bound,
      and reports a non-zero residual instead of a step when a target is
      unreachable
    failure_modes:
      - {id: FM-unbounded-step, observable: joint step exceeds the damping bound near a singularity}
      - {id: FM-silent-infeasible, observable: an unreachable target returns a confident step and no residual}
      - {id: FM-chunk-drift, observable: null-space posture wanders across a decoded action chunk}
    remediation: The damped least-squares derivation and its step bound, ch.6 sec.4.4; warm-start each solve from the previous

  # code: screwhead/geometry/ik.py (nullspace_projector)
  - id: CMP-nullspace
    purpose: Resolve redundancy for arms with more joints than the task needs
    inputs: [IFC-kinematics__ik]
    testable_capability: >-
      A secondary objective changes the posture without moving the tool on a
      redundant arm, and is inert rather than harmful on a non-redundant one
    failure_modes:
      - {id: FM-tool-disturbed, observable: the tool moves when the secondary objective fires}
      - {id: FM-masked-as-zero, observable: a 6-DoF arm is trained toward a zero preference instead of no preference}
    remediation: Project through the null space; prefer the inertia-weighted inverse where dynamics exist, ch.11 sec.4.7

  # code: screwhead/analysis/retarget.py
  - id: CMP-retarget
    purpose: Convert demonstration joint trajectories into embodiment-free tool twists
    outputs: [IFC-demo__twist]
    testable_capability: >-
      Round-trips: retargeting a demonstration to twists and decoding it back on
      the same arm reproduces the original TOOL trajectory
    failure_modes:
      - {id: FM-lossy-roundtrip, observable: the decoded tool trajectory diverges from the demonstration on the source arm}
      - {id: FM-frame-mismatch, observable: twists are produced in the base frame and consumed as body frame}
      - {id: FM-joint-fidelity-fallacy, observable: a faithful decode is scored as a failure because the elbow differs}
      - {id: FM-unconverged-frame, observable: a near-singular frame is kept as a training target without converging}
    remediation: Retarget through the demonstrating robot's own FK and Jacobian; the conversion is arithmetic, not learned

  # code: screwhead/student/spec.py
  - id: CMP-spec-conditioning
    purpose: Carry the robot specification into the learned policy as tokens
    outputs: [IFC-spec__expert]
    testable_capability: >-
      Policy output changes when the specification changes and the observation
      does not, by more than it changes under a re-seeded forward pass
    failure_modes:
      - {id: FM-tokens-ignored, observable: perturbing the spec leaves the action unchanged; the policy memorised one arm}
      - {id: FM-spec-shortcut, observable: the policy reads spec tokens as an embodiment id rather than as geometry}
    remediation: Kinematic domain randomisation over procedurally varied URDFs during training

  # code: screwhead/student/token_head.py, screwhead/student/policy.py, screwhead/geometry/state.py, tools/token_data.py, tools/distill.py, tools/record_rollout.py
  - id: CMP-action-expert
    purpose: >-
      The student VLA -- predict the tool twist and three-valued gripper command
      from both cameras, the instruction, proprioception and spec tokens
    inputs: [IFC-spec__expert, IFC-encoder__expert, IFC-teacher__expert]
    outputs: [IFC-expert__ik]
    testable_capability: >-
      Completes randomized LIBERO-spatial episodes from pixels at a rate a blind
      copy trained on the same data cannot reach, and retains that rate on an
      arm it never saw
    failure_modes:
      - {id: FM-trajectory-prior, observable: zeroing the images leaves success unchanged; the head replays a mean trajectory}
      - {id: FM-compounding-drift, observable: agrees with the teacher for the first ~25 steps, then stalls near pre-grasp on states the teacher never visited}
      - {id: FM-localization-limited, observable: closes the gripper centimetres from the grasp the teacher would choose; the approach is right, the target is not}
      - {id: FM-hold-unexecuted, observable: a regressed gripper output near zero is read by its sign and hold becomes close}
      - {id: FM-controller-as-policy, observable: a lag-compensated gripper law learned as a command matches the teacher on a fifth of pre-shape frames}
      - {id: FM-no-transfer, observable: success collapses on a held-out embodiment}
      - {id: FM-controller-credit, observable: transfer is attributable to the controller rather than the head}
    remediation: >-
      DAgger on student-visited states labelled by the program; patch tokens
      rather than pooled features; decode the gripper to the nearest of three
      values; fine-tune the encoder with a grasp-localization loss only if data
      scaling plateaus

  # ---- Gate 2 machinery. The teacher reads the simulator; the student never does.
  # code: screwhead/sim/servo.py
  - id: CMP-twist-servo
    purpose: Execute a body twist on the simulator's joint-position controller
    inputs: [IFC-expert__ik]
    testable_capability: >-
      Replaying a successful episode's twist labels open loop reproduces its
      success, despite controller lag and zero-command drift
    failure_modes:
      - {id: FM-controller-lag, observable: the joint controller reaches ~82% of each step and integrated error grows over an episode}
      - {id: FM-settle-drift, observable: a zero delta command drifts the tool ~22 mm while settling}
      - {id: FM-world-body-mixup, observable: the twist is integrated in the world frame and rotations swing the tool}
    remediation: Integrate the twist on SE(3) into an absolute pose reference, solve IK to an absolute joint target, and hold absolutely

  # code: screwhead/scripted/layouts.py, screwhead/sim/teacher_env.py, screwhead/sim/libero_env.py, screwhead/sim/sim_arm.py (what both environments share), screwhead/sim/contacts.py (every contact query, once)
  - id: CMP-scene-randomizer
    purpose: Randomize object layouts and robot start pose while keeping each instruction true
    outputs: [IFC-randomizer__teacher]
    testable_capability: >-
      Every episode starts at rest with the instruction's relation still singling
      out the target, and a policy denied the images cannot solve the resulting
      episodes
    failure_modes:
      - {id: FM-relation-broken, observable: the target bowl is no longer the one the instruction names}
      - {id: FM-not-at-rest, observable: an object is still sliding when the episode starts}
      - {id: FM-leaning-init, observable: an init state leans one object on another and every proposal drops it}
      - {id: FM-still-blind-solvable, observable: a zeroed-image policy succeeds anyway; the randomization does not demand vision}
      - {id: FM-teacher-veto-bias, observable: layouts the program cannot solve are redrawn, so the evaluated distribution is the teacher-feasible one}
    remediation: Move objects in rigid groups, settle, reject slid/ejected/relation-false proposals; redraw incompatible init states

  # code: screwhead/scripted/scripted_teacher.py, screwhead/scripted/progress.py, tools/collect_scripted.py, tools/scripted_eval.py
  - id: CMP-scripted-teacher
    purpose: Per-task demonstration programs that choose a verified grasp from privileged state and drive to it
    inputs: [IFC-randomizer__teacher]
    outputs: [IFC-teacher__expert]
    testable_capability: >-
      Solves each task under the declared randomization, and labels ANY state
      the student reaches (a Markov feedback law, not a replayed path)
    failure_modes:
      - {id: FM-lift-before-grip, observable: the bowl slips because lift starts before the jaws stop closing}
      - {id: FM-joint-limit-singularity, observable: the stove task stalls at a wrist limit}
      - {id: FM-fixture-collision, observable: the drawer task hits the cabinet on approach}
      - {id: FM-stale-grasp-cache, observable: a grasp chosen in a previous episode is reused after reset}
    remediation: Per-task ProgramConfig (sector, pre-shape, posture, selection); per-episode grasp cache; clearance, IK, path and sigma-min checks

  # code: screwhead/teacher/skills.py (feedback laws), screwhead/teacher/grasp_planner.py (candidates from geometry), screwhead/teacher/reach.py (IK, conditioning, collision), screwhead/geometry/frames.py, screwhead/teacher/skill_teacher.py, screwhead/sim/scene.py, screwhead/teacher/task_spec.py, screwhead/sim/task_env.py, screwhead/teacher/episode_log.py (per-episode diagnosis), tools/skill_eval.py, tools/skill_trace.py, tools/teacher_report.py, tools/teacher_determinism.py, tools/teacher_motion.py, screwhead/teacher/clearing.py, scripts/skill_sweep.sh
  - id: CMP-skill-library
    purpose: >-
      Build a task's demonstration program from its goal specification and the scene's
      geometry, instead of hand-writing one program per task
    outputs: [IFC-program__teacher]
    testable_capability: >-
      Solves a task it was never tuned for, from that task's goal predicates and the
      objects' measured geometry, at the rate hand-written programs reach
    failure_modes:
      - {id: FM-constants-hardcoded, observable: a new scene needs a new literal (pre-shape aperture, rim sector, approach height)}
      - {id: FM-goal-unparsed, observable: the goal predicates are read as a task id rather than as conditions to achieve}
      - {id: FM-skill-missing, observable: a suite needs a skill the library has no parameterisation for (open a drawer, turn a knob)}
      - {id: FM-sequence-brittle, observable: a multi-step task fails because a skill's exit state is not the next skill's entry state}
      - {id: FM-never-reached-grasp, observable: "teacher_report mechanism never-reached-grasp: tool never within 30 mm of the chosen grasp, no fixture contact -- the arm cannot hold the path (singular, clamped on a limit)"}
      - {id: FM-blocked-reaching, observable: "mechanism blocked-reaching: the arm pressed against a fixture on the way to the grasp -- the path, not the endpoint, is in collision"}
      - {id: FM-no-grip, observable: "mechanism reached-but-no-grip: tool at the grasp and the object never held -- wrong face, wrong width, or the object pushed away"}
      - {id: FM-not-delivered, observable: "mechanism held-but-not-delivered: object held, never within 50 mm of its target -- slipped in transit or the carry path is unreachable"}
      - {id: FM-unscored, observable: "mechanism delivered-but-unscored: object at the target and LIBERO's predicate still false -- the placement pose is wrong for that predicate"}
    remediation: >-
      Parameterise each skill by measured geometry (gripper span from finger FK, clearance
      from the scene, grasp frames from the object); sequence from the BDDL goal predicates;
      keep every skill a Markov feedback law so DAgger still applies. Fix by mechanism, not
      by task: tools/teacher_report.py names the mechanism of every failed episode

  # code: screwhead/student/dino_features.py, screwhead/student/clip_features.py (language), tools/feature_bakeoff.py, tools/probe_localization.py
  - id: CMP-vision-encoder
    purpose: Frozen DINOv2-base patch tokens (8x8 per camera) as the student's visual input
    outputs: [IFC-encoder__expert]
    testable_capability: >-
      A probe from its tokens locates the grasp the program would choose, in
      states the STUDENT drives to, within the grasp tolerance
    failure_modes:
      - {id: FM-pooled-loses-geometry, observable: a pooled embedding locates the grasp no better than proprioception alone}
      - {id: FM-teacher-state-only, observable: localizes in teacher-driven states and not in the student's own}
    remediation: Patch tokens; measure on student-driven states; the learning curve decides between more data and fine-tuning

  # code: screwhead/geometry/interface.py
  - id: CMP-action-interface
    purpose: Convert between the policy's action units and the decoder's twist units
    outputs: [IFC-expert__ik]
    testable_capability: >-
      Round-trips a recorded demonstration between per-step end-effector deltas
      and tool-frame twist rates without drift, at the dataset's control rate
    failure_modes:
      - {id: FM-rate-conflated, observable: a twist is consumed as a displacement, rescaling every action by the control frequency}
      - {id: FM-joint-normalisation, observable: translational and rotational components share one scale, so rotation is swamped}
      - {id: FM-embodiment-statistics, observable: normalisation constants are fitted per robot, reintroducing the per-robot coupling the design removes}
    remediation: Carry the control period explicitly; normalise translation and rotation separately with embodiment-independent constants

  # ---- The gripper, from the same first principles as the arm.
  #
  # G maps contact forces to an object wrench exactly as J maps joint rates to a
  # tool twist, and v_c = G^T V_b is the dual of tau = J^T F (ch.12 sec.4.5).
  # So the gripper decomposes the same way: an embodiment-free intent -- WHERE
  # to contact the object and with what normals -- decoded by a layer
  # parameterised by this gripper's own chain.
  #
  # The consequence that matters: pad separation limits are NOT constants to be
  # measured per gripper and tabulated. They are the finger chain's workspace,
  # derived from its forward kinematics over its joint limits, exactly as the
  # arm's reach is. A derived number can be checked against the model; a
  # tabulated one can only be trusted.
  # code: screwhead/analysis/gripper.py, tools/emit_gripper_trials.py
  - id: CMP-gripper-chain
    purpose: Parse a gripper into finger chains with screw axes, as for an arm
    outputs: [IFC-gripper__grasp]
    testable_capability: >-
      Reproduces the simulator's own fingertip kinematics across the actuated
      range, for parallel-jaw and linkage grippers alike
    failure_modes:
      - {id: FM-linkage-as-open-chain, observable: a coupled gripper is parsed as an open chain and its pads move independently}
      - {id: FM-coupling-ignored, observable: equality-constrained joints are driven separately and the linkage tears}
      - {id: FM-slide-vs-hinge, observable: a prismatic finger joint is read as revolute}
    remediation: The five-step conversion, with closed loops cut at one passive joint into two open chains (ch.7 sec.4.3)

  # code: screwhead/analysis/gripper.py (pad pose from observed joints)
  - id: CMP-tendon-coupling
    purpose: Relate a gripper's actuated command to its passive finger joints
    inputs: [IFC-gripper__grasp]
    testable_capability: >-
      Predicts the pad separation a command produces, or declares the mapping
      dynamic and falls back to the observed joint vector
    failure_modes:
      - {id: FM-soft-coupling-as-kinematic, observable: a spring-coupled linkage is modelled as a hard constraint and predicted pad poses drift under load}
      - {id: FM-command-assumed-monotone, observable: pad separation is assumed to decrease with the close command, which a compliant linkage does not guarantee}
    remediation: Read pad pose from the observed joint vector by open-chain FK; treat command-to-separation as dynamic, not kinematic

  # code: screwhead/analysis/grasp.py
  - id: CMP-grasp-map
    purpose: Build the grasp matrix from contacts and decide force closure
    inputs: [IFC-gripper__grasp]
    testable_capability: >-
      Decides force closure by exhaustive escape-direction search, and exhibits a
      strictly positive internal-force certificate for grasps it accepts
    failure_modes:
      - {id: FM-stall-read-as-failure, observable: a non-converged certificate search is reported as no closure, which the method cannot show}
      - {id: FM-moment-dropped, observable: contacts balance forces while the object is free to rotate}
      - {id: FM-wrench-order, observable: the wrench is built force-first rather than moment-first and every test scrambles}
      - {id: FM-planar-result-in-space, observable: an antipodal pair is accepted in 3D, where it cannot resist moment about the finger line}
    remediation: Escape direction decides, alternating projection exhibits, never the reverse (ch.12 sec.4.8)

  # Implemented as screwhead/sim/gripper_servo.py: the policy names a target aperture in
  # metres and a fixed servo, reading the gripper's measured aperture and rate, emits
  # robosuite's close/hold/open. Adopted because the drawer program's lag-compensated
  # pre-shape, learned as a 3-valued command, matched the teacher on 20-25% of held-out
  # pre-shape frames and the drawer fell to 0/10 after DAgger.
  # code: scripts/smell_check.sh, ruff.toml -- the standard itself is docs/code_smell_guide.md
  - id: CMP-code-standard
    purpose: Keep every file of ours within the standard in docs/code_smell_guide.md
    outputs: []
    testable_capability: >-
      scripts/smell_check.sh exits 0 on the whole repository: no unused code, no blocks
      duplicated across files, no function over the complexity limits, no unnamed float
      thresholds, no blind excepts without a recorded reason
    failure_modes:
      - {id: FM-duplicated-logic, observable: pylint duplicate-code reports a block of 6+ similar lines in two files}
      - {id: FM-dead-code, observable: vulture reports a function, method or attribute nothing uses}
      - {id: FM-complexity, observable: ruff C901/PLR0912/PLR0915 -- complexity over 15, 15 branches or 60 statements}
      - {id: FM-swallowed-errors, observable: ruff BLE001 -- a blind except without noqa and a reason}
    remediation: >-
      Fix by the guide's rule for that smell; a justified exception carries `# noqa: CODE`
      with the reason, or an entry with its reason in the checker's IGNORE list

  # code: screwhead/sim/gripper_servo.py, tools/relabel_gripper.py
  - id: CMP-gripper-decoder
    purpose: Decode a grasp intent (target aperture) to this gripper's actuated command
    inputs: [IFC-expert__ik, IFC-gripper__grasp]
    testable_capability: >-
      Realises the same object-side grasp on grippers of differing finger count
      and linkage, and reports infeasible rather than attempting a grasp outside
      the finger workspace
    failure_modes:
      - {id: FM-aperture-mismatch, observable: the same normalised aperture yields different contact on a different gripper}
      - {id: FM-tabulated-span, observable: reachable pad separation is hardcoded per gripper rather than derived from its chain}
      - {id: FM-infeasible-attempted, observable: a feature wider than the jaw can straddle is attempted rather than refused}
      - {id: FM-camera-offset, observable: transfer fails on wrist-camera geometry rather than on the gripper itself}
      - {id: FM-regressed-between-modes, observable: a regressed target lands between pre-shape and closed and the servo holds 9 mm instead of squeezing}
      - {id: FM-decode-mismatch, observable: the target is decoded one way when data is collected and another way when the policy is evaluated}
    remediation: >-
      Derive the pad-separation workspace from finger FK over joint limits; refuse
      what lies outside it. Snap the student's target to the program levels
      (snap_channel) and store the levels in the checkpoint so every rollout decodes alike

interfaces:
  - id: IFC-randomizer__teacher
    producer: CMP-scene-randomizer
    consumer: CMP-scripted-teacher
    semantics: A settled episode start -- object layout, robot start pose, instruction
    units: metres and radians
    frame: robot base frame
    producer_guarantees:
      - the instruction's relation holds at the first observed state
      - objects are at rest when the episode starts
    consumer_assumptions:
      - the instruction's relation holds at the first observed state
      - objects are at rest when the episode starts

  - id: IFC-program__teacher
    producer: CMP-skill-library
    consumer: CMP-scripted-teacher
    semantics: A demonstration program for one task -- a Markov feedback law plus its parameters
    units: metres, radians, and the apertures the gripper is asked to hold
    frame: robot base frame for targets, tool frame for the twists it emits
    producer_guarantees:
      - every parameter is derived from the task's goal predicates or the scene's measured geometry
      - the program's action is a function of the current state, so any visited state can be labelled
    consumer_assumptions:
      - every parameter is derived from the task's goal predicates or the scene's measured geometry
      - the program's action is a function of the current state, so any visited state can be labelled

  - id: IFC-teacher__expert
    producer: CMP-scripted-teacher
    consumer: CMP-action-expert
    semantics: Action label at the state actually visited, whoever drove there
    units: >-
      twist normalised to [-1, 1] with one unit = 10 rad/s and 1 m/s (ActionSpec
      0.5 rad and 0.05 m per step at 20 Hz; the programs cap at 1.2 rad/s and
      0.25 m/s); gripper as the program's command {-1 open, 0 hold, +1 close} or, relabelled
      from its phase, the target-aperture channel 1 - 2 a / 0.08 m
    frame: tool frame at the current pose
    timing: {chunk_steps: 1, control_hz: 20}
    producer_guarantees:
      - labels are computed from the visited state, not replayed from a stored path
      - the gripper label is either the program's three-valued command or the aperture it regulates toward
    consumer_assumptions:
      - labels are computed from the visited state, not replayed from a stored path
      - the gripper label is either the program's three-valued command or the aperture it regulates toward

  - id: IFC-encoder__expert
    producer: CMP-vision-encoder
    consumer: CMP-action-expert
    semantics: Patch tokens for the agent-view and wrist cameras
    units: dimensionless features, 64 tokens x 768 per camera, float16
    frame: image grid, 128 px renders resized to 224
    producer_guarantees:
      - the encoder is frozen and identical at training and rollout
      - the same preprocessing runs live and in the cached dataset
    consumer_assumptions:
      - the encoder is frozen and identical at training and rollout
      - the same preprocessing runs live and in the cached dataset

  - id: IFC-poe__kinematics
    producer: CMP-poe-conversion
    consumer: CMP-kinematics
    semantics: Home pose M and one screw axis per joint, with joint types and limits
    units: metres and radians
    frame: screw axes in the reference frame at zero (space form), with the
      body form B = Ad(M^-1) S derived; M maps the reference frame to the tool at zero
    producer_guarantees:
      - axes are ordered base to tool
      - revolute axes are unit norm
      - joint limits accompany every axis
    consumer_assumptions:
      - axes are ordered base to tool
      - revolute axes are unit norm
      - joint limits accompany every axis

  - id: IFC-kinematics__ik
    producer: CMP-kinematics
    consumer: CMP-ik-decoder
    semantics: Body Jacobian at the current configuration
    units: per-radian for revolute columns, dimensionless for prismatic
    frame: tool frame
    producer_guarantees:
      - Jacobian is evaluated at the configuration supplied, not at home
      - column count equals the arm's joint count
    consumer_assumptions:
      - Jacobian is evaluated at the configuration supplied, not at home
      - column count equals the arm's joint count

  - id: IFC-expert__ik
    producer: CMP-action-expert
    consumer: CMP-ik-decoder
    semantics: Body twist and gripper intent, one per control step
    units: metres per second and radians per second
    frame: tool frame at the current pose
    # chunk 1, not 16: the student is trained on single-step DAgger labels
    timing: {chunk_steps: 1}
    producer_guarantees:
      - twist is expressed in the tool frame at the current pose
      # Two executions exist. Command mode: robosuite reads only the SIGN, so a
      # regressed output is decoded to -1/0/+1 (0 of 92 hold labels executed before).
      # Target mode (--gripper-target): g = 1 - 2 a / 0.08 m, executed by GripperServo.
      - gripper intent is a command in -1, 0, +1 or a target-aperture channel, as the checkpoint declares
      # A guarantee rather than an assumption: the policy emits a bounded action
      # in [-1, 1] scaled by fixed constants, so the twist is bounded.
      - twist magnitude is reachable within one control period
    consumer_assumptions:
      - twist is expressed in the tool frame at the current pose
      - gripper intent is a command in -1, 0, +1 or a target-aperture channel, as the checkpoint declares
      - twist magnitude is reachable within one control period

  - id: IFC-ik__controller
    producer: CMP-ik-decoder
    consumer: CMP-action-expert
    semantics: Joint commands and the residual left unachieved
    units: radians for revolute joints, metres for prismatic
    frame: joint space of the arm named in the spec
    producer_guarantees:
      - a non-zero residual accompanies any target that was not reached
      - commands respect the declared joint limits
    consumer_assumptions:
      - a non-zero residual accompanies any target that was not reached
      - commands respect the declared joint limits

  - id: IFC-spec__expert
    producer: CMP-spec-conditioning
    consumer: CMP-action-expert
    semantics: Per-joint specification tokens, variable length
    units: metres and radians
    frame: tool frame
    producer_guarantees:
      - token count equals the arm's joint count
      - tokens are masked rather than zero-padded where an arm has fewer joints
    consumer_assumptions:
      - token count equals the arm's joint count
      - tokens are masked rather than zero-padded where an arm has fewer joints

  - id: IFC-gripper__grasp
    producer: CMP-gripper-chain
    consumer: CMP-grasp-map
    semantics: Fingertip pad poses and contact normals as a function of the actuated command
    units: metres and radians
    frame: gripper flange frame
    producer_guarantees:
      - pad poses satisfy the gripper's own coupling constraints
      - the reachable pad-separation range is derived from joint limits, not tabulated
      - contact normals point into the object
    consumer_assumptions:
      - pad poses satisfy the gripper's own coupling constraints
      - the reachable pad-separation range is derived from joint limits, not tabulated
      - contact normals point into the object

  - id: IFC-demo__twist
    producer: CMP-retarget
    consumer: CMP-action-expert
    semantics: Demonstration relabelled as tool twists, the training target
    units: metres per second and radians per second
    frame: tool frame at each demonstration step
    producer_guarantees:
      - twists come from the demonstrating robot's own kinematics
      - the source embodiment is recorded with every twist
    consumer_assumptions:
      - twists come from the demonstrating robot's own kinematics
      - the source embodiment is recorded with every twist

contracts:
  # ---- Gate 1: the conversion is exact. Nothing downstream means anything
  # until this is supported, because a parsing bug presents as a failure to
  # generalise.
  - id: CTR-poe-matches-sim
    subject: CMP-poe-conversion
    claim_type: capability
    metrics:
      - {id: fk_pos_err, unit: metres}
      - {id: fk_rot_err, unit: radians}
    # 0.995 at n_min 800, not 0.999 at 200: the all-pass posterior lower bound
    # is 0.9956 at n=800 and only reaches 0.999 near n=5000. A threshold the
    # declared sample size cannot clear reports `contested` on a perfect run.
    acceptance: {rule: "fk_pos_err < 1e-6 and fk_rot_err < 1e-6", target_rate: 0.995}
    conditions:
      - {id: six_dof, when: "dof == 6"}
      - {id: seven_dof, when: "dof == 7"}
    compatibility_key: [robot]
    evaluable_by: [TST-poe-fk]
    sufficiency: {n_min: 800, max_ci_width: 0.01}

  - id: CTR-jacobian-correct
    subject: CMP-kinematics
    claim_type: capability
    metrics:
      - {id: jac_max_err, unit: relative}
    acceptance: {rule: "jac_max_err < 1e-5", target_rate: 0.995}
    compatibility_key: [robot]
    evaluable_by: [TST-jacobian-fd]
    sufficiency: {n_min: 800, max_ci_width: 0.01}

  # ---- Gate 2: the decoder is safe to put inside a training graph.
  # Split from the near-singular regime deliberately. Measured per-robot rates
  # are 0.996-0.998 here against 0.905-0.950 near a singularity; one shared
  # target_rate would have to sit at 0.80 to cover both, and would then let an
  # interior regression from 0.997 to 0.85 pass unnoticed.
  - id: CTR-ik-converges
    subject: CMP-ik-decoder
    claim_type: capability
    metrics:
      - {id: converged, unit: bool}
      - {id: final_pos_err, unit: metres}
    acceptance: {rule: "converged == true and final_pos_err < 1e-4", target_rate: 0.98}
    compatibility_key: [robot, damping]
    evaluable_by: [TST-ik-convergence]
    sufficiency: {n_min: 800, max_ci_width: 0.02}

  # The known limitation, measured rather than hidden. Failures here are stuck,
  # not starved: ur5e scores 35/38 at both 200 and 600 iterations. Retargeting
  # is expected to drop these frames, which is CMP-retarget's problem.
  - id: CTR-ik-near-singular
    subject: CMP-ik-decoder
    claim_type: capability
    metrics:
      - {id: converged, unit: bool}
      - {id: final_pos_err, unit: metres}
    acceptance: {rule: "converged == true and final_pos_err < 1e-4", target_rate: 0.80}
    compatibility_key: [robot, damping]
    evaluable_by: [TST-ik-near-singular]
    sufficiency: {n_min: 150, max_ci_width: 0.15}

  - id: CTR-ik-step-bounded
    subject: CMP-ik-decoder
    claim_type: capability
    metrics:
      - {id: bound_ok, unit: bool}
    # Not 1.0. `supported` requires the posterior lower bound to exceed the
    # target, and lo > 1.0 is unreachable -- a zero-tolerance contract can only
    # ever be refuted, never supported, so it could never satisfy a policy.
    acceptance: {rule: "bound_ok == true", target_rate: 0.995}
    compatibility_key: [robot, damping]
    evaluable_by: [TST-ik-step-bound]
    sufficiency: {n_min: 800, max_ci_width: 0.01}

  - id: CTR-infeasible-reported
    subject: IFC-ik__controller
    claim_type: interface
    metrics:
      - {id: residual_reported, unit: bool}
    acceptance: {rule: "residual_reported == true", target_rate: 0.995}
    compatibility_key: [robot]
    evaluable_by: [TST-ik-unreachable]
    sufficiency: {n_min: 800, max_ci_width: 0.01}

  - id: CTR-nullspace-tool-invariant
    subject: CMP-nullspace
    claim_type: capability
    metrics:
      - {id: tool_drift, unit: metres}
    acceptance: {rule: "tool_drift < 1e-8", target_rate: 0.99}
    compatibility_key: [robot, inverse_kind]
    evaluable_by: [TST-nullspace-drift]
    sufficiency: {n_min: 800, max_ci_width: 0.01}

  # Scored on the TOOL trajectory, not on joint angles. A pose does not
  # determine a configuration -- on a redundant arm a whole self-motion manifold
  # maps to the same pose, and even the 6-DoF ur5e switches IK branch mid
  # trajectory. Measured joint RMSE is ~0.1 rad on all five arms while pose
  # error is ~6e-6, so a joint-agreement rule would refute a retarget that
  # reproduces the demonstrated task exactly.
  - id: CTR-retarget-roundtrips
    subject: CMP-retarget
    claim_type: capability
    metrics:
      - {id: pose_err, unit: metres}
    # 0.98, not 0.99: on real demonstrations the filtered slice runs ~0.997 and
    # its posterior lower bound lands just under 0.99, so the tighter bar would
    # report contested on a round-trip that is correct.
    acceptance: {rule: "pose_err < 1e-4", target_rate: 0.98}
    compatibility_key: [robot, task_suite]
    evaluable_by: [TST-retarget-roundtrip, TST-retarget-libero]
    sufficiency: {n_min: 200, max_ci_width: 0.05}

  # ---- Gate 2: grounding. Every rollout contract below is scored on the one
  # declared randomized evaluation (header). Bars were simulated against bb-1
  # (94% equal-tailed Beta(1,1) posterior) before any token-VLA result existed.

  # Precondition for every rate that follows: the randomization must not change
  # what the instruction means. Scored on every episode of every driver.
  # 0.95 at n_min 200: a true 0.99 is supported with p=0.95, a true 0.90 refuted
  # with p=0.86.
  - id: CTR-randomization-preserves-instruction
    subject: CMP-scene-randomizer
    claim_type: capability
    metrics:
      - {id: relation_at_start, unit: bool}
    acceptance: {rule: "relation_at_start == true", target_rate: 0.95}
    compatibility_key: [randomization]
    evaluable_by: [TST-teacher-randomized, TST-student-randomized, TST-student-blind]
    sufficiency: {n_min: 200, max_ci_width: 0.10}

  # The data source. Per task, because the programs are per task and a pooled
  # 96% hid a drawer task at 0/10 once. 0.75 at n_min 50: a task at the measured
  # pooled 0.965 is supported with p=0.998, a task at 0.90 with p=0.77, a task at
  # 0.70 is never supported. The teacher executes through TwistServo, so this is
  # also the servo's end-to-end check (CMP-twist-servo has no separate test).
  - id: CTR-teacher-solves-randomized
    subject: CMP-scripted-teacher
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.75}
    conditions:
      - {id: task0, when: "task == 0"}
      - {id: task1, when: "task == 1"}
      - {id: task2, when: "task == 2"}
      - {id: task3, when: "task == 3"}
      - {id: task4, when: "task == 4"}
      - {id: task5, when: "task == 5"}
      - {id: task6, when: "task == 6"}
      - {id: task7, when: "task == 7"}
      - {id: task8, when: "task == 8"}
      - {id: task9, when: "task == 9"}
    compatibility_key: [teacher_revision, randomization]
    evaluable_by: [TST-teacher-randomized]
    sufficiency: {n_min: 50, max_ci_width: 0.25}

  # The premise of gate 2, and the claim the canonical benchmark failed: denied
  # its images, a policy trained on the same data does NOT succeed. Scored as
  # success == false so that support means the benchmark demands vision.
  # Measured so far: blind CLIP students 4% and 1%. 0.85 at n_min 200: blind at
  # 4% success is supported with p=1.0, at 20% refuted with p=0.53.
  - id: CTR-blind-policy-fails
    subject: CMP-scene-randomizer
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == false", target_rate: 0.85}
    compatibility_key: [policy_revision, randomization]
    evaluable_by: [TST-student-blind]
    sufficiency: {n_min: 200, max_ci_width: 0.12}

  # The grounded student. 0.65 is the midpoint of the best measured student
  # (0.33, CLIP features after one DAgger round) and the teacher (0.965), fixed
  # before the patch-token student was evaluated. At n_min 200 a true 0.75 is
  # supported with p=0.89; 0.33 is refuted with certainty.
  # Replaces CTR-libero-source-arm, whose canonical-init test a blind policy passes.
  - id: CTR-student-succeeds-randomized
    subject: CMP-action-expert
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.65}
    compatibility_key: [policy_revision, randomization]
    evaluable_by: [TST-student-randomized]
    sufficiency: {n_min: 200, max_ci_width: 0.12}

  # DIAGNOSTIC, not in any policy. Where a localization failure would show: the
  # student first closes the gripper away from the grasp the program would choose.
  # Calibrated from the trials themselves, not the feature study's ~6 mm guess:
  # success given the offset at first close was flat below 40 mm (token r2, 200
  # episodes: 0.95 / 0.94 / 0.93 / 1.00 for 0-6 / 6-12 / 12-20 / 20-40 mm) and
  # collapsed above it (0.12). The first close is often corrected, so millimetres
  # below 40 do not predict failure. The teacher bucket checks the metric itself.
  - id: CTR-closes-at-the-grasp
    subject: CMP-action-expert
    claim_type: capability
    metrics:
      - {id: closed, unit: bool}
      - {id: grasp_offset_mm, unit: millimetres}
    acceptance: {rule: "closed == true and grasp_offset_mm < 40.0", target_rate: 0.75}
    conditions:
      - {id: teacher_driven, when: "driver == 'teacher'"}
      - {id: student_driven, when: "driver == 'student' and zero == 'none'"}
      - {id: blind_driven, when: "driver == 'student' and zero == 'image'"}
    compatibility_key: [policy_revision, randomization]
    evaluable_by: [TST-teacher-randomized, TST-student-randomized, TST-student-blind]
    sufficiency: {n_min: 200, max_ci_width: 0.12}

  # ---- Gate 2b: generalization, the guard against tuning these ten tasks.
  # Declared before either is built, so neither bar can be fitted to a result.

  # Train on the other tasks, evaluate on the held-out ones, same suite, same
  # randomization. Tasks 2, 5 and 9 are held out first: their teacher slices are supported
  # (0.98, 0.92, 0.87), so a failure is the student's. The drawer stays in training because
  # its pre-shape skill appears in no other task.
  # 0.3 at n_min 60 (three held-out tasks x 20 episodes):
  # a true 0.5 is supported with p=0.92, a blind-level 0.05 is refuted with certainty,
  # and 0.3 itself stays contested. The bar is "it transfers something", not a
  # performance claim -- the trained-task rate is 0.83-0.88.
  - id: CTR-held-out-task
    subject: CMP-action-expert
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.3}
    compatibility_key: [policy_revision, randomization, heldout_tasks]
    evaluable_by: [TST-heldout-task]
    sufficiency: {n_min: 60, max_ci_width: 0.30}

  # The teacher for a task nobody hand-wrote: same bar and sample size as the
  # hand-written programs (CTR-teacher-solves-randomized), per task.
  - id: CTR-skill-teacher-solves-unseen
    subject: CMP-skill-library
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.75}
    compatibility_key: [task_suite, task, teacher_revision]
    evaluable_by: [TST-skill-teacher-unseen]
    sufficiency: {n_min: 50, max_ci_width: 0.25}

  # Reliability is a different claim from "can solve it": a teacher that succeeds 75% of
  # the time spends a quarter of every collection run on failures and keeps only the
  # layouts it happens to be good at, which biases the demonstrations. The bar for
  # collecting from a task is 0.9 at its lower bound. Per task, as a slice, so one
  # broken task cannot hide inside a suite average.
  # One run per code revision decides it: the gate is deterministic.
  - id: CTR-code-clean
    subject: CMP-code-standard
    claim_type: capability
    metrics:
      - {id: clean, unit: bool}
    acceptance: {rule: "clean == true", target_rate: 0.1}
    compatibility_key: [code_revision]
    evaluable_by: [TST-smell-check]
    sufficiency: {n_min: 1, max_ci_width: 1.0}

  # A teacher-reliability number is only evidence if the same seed reproduces the same
  # episode (consistency.yaml: BRN-reliability-evidence-valid). Before LIBERO's fixture
  # re-sampling was seeded, identical runs diverged.
  - id: CTR-teacher-deterministic
    subject: CMP-skill-library
    claim_type: capability
    metrics:
      - {id: reproducible, unit: bool}
    acceptance: {rule: "reproducible == true", target_rate: 0.8}
    compatibility_key: [teacher_revision]
    evaluable_by: [TST-teacher-deterministic]
    sufficiency: {n_min: 16, max_ci_width: 0.3}

  # How the teacher sets objects down and moves (consistency.yaml: BRN-scan-then-place,
  # BRN-pinch-for-the-whole-place, BRN-profiled-twists). Baseline at 4edb9d0: deliberate
  # releases 14-29 mm (up to 88) above the surface, grip drops from 0.2-0.36 m, tool
  # acceleration p95 3.5-5 m/s^2 with peaks to 35.
  - id: CTR-teacher-gentle
    subject: CMP-skill-library
    claim_type: capability
    metrics:
      - {id: release_gap_mm, unit: mm}
      - {id: drop_count, unit: count}
    acceptance: {rule: "release_gap_mm >= 0 and release_gap_mm <= 5 and drop_count == 0", target_rate: 0.9}
    compatibility_key: [teacher_revision]
    evaluable_by: [TST-teacher-motion]
    sufficiency: {n_min: 20, max_ci_width: 0.3}

  - id: CTR-teacher-smooth
    subject: CMP-skill-library
    claim_type: capability
    metrics:
      - {id: acc_p95, unit: m/s^2}
      - {id: reanchors, unit: count}
    acceptance: {rule: "acc_p95 <= 2.0 and reanchors == 0", target_rate: 0.9}
    compatibility_key: [teacher_revision]
    evaluable_by: [TST-teacher-motion]
    sufficiency: {n_min: 20, max_ci_width: 0.3}

  - id: CTR-teacher-reliable
    subject: CMP-skill-library
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.9}
    compatibility_key: [task_suite, task, teacher_revision]
    evaluable_by: [TST-teacher-reliability]
    sufficiency: {n_min: 20, max_ci_width: 0.25}

  # ---- Gate 3: the premise. If the padded-vector baseline transfers fine,
  # there is nothing to fix and the project has no reason to exist.
  # Split in two: opposite expected verdicts need opposite bars, and a bar is
  # per contract.
  # NOT RUNNABLE YET. Both halves must be measured on the gate-2 evaluation:
  # at canonical init the source half is passed by a blind trajectory prior and
  # the swap half fails for the same trivial reason. The tests below exit
  # non-zero until PrivilegedEnv takes a robot and gripper and a joint-space
  # student is trained on the same teacher data.
  - id: CTR-baseline-works-on-source
    subject: CMP-action-expert
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.3}
    compatibility_key: [robot, gripper, task_suite, policy_revision]
    evaluable_by: [TST-baseline-source]
    sufficiency: {n_min: 100, max_ci_width: 0.20}

  # Bucketed by WHICH factor was swapped. Panda -> UR5e in LIBERO changes the
  # arm AND the gripper at once, so an unfactored result cannot say which one
  # broke. robosuite takes gripper_types independently.
  - id: CTR-baseline-fails-swap
    subject: CMP-action-expert
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == false", target_rate: 0.8}
    conditions:
      - {id: arm_only, when: "arm_swapped == true and gripper_swapped == false"}
      - {id: gripper_only, when: "arm_swapped == false and gripper_swapped == true"}
      - {id: both, when: "arm_swapped == true and gripper_swapped == true"}
    compatibility_key: [robot, gripper, task_suite, policy_revision]
    evaluable_by: [TST-baseline-heldout]
    sufficiency: {n_min: 100, max_ci_width: 0.20}

  # ---- The thesis.
  - id: CTR-spec-is-used
    subject: CMP-spec-conditioning
    claim_type: capability
    metrics:
      - {id: spec_sensitivity, unit: ratio}
    acceptance: {rule: "spec_sensitivity > 5.0", target_rate: 0.9}
    compatibility_key: [policy_revision]
    evaluable_by: [TST-spec-sensitivity]
    sufficiency: {n_min: 50, max_ci_width: 0.2}

  # Same bar as the grounded student on its own arm: transfer means keeping the
  # gate-2 rate, not clearing a sanity floor.
  - id: CTR-heldout-embodiment
    subject: CMP-action-expert
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.65}
    conditions:
      - {id: arm_only, when: "arm_swapped == true and gripper_swapped == false"}
      - {id: gripper_only, when: "arm_swapped == false and gripper_swapped == true"}
      - {id: both, when: "arm_swapped == true and gripper_swapped == true"}
    compatibility_key: [robot, gripper, task_suite, policy_revision]
    evaluable_by: [TST-libero-heldout]
    sufficiency: {n_min: 200, max_ci_width: 0.12}

  # Separates kinematic transfer from visual transfer. The wrist camera moves
  # with the gripper (measured 49 mm vs 97 mm camera-to-TCP), and the student is
  # now grounded in exactly those pixels -- so this confound got stronger, not
  # weaker, when gate 2 made the policy use its cameras.
  - id: CTR-transfer-is-kinematic
    subject: CMP-gripper-decoder
    claim_type: capability
    metrics:
      - {id: success, unit: bool}
    acceptance: {rule: "success == true", target_rate: 0.65}
    conditions:
      - {id: camera_held_fixed, when: "camera_moved == false"}
      - {id: camera_moved, when: "camera_moved == true"}
    compatibility_key: [robot, gripper, task_suite, policy_revision]
    evaluable_by: [TST-libero-heldout]
    sufficiency: {n_min: 200, max_ci_width: 0.12}

  - id: CTR-twist-delta-roundtrip
    subject: CMP-action-interface
    claim_type: capability
    metrics:
      - {id: roundtrip_err, unit: metres}
    acceptance: {rule: "roundtrip_err < 1e-6", target_rate: 0.995}
    compatibility_key: [robot, task_suite]
    evaluable_by: [TST-action-interface]
    sufficiency: {n_min: 800, max_ci_width: 0.01}

  # ---- Gripper contracts. The same shape as the arm's: geometry first, then
  # the decoder, then feasibility. CTR-span-derived is the one that replaces a
  # per-gripper lookup table with a claim that can be refuted.
  # A precondition, not a nicety. Every geometric claim downstream assumes the
  # simulated gripper stays inside the range its own file declares. Measured,
  # robosuite's Robotiq85 does not: right_inner_knuckle_joint leaves a declared
  # [0, 0.8757] by 1.358 rad under tendon load, while PandaGripper's slides
  # violate by exactly 0.00000. A gripper that exceeds its declared range by
  # more than the range itself cannot be reasoned about kinematically, so this
  # gates the rest rather than being discovered through their failure.
  - id: CTR-declared-limits-respected
    subject: CMP-gripper-chain
    claim_type: capability
    metrics:
      - {id: limit_violation, unit: radians}
    acceptance: {rule: "limit_violation < 1e-3", target_rate: 0.99}
    conditions:
      - {id: parallel_jaw, when: "linkage == false"}
      - {id: linkage, when: "linkage == true"}
    compatibility_key: [gripper]
    evaluable_by: [TST-declared-limits]
    sufficiency: {n_min: 200, max_ci_width: 0.05}

  - id: CTR-finger-fk-matches-sim
    subject: CMP-gripper-chain
    claim_type: capability
    metrics:
      - {id: pad_pos_err, unit: metres}
    acceptance: {rule: "pad_pos_err < 1e-6", target_rate: 0.995}
    conditions:
      - {id: parallel_jaw, when: "linkage == false"}
      - {id: linkage, when: "linkage == true"}
    compatibility_key: [gripper]
    evaluable_by: [TST-finger-fk]
    sufficiency: {n_min: 400, max_ci_width: 0.02}

  # Was CTR-loop-closure-holds, which asserted log(T_loop)=0 for a four-bar.
  # Measured: robosuite's Robotiq85 couples its fingers with a soft <tendon>
  # spring, and the tendon length varies 0.26 to 3.06 across the command range
  # rather than holding constant. There is no hard constraint to close, so the
  # claim is now the one that survives -- pad pose is exact FK of the OBSERVED
  # joints, whatever dynamics put them there.
  - id: CTR-pad-pose-from-observed
    subject: CMP-tendon-coupling
    claim_type: capability
    metrics:
      - {id: pad_pos_err, unit: metres}
    acceptance: {rule: "pad_pos_err < 1e-6", target_rate: 0.995}
    compatibility_key: [gripper]
    evaluable_by: [TST-loop-closure]
    sufficiency: {n_min: 400, max_ci_width: 0.02}

  # The claim that a lookup table cannot make. If pad separation derived from
  # finger FK over joint limits reproduces what the live model does, the
  # geometry is understood rather than memorised -- and it then extends to a
  # gripper nobody has measured.
  # A ONE-SIDED claim, not an equality, and the measurement is why. For a
  # parallel jaw the reachable pad separation IS the finger chain's workspace
  # over its joint limits. For a spring-coupled linkage the joints reachable in
  # practice are set by dynamics, so joint limits give a SUPERSET. An outer
  # bound is still the right object for feasibility: a feature wider than the
  # derived open span is provably ungraspable, and refusing exactly those is a
  # sound one-sided guarantee. Claiming equality would be refuted by the
  # Robotiq85 and would deserve to be.
  - id: CTR-span-bounds-observed
    subject: CMP-gripper-decoder
    claim_type: capability
    metrics:
      - {id: bound_violated, unit: bool}
    acceptance: {rule: "bound_violated == false", target_rate: 0.99}
    conditions:
      - {id: parallel_jaw, when: "linkage == false"}
      - {id: linkage, when: "linkage == true"}
    compatibility_key: [gripper]
    evaluable_by: [TST-span-derived]
    sufficiency: {n_min: 200, max_ci_width: 0.05}

  - id: CTR-force-closure-decides
    subject: CMP-grasp-map
    claim_type: capability
    metrics:
      - {id: verdict_correct, unit: bool}
    acceptance: {rule: "verdict_correct == true", target_rate: 0.99}
    conditions:
      - {id: closed, when: "labelled_closed == true"}
      - {id: not_closed, when: "labelled_closed == false"}
    compatibility_key: [contact_model]
    evaluable_by: [TST-force-closure]
    sufficiency: {n_min: 400, max_ci_width: 0.02}

  - id: CTR-grasp-infeasible-reported
    subject: CMP-gripper-decoder
    claim_type: capability
    metrics:
      - {id: refused, unit: bool}
    acceptance: {rule: "refused == true", target_rate: 0.99}
    compatibility_key: [gripper]
    evaluable_by: [TST-grasp-infeasible]
    sufficiency: {n_min: 200, max_ci_width: 0.05}

tests:
  - id: TST-poe-fk
    layer: component
    targets: [CMP-poe-conversion]
    run: .venv/bin/python tools/emit_trials.py $OUT poe_fk --n 800 --seed 0
    metrics: [fk_pos_err, fk_rot_err]
    capture: [robot, dof, urdf_source]
    mandatory: true

  - id: TST-jacobian-fd
    layer: component
    targets: [CMP-kinematics]
    run: .venv/bin/python tools/emit_trials.py $OUT jacobian_fd --n 800 --seed 0
    metrics: [jac_max_err]
    capture: [robot, dof]

  - id: TST-ik-convergence
    layer: component
    targets: [CMP-ik-decoder]
    run: .venv/bin/python tools/emit_trials.py $OUT ik_convergence --n 1200 --seed 0 --iters 200 --sigma-thresh 0.02
    metrics: [converged, final_pos_err]
    capture: [robot, dof, damping, near_singular]

  - id: TST-ik-near-singular
    layer: component
    targets: [CMP-ik-decoder]
    run: .venv/bin/python tools/emit_trials.py $OUT ik_near_singular --n 200 --seed 0 --iters 200 --sigma-thresh 0.02
    metrics: [converged, final_pos_err]
    capture: [robot, dof, damping, near_singular, sigma_min]

  - id: TST-action-interface
    layer: component
    targets: [CMP-action-interface]
    run: .venv/bin/python tools/emit_trials.py $OUT action_interface --n 800 --seed 0
    metrics: [roundtrip_err]
    capture: [robot, task_suite, control_hz]

  - id: TST-ik-step-bound
    layer: component
    targets: [CMP-ik-decoder]
    run: .venv/bin/python tools/emit_trials.py $OUT ik_step_bound --n 1200 --seed 0 --sigma-thresh 0.02
    metrics: [bound_ok]
    capture: [robot, dof, damping, near_singular]

  - id: TST-ik-unreachable
    layer: interface
    targets: [CMP-ik-decoder]
    run: .venv/bin/python tools/emit_trials.py $OUT ik_unreachable --n 1200 --seed 0 --iters 200
    metrics: [residual_reported]
    capture: [robot, dof]

  - id: TST-nullspace-drift
    layer: component
    targets: [CMP-nullspace]
    run: .venv/bin/python tools/emit_trials.py $OUT nullspace_drift --n 1200 --seed 0
    metrics: [tool_drift]
    capture: [robot, dof, inverse_kind]

  - id: TST-retarget-roundtrip
    layer: component
    targets: [CMP-retarget]
    run: .venv/bin/python tools/emit_trials.py $OUT retarget_roundtrip --n 400 --seed 0
    metrics: [pose_err, joint_rmse]
    capture: [robot, dof, task_suite, horizon, near_singular_frames]

  - id: TST-retarget-libero
    layer: component
    targets: [CMP-retarget]
    run: .venv/bin/python tools/emit_trials.py $OUT retarget_libero --n 400 --seed 0
    metrics: [pose_err, joint_rmse]
    capture: [robot, dof, task_suite, horizon, near_singular_frames, task]

  - id: TST-declared-limits
    layer: component
    targets: [CMP-gripper-chain]
    run: .venv-libero/bin/python tools/emit_gripper_trials.py $OUT declared_limits --n 200 --seed 0
    metrics: [limit_violation]
    capture: [gripper, linkage, joint]

  - id: TST-finger-fk
    layer: component
    targets: [CMP-gripper-chain]
    run: .venv-libero/bin/python tools/emit_gripper_trials.py $OUT finger_fk --n 400 --seed 0
    metrics: [pad_pos_err]
    capture: [gripper, linkage, n_finger_joints]

  - id: TST-loop-closure
    layer: component
    targets: [CMP-tendon-coupling]
    run: .venv-libero/bin/python tools/emit_gripper_trials.py $OUT loop_closure --n 400 --seed 0
    metrics: [pad_pos_err]
    capture: [gripper, linkage]

  - id: TST-span-derived
    layer: component
    targets: [CMP-gripper-decoder]
    run: .venv-libero/bin/python tools/emit_gripper_trials.py $OUT span_derived --n 400 --seed 0
    metrics: [bound_violated]
    capture: [gripper, linkage, closed_sep, open_span]

  - id: TST-force-closure
    layer: component
    targets: [CMP-grasp-map]
    run: .venv/bin/python tools/emit_trials.py $OUT force_closure --n 1200 --seed 0
    metrics: [verdict_correct]
    capture: [contact_model, labelled_closed, n_contacts, friction]

  - id: TST-grasp-infeasible
    layer: component
    targets: [CMP-gripper-decoder]
    run: .venv-libero/bin/python tools/emit_gripper_trials.py $OUT grasp_infeasible --n 400 --seed 0
    metrics: [refused]
    capture: [gripper, feature_width, open_span]

  - id: TST-spec-sensitivity
    layer: component
    targets: [CMP-spec-conditioning]
    run: sh -c "echo blocked - no spec_sensitivity case exists in tools/emit_trials.py; the perturbation test was never written >&2; exit 2"
    metrics: [spec_sensitivity]
    capture: [policy_revision, perturbation]

  # ---- Gate 2 rollouts: one command, three drivers. The student checkpoints are
  # symlinks so the run line (and so the test version) stays fixed across DAgger
  # rounds; distill.py records the resolved file and its hash as policy_revision.
  # The teacher runs through GripperServo with the 5 cm/s approach floor, as it does when it
  # collects data. Proportional homing (v_min 0) is what the students stalled against.
  - id: TST-teacher-randomized
    layer: e2e
    targets: [CMP-scripted-teacher, CMP-scene-randomizer, CMP-twist-servo, CMP-gripper-decoder]
    run: env HF_HUB_OFFLINE=1 PYTHONPATH=third_party/LIBERO:. MUJOCO_GL=egl .venv-libero/bin/python tools/distill.py collect --teacher scripted --beta 1 --gripper-target --teacher-v-min 0.05 --episodes 50 --horizon 400 --layout-radius 0.08 --start-xy 0.10 --start-z 0.05 --start-yaw 30 --start-tilt 10 --start-null 0.3 --seed 555 --trials $OUT
    metrics: [success, relation_at_start, closed, grasp_offset_mm]
    capture: [task, driver, teacher_revision, randomization]
    cost: 60.0
    timeout_s: 21600

  - id: TST-student-randomized
    layer: e2e
    targets: [CMP-action-expert, CMP-vision-encoder, CMP-scene-randomizer]
    run: env HF_HUB_OFFLINE=1 PYTHONPATH=third_party/LIBERO:. MUJOCO_GL=egl .venv-libero/bin/python tools/distill.py collect --teacher scripted --student checkpoints/vla_student.pt --beta 0 --episodes 20 --horizon 400 --layout-radius 0.08 --start-xy 0.10 --start-z 0.05 --start-yaw 30 --start-tilt 10 --start-null 0.3 --seed 555 --trials $OUT
    metrics: [success, relation_at_start, closed, grasp_offset_mm]
    capture: [task, driver, zero, policy_revision, randomization]
    cost: 30.0
    timeout_s: 10800

  - id: TST-student-blind
    layer: e2e
    targets: [CMP-scene-randomizer, CMP-action-expert]
    run: env HF_HUB_OFFLINE=1 PYTHONPATH=third_party/LIBERO:. MUJOCO_GL=egl .venv-libero/bin/python tools/distill.py collect --teacher scripted --student checkpoints/vla_student_blind.pt --zero image --beta 0 --episodes 20 --horizon 400 --layout-radius 0.08 --start-xy 0.10 --start-z 0.05 --start-yaw 30 --start-tilt 10 --start-null 0.3 --seed 555 --trials $OUT
    metrics: [success, relation_at_start, closed, grasp_offset_mm]
    capture: [task, driver, zero, policy_revision, randomization]
    cost: 30.0
    timeout_s: 10800

  # ---- Gate 2b. Blocked until the scripts exist: the held-out split needs a training run
  # that excludes tasks, and the skill teacher is not written.
  - id: TST-heldout-task
    layer: e2e
    targets: [CMP-action-expert]
    run: env HF_HUB_OFFLINE=1 PYTHONPATH=third_party/LIBERO:. MUJOCO_GL=egl scripts/heldout_task.sh "2 5 9"
    metrics: [success]
    capture: [task, heldout_tasks, policy_revision, randomization]
    cost: 40.0

  - id: TST-skill-teacher-unseen
    layer: e2e
    targets: [CMP-skill-library, CMP-scripted-teacher]
    run: env HF_HUB_OFFLINE=1 PYTHONPATH=third_party/LIBERO:. MUJOCO_GL=egl .venv-libero/bin/python tools/skill_eval.py --suite libero_object --episodes 5 --trials runs/evidence/skill_libero_object.trials.json
    metrics: [success]
    capture: [task, task_suite, teacher_revision]
    cost: 60.0

  # The assessment: every task, 20 episodes, with the mechanism of each failure. Run it
  # through run_test; the per-episode diagnosis lands in runs/evidence/reliability/.
  - id: TST-smell-check
    layer: component
    targets: [CMP-code-standard]
    run: scripts/smell_check.sh
    metrics: [clean]
    capture: [code_revision]
    cost: 2.0
    timeout_s: 600

  - id: TST-teacher-motion
    layer: component
    targets: [CMP-skill-library]
    run: HF_HUB_OFFLINE=1 PYTHONPATH=third_party/LIBERO:. MUJOCO_GL=egl .venv-libero/bin/python tools/teacher_motion.py --out $OUT
    metrics: [release_gap_mm, drop_count, acc_p95, jerk_p95, reanchors, success]
    capture: [teacher_revision, task_suite, task]
    cost: 10.0
    timeout_s: 3600

  - id: TST-teacher-deterministic
    layer: component
    targets: [CMP-skill-library]
    run: python3 tools/teacher_determinism.py --out $OUT
    metrics: [reproducible]
    capture: [teacher_revision, task_suite, task]
    cost: 5.0
    timeout_s: 1800

  - id: TST-teacher-reliability
    layer: e2e
    targets: [CMP-skill-library]
    run: python3 tools/teacher_report.py --suites libero_object libero_spatial libero_goal --episodes 20 --out $OUT
    metrics: [success]
    capture: [task, task_suite, teacher_revision, mechanism]
    cost: 80.0
    timeout_s: 10800

  # ---- Gate 3 rollouts. Blocked, deliberately: the canonical-init rollout.py
  # cells these used to run measure a trajectory prior (see header).
  - id: TST-libero-heldout
    layer: e2e
    targets: [CMP-action-expert, CMP-gripper-decoder]
    run: sh -c "echo blocked - PrivilegedEnv has no robot or gripper swap and no joint-space student exists >&2; exit 2"
    metrics: [success]
    capture: [robot, gripper, dof, task_suite, policy_revision, camera_moved, task, arm_swapped, gripper_swapped]
    cost: 40.0

  - id: TST-baseline-source
    layer: e2e
    targets: [CMP-action-expert]
    run: sh -c "echo blocked - PrivilegedEnv has no robot or gripper swap and no joint-space student exists >&2; exit 2"
    metrics: [success]
    capture: [robot, gripper, dof, task_suite, policy_revision, task, arm_swapped, gripper_swapped]
    cost: 40.0

  - id: TST-baseline-heldout
    layer: e2e
    targets: [CMP-action-expert]
    run: sh -c "echo blocked - PrivilegedEnv has no robot or gripper swap and no joint-space student exists >&2; exit 2"
    metrics: [success]
    capture: [robot, gripper, dof, task_suite, policy_revision, task, arm_swapped, gripper_swapped]
    cost: 40.0

priors: []

policies:
  # Gate 1a. Do not put the decoder in a training graph until it is bounded and
  # honest about infeasibility.
  - id: POL-decoder-safe
    criteria:
      - {slice: CTR-poe-matches-sim, require: supported}
      - {slice: CTR-jacobian-correct, require: supported}
      - {slice: CTR-ik-converges, require: supported}
      - {slice: CTR-ik-near-singular, require: supported}
      - {slice: CTR-ik-step-bounded, require: supported}
      - {slice: CTR-infeasible-reported, require: supported}
    weights: null

  # Gate 1b. Gripper geometry before gripper transfer: a wrong pad pose presents
  # as a failed grasp.
  - id: POL-gripper-understood
    criteria:
      - {slice: CTR-declared-limits-respected, require: supported}
      - {slice: CTR-finger-fk-matches-sim, require: supported}
      - {slice: CTR-pad-pose-from-observed, require: supported}
      - {slice: CTR-span-bounds-observed, require: supported}
      - {slice: CTR-force-closure-decides, require: supported}
      - {slice: CTR-grasp-infeasible-reported, require: supported}
    weights: null

  # Gate 2. The instruction survives randomization, the teacher solves every
  # task, the benchmark defeats a blind policy, and the sighted student clears
  # its bar -- all on the same declared evaluation.
  - id: POL-grounded
    criteria:
      - {slice: CTR-randomization-preserves-instruction, require: supported}
      - {slice: CTR-teacher-solves-randomized, require: supported}
      - {slice: CTR-blind-policy-fails, require: supported}
      - {slice: CTR-student-succeeds-randomized, require: supported}
    weights: null

  # Gate 2b. Before spending on more suites or more arms: the head does something on a
  # task it never trained on, and the teacher for a new task is generated, not written.
  - id: POL-generalizes
    criteria:
      - {slice: CTR-held-out-task, require: supported}
      - {slice: CTR-skill-teacher-solves-unseen, require: supported}
    weights: null

  # Gate 3a. Nothing to fix unless a grounded baseline works on its own arm and
  # breaks on the swap.
  - id: POL-premise-survives
    criteria:
      - {slice: CTR-baseline-works-on-source, require: supported}
      - {slice: CTR-baseline-fails-swap, require: supported}
    weights: null

  # Gate 3b, the thesis. Held-out embodiment is the claim; spec sensitivity rules
  # out memorisation; the camera split rules out crediting the kinematics for a
  # visual result; blind failure keeps the whole chain on a grounded policy.
  - id: POL-thesis-supported
    criteria:
      - {slice: CTR-blind-policy-fails, require: supported}
      - {slice: CTR-student-succeeds-randomized, require: supported}
      - {slice: CTR-spec-is-used, require: supported}
      - {slice: CTR-heldout-embodiment, require: supported}
      - {slice: CTR-transfer-is-kinematic, require: supported}
    weights: null
